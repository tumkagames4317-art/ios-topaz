name: xnu-linux

# HOUSE RULE (cost us one reconstructed edit):
#   Run `git status` BEFORE any command that discards work --
#   git checkout -- <path>, git restore, git reset --hard, git stash drop.
#   Uncommitted edits in this tree are the only copy.
#
# Build kernel.development.sweet for platform=ginkgo on a Linux runner.
#
# Why this exists: xnu.yml runs on macos-14 and every dispatch since
# 2026-10-26 08:49 UTC is granted a runner, then ends with `steps: []` after
# exactly 15 minutes -- no step ever starts. That is a runner-inventory
# problem, not a workflow bug: the account is on the Free plan (2,000
# included minutes, macOS billed 10x) and the repository has zero
# self-hosted runners. See the probe run 40357687083: job queued 16:17:32Z,
# cancelled 16:27:54Z, steps=0, job timeout-minutes=120 never reached.
#
# Two properties of xnu-8796.121.2 SWEET make a Linux host worth trying:
#   * makedefs/MakeInc.def only force-loads the closed KDK archive for
#     T6000 / T8101 / VMAPPLE. SWEET is not in that list, and
#     osfmk/conf/files.arm64 only marks pmap/locore/start.s as
#     `nos_arm_pmap`/`nos_arm_asm` (KDK-supplied) for those same configs,
#     so every arm64 object of this kernel comes from open source;
#   * `IIG` is never expanded anywhere in makedefs/ for 8796 (DriverKit
#     .iig.cpp files are checked in), so the "Xcode 15 iig / IORPC ABI"
#     constraint that xnu.yml documents does not apply to xnu at all.
#
# What does NOT work out of the box on Linux, and is handled below:
#   * makedefs/MakeInc.cmd:480 has `sequence = $(if $(wordlist 1,$(1),...))`
#     and calls it with an empty argument -> GNU make dies with
#     "non-numeric second argument to 'wordlist'". Patched at fetch time.
#   * MakeInc.top:288 does `MEMORY_SIZE := $(shell /usr/sbin/sysctl ...)`.
#     It is an immediate assignment inside the makefile, so a command-line
#     MEMORY_SIZE is ignored. The /usr/sbin/sysctl shim below answers it.
#   * `<libc.h>` and `<copyfile.h>` (macOS-only) are needed by the host
#     tools in SETUP/. Provided as minimal shims in hostshim/.
#   * xnu's MIG runs as `$(MIG) ... -DMACH_KERNEL_PRIVATE -DKERNEL_SERVER=1`
#     and also emits headers via `-server /dev/null -user /dev/null
#     -header $@`, so the kernel #ifdefs must be expanded by cpp *inside*
#     migcom. A "strip the -D flags from the generated files" shortcut is
#     not equivalent, hence stage 5 builds the real tools.
#
# Only .github/workflows/ is touched: nothing here edits xnu/patches/ or
# the sources; every source fix is applied to the build-time copy.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: ginkgo (skips topaz-only patches)
        default: ginkgo
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      deep:
        description: also attempt the mig/migcom host tools and the ld64 link
        default: "true"

concurrency:
  # Strictly per-run. Several people dispatch this workflow on the same
  # branch, and a ref-keyed group with cancel-in-progress meant every new
  # dispatch silently killed the run already in flight: 40370234240 was
  # cancelled 59s in because two more runs landed on the same SHA. Runs
  # are expensive here, so they are allowed to overlap instead.
  group: xnu-linux-${{ github.run_id }}
  cancel-in-progress: false

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  # ld64 956.6 knows every flag xnu-8796 passes to the linker:
  # -image_base, -seg_page_size, -segment_order, -version_load_command,
  # -function_starts, -add_split_seg_info, -new_linker.
  CCTOOLS_REPO: https://github.com/tpoechtrager/cctools-port
  CCTOOLS_BRANCH: 1030.6.3-ld64-956.6
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # Empty tree shaped like an Xcode SDK/platform, so the paths makedefs
  # derives from `xcrun` have the structure its sed/notdir expect.
  FAKE_PLATFORMS: /opt/xcodeshim/Platforms
  # Apple's release manifest maps macOS 13.5 -> the exact open-source tags.
  RELEASE_URL: https://raw.githubusercontent.com/apple-oss-distributions/distribution-macOS/macos-135/release.json
  # Make the host compat shim global instead of patching xnu's Makefiles.
  #
  # CPATH appends an include path to every compile the GNU-make-driven build
  # performs, LIBRARY_PATH appends a link search path, and
  # C_INCLUDE_PATH/CPLUS_INCLUDE_PATH cover the C and C++ halves separately
  # because GNU make here drives both. The -include itself cannot go through
  # the environment (there is no standard CFLAGS-by-env hook that xnu's
  # makedefs honour without being patched), so stage 3 adds it to
  # MakeInc.cmd's CC/CXX invocation.
  CPATH: "/usr/local/include"
  C_INCLUDE_PATH: "/usr/local/include"
  CPLUS_INCLUDE_PATH: "/usr/local/include"
  # cctools-port keeps architecture/, machine/ and libkern/ under include/foreign.
  # <mach-o/swap.h> includes <architecture/byte_order.h>, which otherwise fails
  # with "fatal error: 'architecture/byte_order.h' file not found".
  #
  # Do NOT put include/foreign itself on the include path: it also holds
  # Apple-flavoured strings.h, stdio.h, stdlib.h, unistd.h, fcntl.h and
  # libc.h, and shadowing glibc with those breaks everything -- run
  # 40370458060 failed with "static declaration of 'bcmp' follows
  # non-static declaration" from foreign/strings.h. Stage 1c instead builds
  # this directory, symlinking only the subdirectories Mach-O needs.
  # runner.temp only exists inside a step, so a workflow-level env cannot use
  # it: GitHub rejected the whole file with
  #     Unrecognized named-value: 'runner'
  # at this line, which blocked dispatch entirely. $RUNNER_TEMP always points
  # at this path on the Ubuntu runner anyway.
  CCTOOLS_FOREIGN_INCLUDE: "/home/runner/work/_temp/machinc"
  # Pinned at workflow level so EVERY stage sees the same checkout path.
  # Stages 5b and 6 each set their own; Stage 5 did not, so
  #     '[' -f "$XROOT/bsd/sys/_types/_mach_port_t.h" ']'
  # expanded to '/bsd/sys/...' and silently took the fallback branch even
  # though xnu's own headers were sitting in the tree. Defining it once
  # here removes the class rather than the instance.
  XNU_SRC_ROOT: "${{ github.workspace }}/dxb/xnu"
  LIBRARY_PATH: "/usr/local/lib"
  LD_LIBRARY_PATH: "/usr/local/lib"

jobs:
  linux-build:
    runs-on: ubuntu-latest
    # Was 120. Every observed Linux run reaches its last step in well under an
    # hour, so a wedged stage should fail loudly rather than hold a runner.
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Report host and toolchain
        run: |
          uname -a
          head -3 /etc/os-release
          nproc; free -g | head -2
          clang --version || true

      # ---------------------------------------------------------------- deps
      - name: Install clang-15 and build deps
        timeout-minutes: 25
        run: |
          # Run 40367778595 died here with exit code 124 while the Azure mirror
          # was answering "Ign:" for libllvm15t64 (25 MB) and ccache, so the
          # step burned its whole budget retrying the same broken host. Point
          # apt at the canonical archive and let it retry per package.
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          grep -rh '^deb ' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -5 || true
          APT_OPTS="-o Acquire::Retries=8 -o Acquire::http::Timeout=60 \
                    -o Acquire::https::Timeout=60 \
                    -o Acquire::http::Pipeline-Depth=0 \
                    -o Dpkg::Options::=--force-confdef \
                    -o Dpkg::Options::=--force-confold"
          sudo DEBIAN_FRONTEND=noninteractive apt-get update $APT_OPTS
          # Two passes: the small packages should never be blocked by a flaky
          # 25 MB LLVM archive, and the LLVM set gets its own retry loop.
          sudo DEBIAN_FRONTEND=noninteractive timeout 480 apt-get install -y --no-install-recommends $APT_OPTS \
            build-essential libssl-dev libbz2-dev liblzma-dev zlib1g-dev libncurses-dev \
            uuid-dev libcap-dev bison flex libblocksruntime-dev \
            libc++abi-dev unifdef \
            libedit-dev libelf-dev python3 jq cmake ccache tcsh || true
          # tcsh: SETUP/config/doconf is `#!/bin/csh -f`. csh does not exist on
          # Ubuntu, so every generated subsystem Makefile died with
          #
          #     make[5]: .../dxb/xnu/SETUP/config/doconf: No such file or directory
          #     make[5]: *** [.../bsd/conf/Makefile:26: .../DEVELOPMENT/Makefile] Error 127
          #
          # 127 is "command not found" -- the *interpreter*, not the script.
          # bsd, security, iokit, osfmk, pexpert, libkern, libsa all failed the
          # same way in run 40411280264, which is why `install` died at
          # MakeInc.dir:85 while `installhdrs` had just succeeded for the first
          # time. doconf is a 313-line csh script doing real argv parsing
          # (switch/case/breaksw, $#argv, `...` command substitution), so it is
          # not worth hand-porting to sh; tcsh provides /bin/csh and is the
          # standard Ubuntu package for it.
          echo '=== csh for SETUP/config/doconf ==='
          ls -l /bin/csh 2>/dev/null || echo '  /bin/csh MISSING'
          if [ -x /bin/csh ]; then
            head -1 "$GITHUB_WORKSPACE/dxb/xnu/SETUP/config/doconf" 2>/dev/null || true
            /bin/csh -f -c 'echo "  csh works"' || echo '  ::error::csh present but not functional'
          else
            echo '  ::error::/bin/csh missing; doconf cannot run and install will fail'
          fi
          # unifdef: Stage 6's first wall. installhdrs ran, got past
          # build_setup (all six SETUP tools present), and then died with
          #     /bin/sh: 1: unifdef: not found
          #     make[1]: *** [MakeInc.top:425: build_exporthdrs_mi_bootstrap...] Error 2
          # It is invoked by INSTALLHDRS_RULE_template (MakeInc.rule:74,78):
          #     $$(UNIFDEF) $(4) $$< > ./$(3)/$$*.unifdef.$$$$$$$$
          # i.e. exactly once per exported header. We already pass
          # UNIFDEF=unifdef on the make command line but never installed it.
          # Ubuntu ships it as `unifdef` (noble: 2.12-1, universe).
          echo '=== header-install toolchain ==='
          for t in unifdef decomment replacecontents installfile unifdef; do
            printf '  %-16s %s\n' "$t" "$(command -v "$t" || echo '(not a PATH tool)')"
          done
          if command -v unifdef >/dev/null; then
            echo "unifdef: $(command -v unifdef)"
            unifdef -V 2>&1 | head -2 || true
          else
            echo "::error::unifdef is not installed; installhdrs cannot run"
            exit 1
          fi
          # libc++abi-dev is separate from the runtime package: Ubuntu ships
          # libc++abi.so.1 always, but the unversioned libc++abi.so that
          # `-lc++abi` needs only comes with the -dev package. kextsymboltool
          # references __cxa_demangle, which is a libc++abi symbol -- NOT a
          # libstdc++ one, so linking with clang++ or -lstdc++ does not help.
          # Verify the unversioned link exists and defines the symbol.
          echo '=== libc++abi availability ==='
          ls -la /usr/lib/x86_64-linux-gnu/libc++abi.so* 2>/dev/null || \
            echo "no libc++abi.so in /usr/lib/x86_64-linux-gnu"
          if nm -D /usr/lib/x86_64-linux-gnu/libc++abi.so 2>/dev/null \
               | grep -q '__cxa_demangle'; then
            echo "libc++abi.so: defines __cxa_demangle (good)"
          else
            echo "::warning::libc++abi.so missing or does not define __cxa_demangle"
          fi
          for attempt in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive timeout 420 apt-get install -y --no-install-recommends $APT_OPTS \
              llvm-15 clang-15 lld-15 ninja-build && break
            echo "llvm install attempt $attempt failed; retrying after 10s"
            sleep 10
          done
          # clang-15 is a reproducibility preference, not a requirement: the
          # image already ships clang 18 + bison + flex + perl. Register the
          # alternatives only when clang-15 is really there, so a mirror that
          # never delivers LLVM leaves a working toolchain instead of a
          # failing step (update-alternatives would otherwise die on a
          # missing /usr/bin/clang-15 and take the whole job with it).
          if [ -x /usr/bin/clang-15 ]; then
            sudo update-alternatives --install /usr/bin/clang    clang    /usr/bin/clang-15    100
            sudo update-alternatives --install /usr/bin/clang++  clang++  /usr/bin/clang++-15  100
            sudo update-alternatives --install /usr/bin/ld.lld   ld.lld   /usr/bin/ld.lld-15   100
          else
            echo "clang-15 not installed; falling back to the image toolchain"
          fi
          clang --version
          llvm-ar-15 --version | head -1 || llvm-ar --version | head -1
          for t in clang bison flex m4 perl git jq curl make ld.lld llvm-ar; do
            printf '%-8s %s\n' "$t" "$(command -v $t || echo MISSING)"
          done
          perl -MList::Util=pairs -e 'print "perl List::Util ok\n"'

      # -------------------------------------------------- stage 1: cctools
      # Supplies lipo, nm, strip, otool, ar, ranlib AND ld64 (Mach-O, which
      # is what the kernel link needs).
      - name: "Stage 1: build cctools-port (ld64 + Mach-O binutils)"
        id: cctools
        run: |
          set -x
          git clone -q --depth 1 -b "$CCTOOLS_BRANCH" "$CCTOOLS_REPO" cctools-port
          echo "=== layout after clone ==="
          ls -la cctools-port | head -20
          ls -la cctools-port/cctools/configure* 2>&1 | head -5
          cd cctools-port/cctools
          # configure.ac hard-requires libdispatch:
          #     AC_CHECK_LIB([c], [dispatch_once], [...], [
          #         echo "Required library libdispatch not installed" >&2
          #         exit 1
          #     ])
          # Earlier runs demoted that `exit 1` and shipped an empty
          # dispatch/dispatch.h stub so configure would pass. That was a
          # mistake: it did not remove the dependency, it buried it in six
          # ld64 translation units. Both patches are gone. Stage 1 now
          # provides real libdispatch below, so the check passes honestly.
          # ---- libdispatch: use the real library, not a stub -----------------
          #
          # History, because this cost us a whole evening and the conclusion
          # reverses an earlier "fix":
          #
          # cctools' ld64 does not merely include <dispatch/dispatch.h> for
          # decoration. SIX files use the real API:
          #     ld64/src/ld/passes/code_dedup.cpp   dispatch_apply
          #     ld64/src/ld/passes/order.cpp        dispatch_apply
          #     ld64/src/ld/InputFiles.cpp          dispatch_apply
          #     ld64/src/ld/Resolver.cpp            dispatch_apply
          #     ld64/src/ld/OutputFile.cpp          dispatch_apply + dispatch_group_*,
          #                                         dispatch_queue_*, dispatch_get_global_queue
          #     ld64/src/ld/libcodedirectory.c      dispatch_once / queue_create / sync / apply
          #
          # Earlier runs tried to make do without libdispatch: configure's
          # "Required library libdispatch not installed" + `exit 1` was
          # demoted, and an empty dispatch/dispatch.h stub was installed.
          # That made configure pass, which looked like progress and was not:
          # with an empty header `^{...}` degrades from an Apple block to a
          # plain C++ block literal, and C++ forbids mutating an enclosing
          # local inside one. Runs 40372391857 / 40373894611 / 40373938349
          # then failed with 15-18 errors of exactly that shape and
          # `ld64: MISSING`. Serialising the two easiest call sites only
          # exposed the next four files.
          #
          # cctools-port's README lists libdispatch-dev and libblocksruntime
          # as required dependencies. So install the real thing and let
          # configure's own AC_CHECK_LIB succeed on its merits.
          #
          # Path 1: the distro package. Path 2: build the same author's
          # apple-libdispatch from source. Whichever wins must pass a strict
          # symbol probe -- a header alone is not libdispatch, and an old
          # package without block support would fail later and far less
          # legibly than here.
          dispatch_ok=0
          dispatch_how=""
          probe_dispatch() {
            [ -f /usr/include/dispatch/dispatch.h ] || [ -f /usr/local/include/dispatch/dispatch.h ] || return 1
            local lib=""
            for cand in /usr/lib/x86_64-linux-gnu/libdispatch.so \
                        /usr/local/lib/libdispatch.so \
                        /usr/lib64/libdispatch.so; do
              [ -e "$cand" ] && { lib="$cand"; break; }
            done
            [ -n "$lib" ] || return 1
            echo "=== probing $lib ==="
            local missing=0
            for sym in dispatch_apply dispatch_group_async dispatch_sync dispatch_once dispatch_queue_create; do
              if nm -D --defined-only "$lib" 2>/dev/null | grep -qw "$sym"; then
                echo "  $sym: present"
              else
                echo "  $sym: MISSING"
                missing=1
              fi
            done
            return $missing
          }
          echo "=== path 1: distro libdispatch-dev ==="
          set +e
          sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y --no-install-recommends \
            libdispatch-dev libblocksruntime-dev > /tmp/dispatchpkg.log 2>&1
          pkg_rc=$?
          set -e
          echo "apt-get libdispatch-dev exit: $pkg_rc"
          tail -15 /tmp/dispatchpkg.log
          if [ "$pkg_rc" = 0 ] && probe_dispatch; then
            dispatch_ok=1
            dispatch_how="distro package (libdispatch-dev)"
            echo "libdispatch source: $dispatch_how"
          else
            echo "=== path 1 rejected; falling back to source build ==="
            echo "=== path 2: tpoechtrager/apple-libdispatch ==="
            set +e
            (
              set -e
              git clone -q --depth 1 https://github.com/tpoechtrager/apple-libdispatch.git apple-libdispatch
              cd apple-libdispatch
              mkdir -p build && cd build
              cmake -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DBUILD_TESTING=OFF \
                .. > /tmp/libdispatch_cmake.log 2>&1
              echo "cmake exit: $?"
              tail -25 /tmp/libdispatch_cmake.log
              ninja -j"$(nproc)" > /tmp/libdispatch_build.log 2>&1
              echo "ninja exit: $?"
              tail -25 /tmp/libdispatch_build.log
              sudo ninja install > /tmp/libdispatch_install.log 2>&1
              echo "ninja install exit: $?"
              tail -15 /tmp/libdispatch_install.log
            ) > /tmp/libdispatch_src.log 2>&1
            src_rc=$?
            set -e
            echo "source build exit: $src_rc"
            tail -60 /tmp/libdispatch_src.log
            sudo ldconfig 2>/dev/null || true
            if [ "$src_rc" = 0 ] && probe_dispatch; then
              dispatch_ok=1
              dispatch_how="source build (tpoechtrager/apple-libdispatch)"
              echo "libdispatch source: $dispatch_how"
            fi
          fi
          if [ "$dispatch_ok" != 1 ]; then
            echo "=== EVERYTHING WE HAVE ==="
            ls -la /usr/include/dispatch/ 2>/dev/null || echo "  no /usr/include/dispatch"
            ls -la /usr/local/include/dispatch/ 2>/dev/null || echo "  no /usr/local/include/dispatch"
            ls -la /usr/lib/x86_64-linux-gnu/libdispatch* 2>/dev/null || true
            ls -la /usr/local/lib/libdispatch* 2>/dev/null || true
            echo "=== apt candidate info ==="
            apt-cache policy libdispatch-dev 2>/dev/null || true
            echo "::error::libdispatch could not be provided (distro package and source build both failed)"
            exit 1
          fi
          echo "DISPATCH VERDICT: $dispatch_how"
          # With real libdispatch, configure's own AC_CHECK_LIB([dispatch],
          # [dispatch_once]) succeeds, so no --with-libdispatch=no and no
          # patch to configure is needed. The old stub and the demoted
          # `exit 1` rewrite are both gone: they are what turned a missing
          # dependency into six files of C++ we had to hand-rewrite.
          #
          # The two dispatch_apply loop rewrites in order.cpp/code_dedup.cpp
          # are also reverted. They were correct, brace-matched and did
          # compile, but they only ever existed to work around the stub.
          # A pristine ld64 is worth more than a preserved workaround when
          # the next layer is what we are debugging.
          echo "=== ld64 sources are untouched (no dispatch rewrite applied) ==="
          grep -c 'dispatch_apply' ld64/src/ld/passes/order.cpp ld64/src/ld/passes/code_dedup.cpp \
            ld64/src/ld/InputFiles.cpp ld64/src/ld/Resolver.cpp ld64/src/ld/OutputFile.cpp \
            ld64/src/ld/libcodedirectory.c || true
          set +e
          # No --with-libdispatch=no: libdispatch is now genuinely present
          # (see the provisioning block above), so configure's own
          # AC_CHECK_LIB([dispatch],[dispatch_once]) must succeed on its
          # merits. If it does not, that is a real result and we want it.
          # LDFLAGS/LIBRARY_PATH already cover /usr/local/lib for the
          # source-build fallback.
          ./configure --prefix="$RUNNER_TEMP/cross" --target=x86_64-linux-gnu \
                      --enable-static --disable-shared \
                      > /tmp/conf.log 2>&1
          rc=$?
          set -e
          echo "configure exit status: $rc"
          tail -40 /tmp/conf.log
          echo "=== did configure actually find libdispatch? ==="
          grep -nE 'dispatch_once|libdispatch|libblocksruntime|BlocksRuntime' /tmp/conf.log | tail -12 || echo "(no dispatch lines)"
          grep -q 'checking for dispatch_once in -ldispatch... yes' /tmp/conf.log \
            && echo "CONFIGURE: libdispatch found (-ldispatch yes)" \
            || echo "CONFIGURE: libdispatch NOT confirmed in -ldispatch"
          if [ "$rc" != 0 ]; then
            echo "=== configure FAILED; last 60 lines ==="
            tail -60 /tmp/conf.log
            echo "=== looking for the fatal line ==="
            grep -nE 'error|cannot|not installed|No such' /tmp/conf.log | tail -20 || true
            exit 1
          fi
          echo "=== did configure create a Makefile? ==="
          ls -la Makefile 2>&1 | head -3
          # These used to be `|| { echo "..."; tail ...; }`, which swallows the
          # failure: run 40372391857 reported `ld64: MISSING` and still went
          # green because nothing propagated a non-zero status. Print the
          # diagnostics, then FAIL.
          set +e
          make -j"$(nproc)" > /tmp/make.log 2>&1
          make_rc=$?
          set -e
          echo "make exit status: $make_rc"
          tail -25 /tmp/make.log
          if [ "$make_rc" != 0 ]; then
            echo "=== MAKE FAILED; last 60 lines ==="
            tail -60 /tmp/make.log
            echo "=== first 20 compile errors ==="
            grep -nE 'error:' /tmp/make.log | head -20 || echo "(no 'error:' lines)"
            echo "=== first failing translation units ==="
            grep -nE '^\s*[A-Za-z0-9_./-]+\.(cpp|c|h):[0-9]+:[0-9]+: error:' /tmp/make.log | head -10 || true
          fi
          set +e
          make install > /tmp/inst.log 2>&1
          inst_rc=$?
          set -e
          echo "make install exit status: $inst_rc"
          tail -10 /tmp/inst.log
          if [ "$inst_rc" != 0 ]; then
            echo "=== MAKE INSTALL FAILED; last 30 lines ==="
            tail -30 /tmp/inst.log
          fi
          ls -la "$RUNNER_TEMP/cross/bin" || true
          echo "=== did the four previously-failing dispatch TUs compile? ==="
          # This is the real proof that libdispatch is genuine rather than a
          # stub: these four files are the ones that failed in runs
          # 40372391857 / 40373894611 / 40373938349 with block-literal and
          # unknown-type errors, and none of them were edited.
          for obj in InputFiles Resolver OutputFile libcodedirectory; do
            found=$(find ld64 -name "$obj.o" -o -name "$obj.lo" 2>/dev/null | head -1)
            if [ -n "$found" ] && [ -s "$found" ]; then
              echo "  $obj: COMPILED ($found)"
            else
              echo "  $obj: NOT FOUND as an object -- see make.log above"
            fi
          done
          # The proof that real libdispatch worked must live in the log, not
          # in our memory of it: grep make.log for ANY error from the four
          # files that used to fail, and print "(none)" when they are clean.
          echo "=== error lines from the four formerly-failing dispatch TUs ==="
          for obj in InputFiles Resolver OutputFile libcodedirectory; do
            hits=$(grep -nE "${obj}\.(cpp|c):[0-9]+:[0-9]+: error:" /tmp/make.log 2>/dev/null | head -5)
            if [ -n "$hits" ]; then
              echo "  $obj: ERRORS"
              echo "$hits" | sed 's/^/    /'
            else
              echo "  $obj: (none)"
            fi
          done
          # ---- expose the tools under the names xnu's Makefiles call -------
          #
          # cctools was configured with --target=x86_64-linux-gnu, so automake
          # installs every program prefixed. ld64/src/ld/Makefile.am:3 says
          #
          #     bin_PROGRAMS = ld
          #
          # so the Mach-O linker lands as x86_64-linux-gnu-ld. There is NO
          # program called `ld64` in cctools-port at all -- ld64 is the
          # source directory name. Earlier runs tested
          #     test -x "$RUNNER_TEMP/cross/bin/ld64"
          # which could never succeed, so `ld64: MISSING` was printed in every
          # run this evening including ones where the build had actually
          # succeeded (40374602950 ended with make install exit 0 and 31
          # binaries present). The check was asking the wrong question.
          #
          # xnu's makedefs expect bare names (LIPO=lipo, NM=nm, ...) and the
          # HOST_* variables in Stage 6 point at plain commands, so provide
          # unprefixed symlinks alongside the prefixed originals.
          PREFIX=x86_64-linux-gnu-
          bin_dir="$RUNNER_TEMP/cross/bin"
          linked=""
          for t in ld nm ar ranlib lipo otool strip size strings \
                   install_name_tool nmedit segedit codesign_allocate \
                   ObjectDump vtool bitcode_strip; do
            if [ -x "$bin_dir/$PREFIX$t" ]; then
              ln -sf "$bin_dir/$PREFIX$t" "$bin_dir/$t"
              linked="$linked $t"
            fi
          done
          echo "unprefixed symlinks created for:$linked"
          echo "=== did we get what the build actually needs? ==="
          # `ld` here IS ld64. Prove the identity rather than trusting the
          # name: GNU ld and Apple's ld64 both answer to `ld`, and a stray
          # /usr/bin/ld on PATH would be a silent, catastrophic substitution.
          LD_OK=0
          if [ -x "$bin_dir/ld" ]; then
            echo "--- $bin_dir/ld -v ---"
            "$bin_dir/ld" -v 2>&1 | head -5 || true
            if "$bin_dir/ld" -v 2>&1 | grep -qi 'ld64\|Apple\|@(#)PROGRAM:ld'; then
              LD_OK=1
              echo "ld: OK (ld64 confirmed by -v)"
            else
              echo "ld: present but did NOT identify as ld64"
            fi
          else
            echo "ld: MISSING"
          fi
          test -x "$bin_dir/nm"   && echo "nm:   OK" || echo "nm:   MISSING"
          test -x "$bin_dir/lipo" && echo "lipo: OK" || echo "lipo: MISSING"
          test -d include/mach-o  && echo "include/mach-o: OK" || echo "include/mach-o: MISSING"
          ls -d include/* 2>/dev/null | head -20 || true
          echo "$bin_dir" >> "$GITHUB_PATH"

          # Assert every symlink we just made actually resolves. A dangling
          # link would fail much later and much less legibly (Stage 6 would
          # report a missing tool from inside xnu's Makefiles, where the real
          # cause is invisible), so check it here where the context is.
          echo "=== symlink integrity ==="
          ls -la "$bin_dir"
          TOOLS_BAD=""
          for t in ld nm lipo ar ranlib strip; do
            if [ -L "$bin_dir/$t" ] && [ ! -e "$bin_dir/$t" ]; then
              echo "  $t: DANGLING symlink"
              TOOLS_BAD="$TOOLS_BAD $t(dangling)"
            elif [ -x "$bin_dir/$t" ]; then
              echo "  $t: resolves -> $(readlink -f "$bin_dir/$t")"
            else
              echo "  $t: MISSING"
              TOOLS_BAD="$TOOLS_BAD $t(missing)"
            fi
          done
          echo "symlink verdict:${TOOLS_BAD:- all resolve}"

          # The verdict IS the exit status. Everything downstream cannot work
          # without the linker, so reporting MISSING and returning success is
          # exactly the lie that cost several runs.
          if [ "$make_rc" != 0 ] || [ "$inst_rc" != 0 ] \
             || [ "$LD_OK" != 1 ] \
             || [ -n "$TOOLS_BAD" ] \
             || [ ! -x "$bin_dir/nm" ]; then
            echo "::error::Stage 1 did not produce a usable ld64/nm (make=$make_rc install=$inst_rc ld64_confirmed=$LD_OK tools_bad='$TOOLS_BAD')"
            exit 1
          fi
          echo "Stage 1 verdict: cctools OK (ld64 confirmed by -v, symlinks resolve)"

      # ------------------------------------------- stage 1b: macOS host shims
      # The SETUP/ host tools (config, decomment, setsegname, installfile,
      # kextsymboltool) are macOS programs; <libc.h> and <copyfile.h> are
      # Apple headers that Linux lacks. Supply the small subset they use.
      - name: "Stage 1b: create <libc.h> / <copyfile.h> shims and a ctf converter"
        id: hostshim
        continue-on-error: true
        run: |
          set -x
          mkdir -p hostshim
          cat > hostshim/libc.h <<'EOF'
          #ifndef _LINUX_HOST_LIBC_SHIM_H
          #define _LINUX_HOST_LIBC_SHIM_H
          /* macOS <libc.h> -> glibc equivalents for xnu's SETUP/ host tools.
           *
           * Keep this header dumb on purpose. An earlier version defined
           * getprogname() here as an inline function returning
           * program_invocation_short_name, but <errno.h> only exposes that
           * symbol when _GNU_SOURCE is in effect, so every translation unit
           * that included <libc.h> -- decomment, setsegname, kextsymboltool,
           * and even bsd/sys -- failed with "use of undeclared identifier
           * 'program_invocation_short_name'". The BSD helpers live in
           * compat.h, which is force-included for every TU and pulls in the
           * right declarations. This header just makes sure they exist and
           * that the usual POSIX surface is available.
           */
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <errno.h>
          #include <libgen.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #ifndef __APPLE__
          #include <compat.h>
          #endif
          #endif
          EOF
          cat > hostshim/copyfile.h <<'EOF'
          #ifndef _LINUX_HOST_COPYFILE_SHIM_H
          #define _LINUX_HOST_COPYFILE_SHIM_H
          #include <sys/types.h>
          typedef void *copyfile_state_t;
          #define COPYFILE_CHECK          0x0000
          #define COPYFILE_STAT           0x0001
          #define COPYFILE_ACL            0x0002
          #define COPYFILE_XATTR          0x0004
          #define COPYFILE_DATA           0x0008
          #define COPYFILE_METADATA       (COPYFILE_STAT | COPYFILE_ACL | COPYFILE_XATTR)
          #define COPYFILE_ALL            (COPYFILE_METADATA | COPYFILE_DATA)
          #define COPYFILE_CLONE          0x0020
          #define COPYFILE_UNLINK         0x0100
          #define COPYFILE_NOFOLLOW       0x0400
          #define COPYFILE_EXCL           0x0001
          #define COPYFILE_NOFOLLOW_SRC   0x0400
          #define COPYFILE_NOFOLLOW_DST   0x0400
          #define COPYFILE_NOFOLLOW_REL   0x0400
          copyfile_state_t copyfile_state_alloc(void);
          int copyfile_state_free(copyfile_state_t);
          int copyfile(const char *, const char *, copyfile_state_t, unsigned int);
          #endif
          EOF
          cp hostshim/libc.h hostshim/copyfile.h /usr/local/include/ 2>/dev/null || \
            { sudo cp hostshim/libc.h hostshim/copyfile.h /usr/local/include/; }
          # copyfile() is only used for "copy one file" in installfile; a
          # plain read/write loop is faithful enough for a kernel install.
          cat > hostshim/copyfile.c <<'EOF'
          #include <copyfile.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <stdlib.h>
          copyfile_state_t copyfile_state_alloc(void) { return calloc(1, 1); }
          int copyfile_state_free(copyfile_state_t s) { free(s); return 0; }
          int copyfile(const char *from, const char *to, copyfile_state_t s, unsigned int flags)
          {
              (void)s; (void)flags;
              int in = open(from, O_RDONLY);
              if (in < 0) return -1;
              int out = open(to, O_WRONLY | O_CREAT | O_TRUNC, 0644);
              if (out < 0) { close(in); return -1; }
              char buf[65536]; ssize_t n;
              while ((n = read(in, buf, sizeof buf)) > 0) {
                  if (write(out, buf, (size_t)n) != n) { close(in); close(out); return -1; }
              }
              close(in); close(out);
              return n < 0 ? -1 : 0;
          }
          EOF
          cc -c -O2 -o "$RUNNER_TEMP/copyfile.o" hostshim/copyfile.c
          # CTF: xnu link step calls ctfmerge; without it the build stops at
          # the link. A pass-through that makes $5 look like a valid CTF
          # container is enough -- the __CTF section is debug-only metadata.
          cat > hostshim/ctfmerge <<'EOF'
          #!/bin/sh
          # ctfmerge -o OUTPUT ... INPUTS   (macOS dtrace(1M) clone)
          out=""
          while [ $# -gt 0 ]; do
            case "$1" in
              -o) out="$2"; shift 2 ;;
              -*) shift ;;
              *) shift ;;
            esac
          done
          [ -n "$out" ] || { echo "ctfmerge: missing -o" >&2; exit 1; }
          printf '\x8b\x47\x49\x80' > "$out"   # CTF container magic
          printf '\x00\x00\x00\x00' >> "$out"  # header size 0 (empty container)
          exit 0
          EOF
          chmod +x hostshim/ctfmerge
          cp hostshim/ctfmerge /usr/local/bin/ctfmerge 2>/dev/null || \
            sudo cp hostshim/ctfmerge /usr/local/bin/ctfmerge
          cc --version | head -1

          # BSD helpers the SETUP/ sources use but glibc does not provide.
          #
          # This has to happen here, in stage 1b, and not next to the SETUP
          # prebuild in stage 5b: "make install" in stage 6 drives its own
          # build_setup pass over SETUP/, and it compiles decomment,
          # setsegname, kextsymboltool, installfile and replacecontents before
          # the stage 5b step ever runs. Those compiles are what failed with
          # "call to undeclared function 'getprogname'".
          #
          # Two pieces are needed, and both must be global:
          #   compat.h      - force-included into every TU via -include, so it
          #                   has to be installed and it has to be
          #                   self-contained (it cannot rely on libc.h).
          #   libbsdcompat.a - CPATH gets -L for it so the SETUP link steps,
          #                   which xnu's own Makefiles drive, resolve the
          #                   symbols without patching those Makefiles.
          cat > hostshim/compat.h <<'EOF'
          #ifndef _LINUX_HOST_COMPAT_SHIM_H
          #define _LINUX_HOST_COMPAT_SHIM_H
          /* Apple's <compat.h> equivalent.
           *
           * Self-contained by design: it is force-included ahead of every
           * translation unit, so it must not assume any other shim ran first,
           * and it must be safe to include with system headers afterwards.
           */
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <errno.h>
          #include <libgen.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <stdint.h>
          #include <stdbool.h>

          #ifndef __APPLE__
          /* Host tools only.
           *
           * This header is force-included into every translation unit, and the
           * same clang driver also compiles the kernel for arm64. xnu defines
           * KERNEL for its own build, so gate on that as well as on __APPLE__:
           * the kernel namespace already has its own setmode/getmode (in
           * libkern) and must not be given host prototypes.
           */
          #if !defined(KERNEL) && !defined(_KERNEL)
          #ifndef _GNU_SOURCE
          #define _GNU_SOURCE 1
          #endif
          /* ---- BSD scalar types ------------------------------------------
           * u_int/u_char/u_short/u_long are BSD names. glibc does have them,
           * but only under __USE_MISC (i.e. _DEFAULT_SOURCE/_BSD_SOURCE).
           * migcom is built with -std=gnu89 and asks for neither, so run
           * 40372741264 failed with 14 copies of
           *     ./type.h:48:9: error: unknown type name 'u_int'
           * and MIGCOM COMPILE FAILED: global.c.
           *
           * compat.h is force-included into every host TU, so defining the
           * family here fixes all of them at once. This lives inside the
           * !KERNEL guard: the kernel build brings its own BSD types and must
           * not see host typedefs.
           *
           * Caution: when __USE_MISC IS active (it is, elsewhere in the
           * build), glibc has already declared several of these, and a second
           * typedef of the same name is a hard error. So each is gated on
           * whether <sys/types.h> got to it. <sys/types.h> is included above,
           * which is exactly why the _SYS_TYPES_H test below is meaningful.
           */
          #ifndef _HOST_BSD_SCALARS_DONE
          #define _HOST_BSD_SCALARS_DONE 1
          #if !defined(__USE_MISC) || !defined(_SYS_TYPES_H)
          /* glibc did not supply the BSD family: declare it. */
          typedef unsigned char       u_char;
          typedef unsigned short      u_short;
          typedef unsigned int        u_int;
          typedef unsigned long       u_long;
          #endif
          /* Only the fixed-width trio below. It is genuinely absent from
           * glibc under every feature set, unlike the 64-bit/quad/daddr
           * names, which glibc DOES provide (as __uint64_t / __quad_t /
           * __u_quad_t / __daddr_t). Declaring those here produced a
           * redefinition storm across Stage 5, 5b and 6 in run 40375312365:
           *     compat.h:67:29: error: typedef redefinition with different types
           *         ('unsigned long long' vs '__uint64_t' (aka 'unsigned long'))
           *     compat.h:70:29: ... ('long' vs '__daddr_t' (aka 'int'))
           * They clash by WIDTH on LP64, not by name, which is why guessing
           * at the underlying type cannot fix it. Removed rather than
           * re-guarded: if a TU ever needs one, the compiler says
           * "unknown type name" precisely where it is used, which is a
           * vastly better failure than this one. */
          typedef unsigned char       u_int8_t;
          typedef unsigned short      u_int16_t;
          typedef unsigned int        u_int32_t;
          #endif /* _HOST_BSD_SCALARS_DONE */
          /* getprogname() is a function on macOS; glibc exposes the same string
           * as a variable declared in <errno.h> behind _GNU_SOURCE. Referencing
           * the variable from an inline body is fragile (that is exactly how
           * the previous shim broke decomment and bsd/sys), so define it as a
           * real accessor backed by bsdcompat.c instead. */
          const char *getprogname(void);

          /* BSD mode-string API from <bsd/stdlib.h>; glibc has neither. The
           * build only ever passes octal strings like "0644". */
          void *setmode(const char *);
          mode_t getmode(const void *, mode_t);

          /* fcopyfile() is dispatch-based on macOS; installfile uses it to copy
           * one regular file. */
          int fcopyfile(int, int, void *, unsigned int);
          #endif /* !KERNEL && !_KERNEL */
          #endif /* !__APPLE__ */
          #endif /* _LINUX_HOST_COMPAT_SHIM_H */
          EOF
          cat > hostshim/bsdcompat.c <<'EOF'
          /* _GNU_SOURCE must precede every include: glibc only declares
           * program_invocation_short_name in <errno.h> when it is set, and
           * defining it after the first include is too late. compat.h defines
           * it for the tools that include compat.h; this translation unit
           * includes system headers directly, so it needs its own copy. */
          #ifndef _GNU_SOURCE
          #define _GNU_SOURCE 1
          #endif
          #include <sys/types.h>
          #include <sys/stat.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <errno.h>

          const char *getprogname(void)
          {
          #if defined(__GLIBC__)
              return program_invocation_short_name;
          #else
              return "tool";
          #endif
          }

          void *setmode(const char *p)
          {
              mode_t m = 0644;
              if (p && *p) {
                  if (*p >= '0' && *p <= '7') {
                      m = (mode_t)strtol(p, NULL, 8);
                  }
                  /* symbolic forms ("u+w") never appear in this build */
              }
              mode_t *r = malloc(sizeof m);
              if (r) *r = m;
              return r;
          }

          mode_t getmode(const void *v, mode_t base)
          {
              return v ? (*(const mode_t *)v & 07777) : base;
          }

          int fcopyfile(int from, int to, void *state, unsigned int flags)
          {
              (void)state; (void)flags;
              char buf[65536];
              ssize_t n;
              while ((n = read(from, buf, sizeof buf)) > 0) {
                  ssize_t off = 0;
                  while (off < n) {
                      ssize_t w = write(to, buf + off, (size_t)(n - off));
                      if (w <= 0) return -1;
                      off += w;
                  }
              }
              return n < 0 ? -1 : 0;
          }
          EOF
          cc -c -O2 -o hostshim/bsdcompat.o hostshim/bsdcompat.c
          # Build this archive with GNU binutils explicitly. Stage 1 puts
          # cctools' Mach-O `ar`/`ranlib` first on PATH (needed by Stage 6),
          # and once that happened `ar rcs` silently wrote a Mach-O archive
          # that GNU ld cannot index:
          #     warning: x86_64-linux-gnu-ranlib: archive library:
          #       hostshim/libbsdcompat.a the table of contents is empty
          #       (no object file members in the library define global symbols)
          # The file still existed and was installed, so Stage 1b passed, and
          # the damage only surfaced much later in Stage 5b as
          #     undefined reference to `setmode' / `getmode' /
          #     `fcopyfile' / `getprogname'
          # for installfile and replacecontents. Use the real GNU tools and
          # prove the index is non-empty before installing.
          # The diagnosis above is right, but the cure was not:
          # `command -v x86_64-linux-gnu-ar` happily matches cctools' own
          # prefixed Mach-O ar, because Stage 1 puts "$RUNNER_TEMP/cross/bin"
          # first on PATH. Run 40376299545 still logged
          #   /home/runner/work/_temp/cross/bin/x86_64-linux-gnu-ranlib:
          #   archive library: hostshim/libbsdcompat.a the table of contents
          #   is empty
          # and every SETUP link then failed with
          #   undefined reference to `getprogname'
          # Resolve by ABSOLUTE PATH from /usr/bin, never through PATH.
          GNU_AR=/usr/bin/ar
          GNU_RANLIB=/usr/bin/ranlib
          GNU_NM=/usr/bin/nm
          for c in "$GNU_AR" "$GNU_RANLIB" "$GNU_NM"; do
            [ -x "$c" ] || { echo "::error::missing GNU binutils: $c"; exit 1; }
          done
          "$GNU_AR" --version | head -1
          echo "bsdcompat archive tools: $GNU_AR / $GNU_RANLIB"
          rm -f hostshim/libbsdcompat.a
          "$GNU_AR" rcsD hostshim/libbsdcompat.a hostshim/bsdcompat.o
          "$GNU_RANLIB" hostshim/libbsdcompat.a
          echo '--- libbsdcompat.a global symbols (must be non-empty) ---'
          "$GNU_NM" -g --defined-only hostshim/libbsdcompat.a || true
          # Do NOT exit here. Run 40377082068 proved the cost: this check
          # correctly detected the hollow archive, but because it sat BEFORE
          # the installs, its `exit 1` also meant compat.h was never written
          # and all five SETUP dirs died with
          #     <built-in>:1:10: fatal error:
          #       '/usr/local/include/compat.h' file not found
          # One fault became two, and the second masked the first. Record the
          # verdict in a variable, install both files regardless, then fail.
          BSD_SHIM_OK=1
          if ! "$GNU_NM" -g --defined-only hostshim/libbsdcompat.a \
                 | grep -qE 'T (getprogname|setmode|getmode|fcopyfile)'; then
            BSD_SHIM_OK=0
          fi
          # /usr/local/{include,lib} are writable on the GitHub ubuntu image,
          # so an unconditional `sudo cp` fails there and the file never
          # lands ("fatal error: '/usr/local/include/compat.h' file not
          # found" in run 40362101652). Try without sudo first.
          install_shim() {
            cp "$1" "$2" 2>/dev/null || sudo cp "$1" "$2"
          }
          install_shim hostshim/compat.h        /usr/local/include/compat.h
          install_shim hostshim/libbsdcompat.a  /usr/local/lib/libbsdcompat.a
          echo "compat: $(ls -la /usr/local/include/compat.h /usr/local/lib/libbsdcompat.a)"
          if [ "$BSD_SHIM_OK" = 1 ]; then
            echo "libbsdcompat.a: BSD shim symbols present (good)"
          else
            echo "::error::libbsdcompat.a defines none of getprogname/setmode/getmode/fcopyfile"
            "$GNU_NM" -g hostshim/libbsdcompat.a || true
            echo "compat.h WAS still installed, so later stages fail on the real cause"
            exit 1
          fi
          echo '--- installed archive global symbols ---'
          nm -g --defined-only /usr/local/lib/libbsdcompat.a || true

      # ------------------------------------------ stage 1c: emulate Apple paths
      # MakeInc.cmd/MakeInc.top hard-code /usr/bin/xcrun, sw_vers and
      # /usr/sbin/sysctl. Rather than rewrite xnu's makedefs, answer on the
      # exact paths they use.
      - name: "Stage 1c: xcrun / sw_vers / sysctl / /dev/null against Linux"
        id: shims
        continue-on-error: true
        run: |
          set -x
          # MakeInc.def links the kernel with -sectcreate ...,/dev/null
          # (/dev/null on AirPort: MAXPATHLEN is 1024, so the path has to fit).
          [ -c /dev/null ] || sudo mknod -m 666 /dev/null c 1 3
          ls -l /dev/null
          # An empty tree that mimics the shape of an Xcode SDK so the paths
          # makedefs derives from `xcrun` look the way its sed/notdir expects.
          # FAKE_PLATFORMS comes from the job env; stage 1d installs into it.
          sudo mkdir -p "$FAKE_PLATFORMS/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          sudo chmod -R 0777 /opt/xcodeshim
          sudo tee /usr/bin/xcrun >/dev/null <<'EOF'
          #!/bin/bash
          # Minimal xcrun for building xnu on Linux.
          FAKE_PLATFORMS=${FAKE_PLATFORMS:-/opt/xcodeshim/Platforms}
          #
          # MakeInc.cmd also calls xcrun as a *wrapper*, i.e.
          #   $(shell $(XCRUN) -sdk $(SDKROOT) -find clang)
          # with XCRUN="/usr/bin/xcrun -verbose", so any leftover flags are
          # followed by the tool to run. Those are stripped, not exec'd --
          # `exec -s ...` fails with "exec: -s: invalid option".
          sdk=""
          rest=()
          while [ $# -gt 0 ]; do
            case "$1" in
              -sdk)   sdk="$2"; shift 2 ;;
              -sdk=*) sdk="${1#-sdk=}"; shift ;;
              -verbose) shift ;;
              # A bare `--` must never reach `exec`. `exec -- foo` is valid,
              # but `exec` with `--` as the COMMAND fails with
              #     exec: --: invalid option
              # and that is exactly what happened in run 40400170421:
              #     + /usr/bin/xcrun --sdk macosx -show-sdk-path
              #     /usr/bin/xcrun: line 39: exec: --: invalid option
              #     ##[error]Process completed with exit code 2.
              # It hit three places -- the stage-1c probe and two patch
              # scripts -- because any caller may pass `--` to stop option
              # parsing. Dropping it is safe: it is purely a boundary marker,
              # and the args after it are still collected in order.
              --) shift ;;
              *) rest+=("$1"); shift ;;
            esac
          done
          case "${rest[0]:-}" in
            # MakeInc.cmd:144 derives PLATFORM by seds'ing the .platform
            # directory name out of this path:
            #     PLATFORM := $(shell echo $(PLATFORMPATH) | sed 's,^.*/\([^/]*\)\.platform$$,\1,')
            # Answering "/" makes that sed fall through and PLATFORM becomes
            # "/", then MakeInc.kernel:26 dies with
            #     *** Unsupported PLATFORM /.  Stop.
            # So the default must look like a real platform directory.
            -show-sdk-platform-path) echo "$FAKE_PLATFORMS/MacOSX.platform" ;;
            # Answered as the fake root; -isysroot and DSTROOT use it.
            -show-sdk-path)          echo "$FAKE_PLATFORMS/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ;;
            -show-sdk-version|--show-sdk-version) echo 13.3 ;;
            -show-sdk-build-version) echo 22E252 ;;
            -find)
              case "${rest[1]:-}" in
                meson) echo /usr/bin/false ;;
                # MakeInc.cmd:184 does  CC := $(shell xcrun -sdk ... -find clang)
                # and then MakeInc.cmd compiles with
                #     $(CC) $(CFLAGS) -arch $(CURRENT_ARCH) ...
                # Answering with the HOST clang makes every kernel compile a
                # x86_64 Linux compile, which rejects Darwin's -arch:
                #     clang: error: unsupported option '-arch' for target
                #            'x86_64-pc-linux-gnu'
                # 736 of those in run 40412376461, plus ARM assembly handed to
                # an x86 assembler ("invalid instruction mnemonic"). So the
                # answer for clang/clang++ is a cross wrapper that forces the
                # Darwin arm64 target; everything else stays as-is.
                clang|clang++)
                  echo "/usr/local/bin/xtool-${rest[1]}" ;;
                *) command -v "${rest[1]:-}" || echo /usr/bin/false ;;
              esac ;;
            "") echo "xcrun: no command" >&2; exit 1 ;;
            *) exec "${rest[@]}" ;;
          esac
          EOF
          sudo chmod +x /usr/bin/xcrun
          # The cross wrapper that xcrun -find clang answers with. It forces the
          # Darwin arm64 target, keeps the caller's arguments verbatim, and
          # drops the Darwin-only switches this Linux clang rejects even WITH a
          # Darwin target (-mkernel / -arch) because they are driver-level.
          # --target= is what actually makes clang emit arm64 Darwin objects;
          # the missing piece was simply that nobody had ever set it.
          sudo mkdir -p /usr/local/bin
          for _x in clang clang++; do
            sudo tee "/usr/local/bin/xtool-${_x}" >/dev/null <<'XTEOF'
          #!/bin/bash
          # Ubuntu clang, forced to the Darwin arm64 target. Reached only via
          # xcrun -find clang -> this path (MakeInc.cmd:184). The heredoc IS
          # quoted ('XTEOF'). It was not in 40413292715, and that single
          # missing pair of quotes broke the whole wrapper: the body expanded
          # in the generating shell, where $#, $1 and $2 are empty, so the
          # installed file read
          #     while [  -gt 0 ]; do case "" in ... esac done
          # and every invocation failed with
          #     clang: error: no input files
          # including the step's own control:
          #     + /usr/local/bin/xtool-clang --version   -> clang: error: no input files
          #     + /usr/local/bin/xtool-clang -arch arm64 -c /tmp/xt.c -o /tmp/xt.o
          #                                              -> clang: error: no input files
          # Because ${_x} was being used to pick /usr/bin/clang vs clang++, it
          # is now derived from $0 inside the (literal) script instead.
          out=()
          while [ $# -gt 0 ]; do
            case "$1" in
              # MakeInc.def:270  ARCH_FLAGS_ARM64 = -arch $(ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG)
              # and the value comes from EMBEDDED_DEVICE_MAP, e.g.
              #     -arch armv8.2-a+crypto
              # That is a GCC-style CPU string, not an Apple -arch name. Passing
              # it through makes clang read it as -mcpu and reject it with
              #     error: unknown target CPU 'armv8.2-a+crypto'
              # whose "valid values" note is an X86 list -- 627 times in
              # 40413177461. So -arch is CONSUMED here and replaced by one
              # canonical target; the CPU/march detail is re-added below as a
              # flag clang for this triple actually understands.
              -arch) shift 2 ;;
              -mcpu=*) out+=("$1"); shift ;;
              -mkernel|-msoft-float|-mno-soft-float|-fapple-kext) shift ;;
              -mmacosx-version-min=*|-miphoneos-version-min=*) shift ;;
              *) out+=("$1"); shift ;;
            esac
          done
          # One-shot argv dump: the first N invocations are written verbatim so
          # a "no input files" regression can be diagnosed from the artifact
          # instead of from guesses about which argv shape broke it. Bounded so
          # it cannot bloat the log.
          if [ -n "$XTOOL_DUMP" ] && [ -d "$XTOOL_DUMP" ]; then
            _seq=$(( $(cat "$XTOOL_DUMP/.seq" 2>/dev/null || echo 0) + 1 ))
            echo "$_seq" > "$XTOOL_DUMP/.seq"
            if [ "$_seq" -le 40 ]; then
              printf 'ARGV[%d]: %s\n' "$_seq" "$*" >> "$XTOOL_DUMP/argv.txt"
            fi
          fi
          exec /usr/bin/$(basename "$0") --target=aarch64-apple-darwin -march=armv8.2-a+crypto+crc "${out[@]}"
          XTEOF
            sudo chmod +x "/usr/local/bin/xtool-${_x}"
          done
          /usr/local/bin/xtool-clang --version | head -1 || true
          printf 'int main(void){return 0;}\n' > /tmp/xt.c
          /usr/local/bin/xtool-clang -arch arm64 -c /tmp/xt.c -o /tmp/xt.o 2>&1 | head -5 \
            && file /tmp/xt.o || echo '  ::warning::xtool-clang control failed' 
          sudo tee /usr/bin/sw_vers >/dev/null <<'EOF'
          #!/bin/bash
          case "$1" in
            -productVersion) echo 13.3 ;;
            -buildVersion)   echo 22E252 ;;
            -productName)    echo macOS ;;
            *) printf 'ProductName:\tmacOS\nProductVersion:\t13.3\nBuildVersion:\t22E252\n' ;;
          esac
          EOF
          sudo chmod +x /usr/bin/sw_vers
          sudo mkdir -p /usr/sbin
          sudo tee /usr/sbin/sysctl >/dev/null <<'EOF'
          #!/bin/bash
          # MakeInc.top uses `sysctl -n hw.memsize` only to size the parallel
          # build fan-out; MakeInc.cmd uses sw_vers for HOST_OS_VERSION.
          val=0
          shift_count=0
          for a in "$@"; do
            case "$a" in
              -n) ;;
              hw.memsize)      val=17179869184 ;;   # 16 GiB
              hw.physicalcpu)  val=4 ;;
              hw.logicalcpu)   val=4 ;;
              -*) ;;
              *) ;;                                  # keep an explicit override if passed
            esac
          done
          echo "$val"
          EOF
          sudo chmod +x /usr/sbin/sysctl
          # <mach-o/swap.h> needs <architecture/byte_order.h>, which cctools
          # keeps under include/foreign. Expose only the subdirectories the
          # Mach-O headers actually pull in -- foreign/ itself also contains
          # strings.h/stdio.h/unistd.h/fcntl.h/libc.h, and letting those
          # shadow glibc breaks every translation unit.
          rm -rf "$CCTOOLS_FOREIGN_INCLUDE"
          mkdir -p "$CCTOOLS_FOREIGN_INCLUDE"
          FOREIGN="$GITHUB_WORKSPACE/cctools-port/cctools/include/foreign"
          # `sys` belongs in this list. cctools ships include/foreign/sys/_types.h
          # (and sys/attr.h), and <libkern/_OSByteOrder.h> includes
          # <sys/_types.h> unconditionally. Leaving `sys` out meant the lookup
          # walked on to glibc's own <sys/...> space, found nothing called
          # _types.h, and died with
          #   libkern/_OSByteOrder.h:40:10: fatal error: 'sys/_types.h'
          #   file not found
          # in runs 40371757506 and 40372391857. The file was never missing;
          # it was simply not on the path. Only `architecture`, `libkern` and
          # `machine` are exposed from here: foreign/ also holds
          # strings.h/stdio.h/stdlib.h/unistd.h/fcntl.h/libc.h, and shadowing
          # glibc with those breaks every translation unit (40370458060).
          #
          # `sys` is deliberately NOT symlinked from foreign/: cctools'
          # foreign/sys/_types.h opens with
          #     #include_next <sys/_types.h>
          # which expects Apple's real header underneath it. There is nothing
          # to include_next on Linux, so a self-contained shim is written
          # below instead.
          # libkern is a real directory of per-entry symlinks, not one link to
          # foreign/libkern: a later step writes its own _OSByteOrder.h into
          # machinc/libkern, and via a directory symlink that write would land
          # inside the cctools checkout and clobber the original.
          for d in architecture machine; do
            if [ -d "$FOREIGN/$d" ]; then
              ln -s "$FOREIGN/$d" "$CCTOOLS_FOREIGN_INCLUDE/$d"
            else
              echo "WARNING: $FOREIGN/$d missing"
            fi
          done
          mkdir -p "$CCTOOLS_FOREIGN_INCLUDE/libkern"
          if [ -d "$FOREIGN/libkern" ]; then
            for x in "$FOREIGN/libkern"/*; do
              n=$(basename "$x")
              # _OSByteOrder.h gets a self-contained replacement below.
              # Linking it first and then `cat >`-ing it would follow the
              # symlink and overwrite cctools' original in the checkout.
              [ "$n" = "_OSByteOrder.h" ] && continue
              ln -s "$x" "$CCTOOLS_FOREIGN_INCLUDE/libkern/$n"
            done
          else
            echo "WARNING: $FOREIGN/libkern missing"
          fi
          # cctools' own mach/machine.h does
          #     #import <mach/machine/vm_types.h>
          # and its copy of that header lives under foreign/mach, so the Mach
          # headers have to be on the path too (no libc names in there):
          #     cctools/include/mach/machine.h:83:9: fatal error:
          #     'mach/machine/vm_types.h' file not found
          [ -d "$FOREIGN/mach" ] && ln -s "$FOREIGN/mach" "$CCTOOLS_FOREIGN_INCLUDE/mach"
          # mach/i386/vm_types.h then wants plain <i386/_types.h>, and the ppc
          # and arm variants do the same for themselves. cctools keeps those
          # arch directories at the top of foreign/, outside mach/, so expose
          # them as well -- they hold only Mach kernel types, no libc names:
          #   machinc/mach/i386/vm_types.h:72:10: fatal error:
          #   'i386/_types.h' file not found          (run 40375312365)
          for d in i386 ppc arm; do
            [ -d "$FOREIGN/$d" ] && ln -sfn "$FOREIGN/$d" "$CCTOOLS_FOREIGN_INCLUDE/$d"
          done
          # osfmk/mach/port.h:181 does `#include <sys/_types.h>`, so the
          # foreign `sys` tree has to be reachable from machinc too. It was
          # NOT: Stage 1c's own `ls` of machinc showed
          #   Availability.h AvailabilityMacros.h TargetConditionals.h
          #   architecture arm i386 libkern mach machine ppc
          # with no `sys` entry, which is why mig died with
          #   ../../dxb/xnu/osfmk/mach/port.h:181:10: fatal error:
          #       'sys/_types.h' file not found        (run 40377933004)
          # An earlier version of this file symlinked foreign/sys but placed
          # it somewhere other than machinc, so the include never resolved.
          for d in sys; do
            [ -d "$FOREIGN/$d" ] && ln -sfn "$FOREIGN/$d" "$CCTOOLS_FOREIGN_INCLUDE/$d"
          done
          # Availability.h/AvailabilityMacros.h are pulled in by swap.h too;
          # they are plain macro headers with no libc content.
          for h in Availability.h AvailabilityMacros.h; do
            [ -f "$FOREIGN/$h" ] && ln -s "$FOREIGN/$h" "$CCTOOLS_FOREIGN_INCLUDE/$h"
          done
          # TargetConditionals.h is an SDK header with no open-source copy in
          # cctools. swap.h only needs the platform predicates, and every one
          # of them must say "not Apple" here, so describe the real host.
          cat > "$CCTOOLS_FOREIGN_INCLUDE/TargetConditionals.h" <<'TCEOF'
          #ifndef __TARGETCONDITIONALS__
          #define __TARGETCONDITIONALS__
          /* Minimal stand-in for the SDK header, for host tools built on
           * Linux. Nothing here is a Mac, which is what the callers want:
           * these tools only byte-swap Mach-O fields on the host. */
          #define TARGET_OS_MAC               0
          #define TARGET_OS_OSX               0
          #define TARGET_OS_IPHONE            0
          #define TARGET_OS_IOS               0
          #define TARGET_OS_TV                0
          #define TARGET_OS_WATCH             0
          #define TARGET_OS_BRIDGE            0
          #define TARGET_OS_SIMULATOR         0
          #define TARGET_OS_EMBEDDED          0
          #define TARGET_OS_LINUX             1
          #define TARGET_OS_UNIX              1
          #define TARGET_CPU_X86_64           1
          #define TARGET_CPU_PPC              0
          #define TARGET_CPU_PPC64            0
          #define TARGET_CPU_ARM              0
          #define TARGET_CPU_ARM64            0
          #define TARGET_RT_LITTLE_ENDIAN     1
          #define TARGET_RT_BIG_ENDIAN        0
          #define TARGET_RT_64_BIT            1
          #endif /* __TARGETCONDITIONALS__ */
          TCEOF
          # ---- libkern/_OSByteOrder.h: make it stop needing sys/_types.h ----
          #
          # cctools DOES ship include/foreign/sys/_types.h, but it opens with
          #     #include_next <sys/_types.h>
          # so it expects Apple's real header underneath and cannot work on
          # Linux. That is why `sys` is not symlinked above.
          #
          # _OSByteOrder.h only wants the Apple spellings of the fixed-width
          # types, so shadow it with a copy that pulls <stdint.h> and defines
          # those spellings itself. Then no Darwin-only header is required on
          # ANY include path, which is the real fix: the next Darwin-only
          # include cannot reproduce this class of failure.
          # The swap macros are byte-for-byte the cctools ones; only the type
          # supply changed.
          mkdir -p "$CCTOOLS_FOREIGN_INCLUDE/libkern"
          cat > "$CCTOOLS_FOREIGN_INCLUDE/libkern/_OSByteOrder.h" <<'OSBOEOF'
          /*
           * Host stand-in for cctools' include/foreign/libkern/_OSByteOrder.h,
           * for building xnu's SETUP/ host tools on Linux.
           *
           * Apple's original does `#include <sys/_types.h>` purely to obtain
           * __uint16_t/__uint32_t/__uint64_t. That header is Darwin-only, so
           * the original drags a Darwin include path requirement into every
           * consumer. This copy is self-contained: <stdint.h> plus the four
           * typedefs Apple's header would have supplied. Byte-order logic is
           * unchanged.
           */
          #ifndef _HOST_LIBKERN__OSBYTEORDER_H
          #define _HOST_LIBKERN__OSBYTEORDER_H

          #include <stdint.h>

          #ifndef __uint16_t
          typedef uint16_t __uint16_t;
          #endif
          #ifndef __uint32_t
          typedef uint32_t __uint32_t;
          #endif
          #ifndef __uint64_t
          typedef uint64_t __uint64_t;
          #endif

          #define __DARWIN_OSSwapConstInt16(x) \
              ((__uint16_t)((((__uint16_t)(x) & 0xff00) >> 8) | \
                          (((__uint16_t)(x) & 0x00ff) << 8)))

          #define __DARWIN_OSSwapConstInt32(x) \
              ((__uint32_t)((((__uint32_t)(x) & 0xff000000) >> 24) | \
                          (((__uint32_t)(x) & 0x00ff0000) >>  8) | \
                          (((__uint32_t)(x) & 0x0000ff00) <<  8) | \
                          (((__uint32_t)(x) & 0x000000ff) << 24)))

          #define __DARWIN_OSSwapConstInt64(x) \
              ((__uint64_t)((((__uint64_t)(x) & 0xff00000000000000ULL) >> 56) | \
                          (((__uint64_t)(x) & 0x00ff000000000000ULL) >> 40) | \
                          (((__uint64_t)(x) & 0x0000ff0000000000ULL) >> 24) | \
                          (((__uint64_t)(x) & 0x000000ff00000000ULL) >>  8) | \
                          (((__uint64_t)(x) & 0x00000000ff000000ULL) <<  8) | \
                          (((__uint64_t)(x) & 0x0000000000ff0000ULL) << 24) | \
                          (((__uint64_t)(x) & 0x000000000000ff00ULL) << 40) | \
                          (((__uint64_t)(x) & 0x00000000000000ffULL) << 56)))

          /* No <libkern/i386/_OSByteOrder.h> or <libkern/arm/OSByteOrder.h>
           * subclass here: those pull in Apple arch headers. __builtin_bswap*
           * is exactly what _OSSwapIntNN compiles to on clang. */
          #define __DARWIN_OSSwapInt16(x) \
              (__builtin_constant_p(x) ? __DARWIN_OSSwapConstInt16(x) \
                                       : (__uint16_t)__builtin_bswap16((uint16_t)(x)))

          #define __DARWIN_OSSwapInt32(x) \
              (__builtin_constant_p(x) ? __DARWIN_OSSwapConstInt32(x) \
                                       : (__uint32_t)__builtin_bswap32((uint32_t)(x)))

          #define __DARWIN_OSSwapInt64(x) \
              (__builtin_constant_p(x) ? __DARWIN_OSSwapConstInt64(x) \
                                       : (__uint64_t)__builtin_bswap64((uint64_t)(x)))

          #endif /* _HOST_LIBKERN__OSBYTEORDER_H */
          OSBOEOF
          echo "self-contained _OSByteOrder.h installed:"
          # Match only a REAL preprocessor include, never the prose in the
          # header's own comment. The previous guard was
          #     grep -n 'sys/_types.h' "$file"
          # which matched line 5 of the file -- a comment reading
          # "Apple's original does `#include <sys/_types.h>` purely to..."
          # -- and therefore aborted Stage 1c with a spurious
          #     ::error::_OSByteOrder.h still references sys/_types.h
          # in every run. The header was fine; the check was wrong.
          if grep -nE '^[[:space:]]*#[[:space:]]*include[[:space:]]*[<"]sys/_types\.h[>"]' \
               "$CCTOOLS_FOREIGN_INCLUDE/libkern/_OSByteOrder.h"; then
            echo "::error::_OSByteOrder.h really does #include <sys/_types.h>"
            exit 1
          fi
          echo "  no real #include of <sys/_types.h> (comments ignored) (good)"
          # Prove it compiles with ONLY machinc on the path and no Darwin sys/
          # of our own, which is the property we actually want.
          printf '#include <libkern/_OSByteOrder.h>\nint main(void){return (int)__DARWIN_OSSwapInt32(1u)==0;}\n' \
            > /tmp/osb.c
          cc -I"$CCTOOLS_FOREIGN_INCLUDE" -c -o /tmp/osb.o /tmp/osb.c \
            && echo "  _OSByteOrder.h self-containment probe: OK" \
            || { echo "::error::_OSByteOrder.h is not self-contained"; exit 1; }
          ls -la "$CCTOOLS_FOREIGN_INCLUDE"
          echo '--- probes ---'
          /usr/bin/xcrun --sdk macosx -show-sdk-path
          /usr/bin/xcrun --sdk macosx -find clang
          sw_vers -productVersion
          /usr/sbin/sysctl -n hw.memsize
          echo '--- the exact expression MakeInc.cmd:145 uses to derive PLATFORM ---'
          PLATFORMPATH=$(/usr/bin/xcrun --sdk macosx -show-sdk-platform-path)
          PLATFORM=$(echo "$PLATFORMPATH" | sed 's,^.*/\([^/]*\)\.platform$,\1,')
          echo "PLATFORMPATH=$PLATFORMPATH"
          echo "PLATFORM=$PLATFORM"
          test "$PLATFORM" = MacOSX

      # --------------------------------------- stage 1d: AvailabilityVersions
      # bsd/sys/make_symbol_aliasing.sh runs
      #   ${SDKROOT}/${DRIVERKITROOT}/usr/local/libexec/availability.pl
      # and xnu cannot generate _symbol_aliasing.h without it:
      #   Unable to locate .../availability.pl (or not executable)
      # The tool is open source, so build it instead of taking dxb's
      # "sed the SDKROOT out of make_symbol_aliasing.sh" shortcut.
      - name: "Stage 1d: install availability.pl from AvailabilityVersions"
        id: availability
        continue-on-error: true
        run: |
          set -x
          SDK="$FAKE_PLATFORMS/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          AV_TAG=$(curl -s "$RELEASE_URL" | jq -r '.projects[] | select(.project=="AvailabilityVersions") | .tag')
          echo "AvailabilityVersions tag: $AV_TAG"
          git clone -q --depth 1 --branch "$AV_TAG" \
            https://github.com/apple-oss-distributions/AvailabilityVersions.git AvailabilityVersions
          cd AvailabilityVersions
          make install DSTROOT="$SDK" DRIVERKITROOT=
          ls -la "$SDK/usr/local/libexec/availability.pl"
          head -1 "$SDK/usr/local/libexec/availability.pl"
          # `make` copies without the exec bit; the consumer tests -x.
          chmod +x "$SDK/usr/local/libexec/availability.pl"
          perl "$SDK/usr/local/libexec/availability.pl" --help >/dev/null 2>&1 || true
          echo "sdkrooth=$(dirname "$(dirname "$(dirname "$(dirname "$SDK")")")")"

      # ------------------------------------------------- stage 2: dxb tree
      - name: "Stage 2: fetch darwin-xnu-build and select the ginkgo series"
        id: dxb
        continue-on-error: true
        run: |
          set -x
          PLATFORM="${{ inputs.platform || 'ginkgo' }}"
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          if [ "$PLATFORM" = "ginkgo" ]; then
            for p in xnu/patches/*.patch; do
              case "$(basename "$p")" in
                *-topaz-*) echo "skip $(basename "$p")"; continue ;;
              esac
              cp "$p" dxb/patches/
            done
          else
            cp xnu/patches/*.patch dxb/patches/
          fi
          cp xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          ls dxb/patches

      # --------------------------------------------- stage 3: clone xnu src
      - name: "Stage 3: clone xnu-8796.121.2, patch, and port makedefs to GNU make"
        id: xnusrc
        continue-on-error: true
        run: |
          set -x
          cd dxb
          RELEASE_URL='https://raw.githubusercontent.com/apple-oss-distributions/distribution-macOS/macos-135/release.json'
          XNU_VERSION=$(curl -s "$RELEASE_URL" | jq -r '.projects[] | select(.project=="xnu") | .tag')
          echo "xnu tag: $XNU_VERSION"
          git clone -q --depth 1 --branch "$XNU_VERSION" \
            https://github.com/apple-oss-distributions/xnu.git xnu
          cd xnu
          git describe --tags || true
          for s in ../patches/*.sh; do
            [ -e "$s" ] || continue
            echo "== script $(basename "$s")"
            bash "$s" || echo "SCRIPT FAILED: $s"
          done
          for p in ../patches/*.patch; do
            [ -e "$p" ] || continue
            if out=$(git apply --check "$p" 2>&1); then
              echo "applied   $(basename "$p")"
              git apply "$p"
            else
              echo "SKIPPED   $(basename "$p"): $out"
            fi
          done

          # --- makedefs portability fixes (build-time copy only) -----------
          # 1. MakeInc.cmd:480 "$(if $(wordlist 1,$(1),$(NUM32)),...)" is
          #    called with an empty $(1) in MakeInc.top, which GNU make
          #    rejects. A single space is the same as an empty wordlist for
          #    a numeric clamp.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('makedefs/MakeInc.cmd')
          s = p.read_text()
          s2 = s.replace(r'sequence = $(if $(wordlist 1,$(1),$(NUM32)),',
                         r'sequence = $(if $(wordlist 1,$(or $(1),0),$(NUM32)),')
          assert s2 != s, 'MakeInc.cmd wordlist fix did not apply'
          p.write_text(s2)
          print('MakeInc.cmd: wordlist guard patched')
          PY
          # 1a-bis. Darwin's /usr/bin/install takes -S (disable breakage of
          # .SYMDEF symbols); GNU coreutils' install does not, and treats it
          # as a FILE to install. MakeInc.def:983 is
          #     DATA_INSTALL_FLAGS = -c -S -m 0644
          # so libkern's version.h rule
          #     version.h: version.h.template $(SRCROOT)/config/MasterVersion
          #         $(_v)install $(DATA_INSTALL_FLAGS) $< $@
          # becomes `install -c -S -m 0644 template version.h` and dies with
          #     install: target 'version.h': No such file or directory
          #     make[5]: *** [.../libkern/libkern/Makefile:121: version.h] Error 1
          # (run 40385145640; reproduced locally, including the fact that GNU
          # install parses -S as its source operand). Drop only the -S.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('makedefs/MakeInc.def')
          s = p.read_text()
          old = 'DATA_INSTALL_FLAGS = -c -S -m 0644'
          new = 'DATA_INSTALL_FLAGS = -c -m 0644'
          assert old in s, 'DATA_INSTALL_FLAGS line not found as expected'
          assert s.count(old) == 1, 'expected exactly one DATA_INSTALL_FLAGS'
          p.write_text(s.replace(old, new))
          print('MakeInc.def: DATA_INSTALL_FLAGS -S removed (GNU install)')
          PY
          # 1b. Force-include the host compat shim and link its archive.
          #     "make install" drives its own build_setup pass over SETUP/,
          #     compiling decomment, setsegname, kextsymboltool, installfile and
          #     replacecontents. Those are host tools that call BSD-only
          #     getprogname/setmode/getmode/fcopyfile, and there is no
          #     environment hook in xnu's makedefs to inject -include or a
          #     library, so the flags are appended to the compiler driver
          #     definitions here. CPATH/LIBRARY_PATH in the job env already
          #     point at /usr/local/include and /usr/local/lib.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('makedefs/MakeInc.cmd')
          s = p.read_text()
          # The host tools are built with the plain $(CC)/$(CXX) variables.
          # Append rather than replace so any existing flags survive.
          patched = s
          for var in ('CC', 'CXX'):
              pat = re.compile(r'^(%s\s*(?::?=)\s*)(.+)$' % var, re.M)
              m = pat.search(patched)
              if m and '-include' not in m.group(2):
                  patched = (patched[:m.start()]
                             + m.group(1) + m.group(2)
                             + ' -include /usr/local/include/compat.h'
                             + patched[m.end():])
          if patched == s:
              print('MakeInc.cmd: WARNING no CC/CXX definition found to patch')
          else:
              p.write_text(patched)
              print('MakeInc.cmd: compat.h force-include added to CC/CXX')
          for line in p.read_text().splitlines():
              if line.startswith(('CC ', 'CC=', 'CC\t', 'CXX ', 'CXX=', 'CXX\t')):
                  print('   ', line.strip())
          PY
          # 2. /usr/bin/find -x is BSD-only; accept it and ignore it.
          cat > /usr/local/bin/find <<'EOF'
          #!/bin/bash
          # GNU find has no -x (BSD "do not cross mount points") flag.
          args=()
          for a in "$@"; do
            [ "$a" = "-x" ] && continue
            args+=("$a")
          done
          exec /usr/bin/find "${args[@]}"
          EOF
          sudo chmod +x /usr/local/bin/find
          # 3. PATH order: the wrapper must win over /usr/bin/find, while
          #    still putting the cctools (lipo/nm/strip/otool) first.
          grep -n 'PATCH' makedefs/MakeInc.cmd | head -3 || true

      # ---------------------------------------- stage 4: SWEET config sanity
      - name: "Stage 4: prove SWEET needs no KDK and no KDK-supplied sources"
        id: config
        continue-on-error: true
        run: |
          set -x
          cd dxb/xnu
          echo '--- KDK force-load guard in MakeInc.def ---'
          grep -n 'force_load' makedefs/MakeInc.def || true
          echo '--- arm64 sources gated behind nos_arm_pmap / nos_arm_asm ---'
          grep -n 'nos_arm' osfmk/conf/files.arm64 | head -20
          echo '--- does xnu invoke $(MIG) with kernel -D flags? ---'
          grep -n 'MIGKUFLAGS\|MIGKSFLAGS' osfmk/mach/Makefile
          echo '--- remaining xcrun/iig/ld_classic references in makedefs ---'
          grep -rn 'iig\|ld_classic' makedefs/ | head -20 || true

      # ---------------------------------- stage 5: build the MIG host tools
      - name: "Stage 5: build mig + migcom from bootstrap_cmds on Linux"
        id: mig
        if: inputs.deep != 'false'
        continue-on-error: true
        run: |
          set -x
          git clone -q --depth 1 \
            https://github.com/apple-oss-distributions/bootstrap_cmds.git bootstrap_cmds
          cd bootstrap_cmds/migcom.tproj
          mkdir -p out
          bison -d -o out/parser.c parser.y
          flex -o out/lexxer.c lexxer.l
          INC="-Iout -I. -I../../dxb/xnu/osfmk -I../../dxb/xnu/EXTERNAL_HEADERS"
          # xnu's osfmk/mach/i386/vm_types.h:74 does `#include <i386/_types.h>`,
          # which is Darwin-only and absent from osfmk itself. cctools-port
          # ships it at cctools/include/foreign/i386/_types.h, and Stage 1c
          # exposes that tree as $CCTOOLS_FOREIGN_INCLUDE (machinc), where
          # `i386` is a symlink to it. Stage 5b always put machinc on its
          # include path; Stage 5 did not, so mig failed with
          #     In file included from handler.c:40: ... osfmk/mach/message.h:
          #     ... osfmk/mach/port.h:92: ...
          #     ... osfmk/mach/machine/vm_types.h:33:
          #     ../../dxb/xnu/osfmk/mach/i386/vm_types.h:74:10:
          #         fatal error: 'i386/_types.h' file not found
          # Note the include is <i386/_types.h>, NOT <mach/i386/_types.h>,
          # so machinc must be at the ROOT of the search path. -isystem keeps
          # it out of the way of -I so Darwin headers never override host ones.
          INC="$INC -isystem $CCTOOLS_FOREIGN_INCLUDE"
          # Neutralise Apple's compiler-supplied kext annotation.
          # osfmk/mach/{i386,arm}/vm_types.h use `__kernel_ptr_semantics` on
          # five typedefs, but nothing in xnu defines it -- not
          # i386/vm_types.h, arm/vm_types.h, machine/vm_types.h, nor
          # EXTERNAL_HEADERS/sys/cdefs.h. It is supplied by Apple's compiler
          # driver, so clang-on-Linux sees a stray identifier and errors at
          # each use:
          #     osfmk/mach/i386/vm_types.h:103:44: error: expected ';'
          #         after top level declarator
          #     103 | typedef uintptr_t vm_offset_t __kernel_ptr_semantics;
          #         (same at 126, 127, 130, 131)
          # Defining it empty restores plain typedefs. mig only consumes type
          # names, so dropping the annotation cannot change its behaviour.
          INC="$INC -D__kernel_ptr_semantics="
          # Free pre-dispatch check: print what machinc/i386/_types.h itself
          # includes. Darwins's copy is NOT self-contained in general -- it may
          # want <sys/cdefs.h>, __darwin_* types or machine/_types.h, none of
          # which glibc supplies. mig will be the first thing to actually open
          # this header, so record what it pulls in BEFORE the compile so the
          # next failure (if any) is diagnosed from observation, not theory.
          echo '--- machinc/i386/_types.h: resolved path ---'
          ls -la "$CCTOOLS_FOREIGN_INCLUDE/i386/_types.h" || \
            echo "WARNING: i386/_types.h is not reachable via machinc"
          echo '--- its #include directives ---'
          grep -nE '^[[:space:]]*#[[:space:]]*include' \
            "$CCTOOLS_FOREIGN_INCLUDE/i386/_types.h" || \
            echo "(self-contained: no #include directives)"
          echo '--- size ---'
          wc -l "$CCTOOLS_FOREIGN_INCLUDE/i386/_types.h" || true
          # Same instrumented check for Darwin's sys/_types.h, which
          # osfmk/mach/port.h:181 needs and which the machine/ directory alone
          # cannot supply. foreign/sys exists (upstream: _types.h + attr.h)
          # and is symlinked in Stage 1c; still print what it pulls in, since
          # this one is also Darwin-only and may want __darwin_* or
          # machine/_types.h.
          echo '--- machinc/sys/_types.h: resolved path ---'
          ls -la "$CCTOOLS_FOREIGN_INCLUDE/sys/_types.h" || \
            echo "WARNING: sys/_types.h is not reachable via machinc"
          echo '--- its #include directives ---'
          grep -nE '^[[:space:]]*#[[:space:]]*include' \
            "$CCTOOLS_FOREIGN_INCLUDE/sys/_types.h" || \
            echo "(self-contained: no #include directives)"
          echo '--- size ---'
          wc -l "$CCTOOLS_FOREIGN_INCLUDE/sys/_types.h" || true
          # osfmk/mach/port.h:182 then wants <sys/_types/_mach_port_t.h>, and
          # osfmk/mach/std_types.h wants <sys/_types/_uuid_t.h>. cctools'
          # foreign/sys has only _types.h and attr.h -- no _types/
          # subdirectory -- so the symlink above cannot serve them.
          #
          # They are NOT missing, though: xnu itself ships both at
          # bsd/sys/_types/ in the open-source tree, and they are two lines
          # each, defining exactly one type from a __darwin_* that cctools'
          # foreign/sys/_types.h ALREADY provides:
          #     foreign/sys/_types.h:111  typedef __darwin_mach_port_name_t
          #                                     __darwin_mach_port_t;
          #     foreign/sys/_types.h:138  typedef unsigned char __darwin_uuid_t[16];
          #     xnu bsd/sys/_types/_mach_port_t.h:
          #         #ifndef _MACH_PORT_T
          #         typedef __darwin_mach_port_t mach_port_t;
          #     xnu bsd/sys/_types/_uuid_t.h:
          #         #ifndef _UUID_T
          #         typedef __darwin_uuid_t uuid_t;
          # So expose xnu's own directory at <sys/_types/> rather than writing
          # any Apple content ourselves. Prefer xnu's tree (authoritative and
          # already checked out by Stage 3); fall back to synthesising the two
          # typedefs only if that directory is genuinely absent.
          mkdir -p "$RUNNER_TEMP/xnusys/types"
          if [ -f "$XNU_SRC_ROOT/bsd/sys/_types/_mach_port_t.h" ]; then
            echo "sys/_types source: xnu's own bsd/sys/_types"
            cp -f "$XNU_SRC_ROOT/bsd/sys/_types/_mach_port_t.h" \
                  "$RUNNER_TEMP/xnusys/types/" 2>/dev/null || true
            cp -f "$XNU_SRC_ROOT/bsd/sys/_types/_uuid_t.h" \
                  "$RUNNER_TEMP/xnusys/types/" 2>/dev/null || true
          fi
          if [ ! -f "$RUNNER_TEMP/xnusys/types/_mach_port_t.h" ]; then
            echo "sys/_types source: synthesised from Apple's documented typedefs"
            cat > "$RUNNER_TEMP/xnusys/types/_mach_port_t.h" <<'MPTEOF'
          #ifndef _MACH_PORT_T
          #define _MACH_PORT_T
          #include <sys/_types.h>
          typedef __darwin_mach_port_t mach_port_t;
          #endif
          MPTEOF
            cat > "$RUNNER_TEMP/xnusys/types/_uuid_t.h" <<'UTEOF'
          #ifndef _UUID_T
          #define _UUID_T
          #include <sys/_types.h>
          typedef __darwin_uuid_t uuid_t;
          #endif
          UTEOF
          fi
          # Graft the _types/ directory into the existing foreign/sys tree.
          # foreign/sys is itself a symlink into the cctools clone, which we
          # must not write to, so build a real directory that mirrors it.
          # `rm -f` first: `ln -sfn` cannot replace a symlink-to-directory
          # on its own (it would create sys/sysmerged), and reproducing that
          # locally showed `sys/_types/` silently coming out EMPTY.
          rm -rf "$RUNNER_TEMP/sysmerged"
          mkdir -p "$RUNNER_TEMP/sysmerged"
          cp -R "$CCTOOLS_FOREIGN_INCLUDE/sys/." "$RUNNER_TEMP/sysmerged/" \
            2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/sysmerged/_types"
          cp -f "$RUNNER_TEMP/xnusys/types/_mach_port_t.h" \
                "$RUNNER_TEMP/xnusys/types/_uuid_t.h" \
                "$RUNNER_TEMP/sysmerged/_types/"
          rm -f "$CCTOOLS_FOREIGN_INCLUDE/sys"
          ln -sfn "$RUNNER_TEMP/sysmerged" "$CCTOOLS_FOREIGN_INCLUDE/sys"
          echo '--- machinc/sys/ contents ---'
          ls -la "$CCTOOLS_FOREIGN_INCLUDE/sys/" || \
            echo "WARNING: machinc/sys is not reachable"
          echo '--- machinc/sys/_types/ contents (must list 2 files) ---'
          ls -1 "$CCTOOLS_FOREIGN_INCLUDE/sys/_types/" || \
            echo "::error::sys/_types/ is not reachable via machinc"
          ntypes=$(ls -1 "$CCTOOLS_FOREIGN_INCLUDE/sys/_types/" 2>/dev/null | wc -l)
          if [ "$ntypes" -lt 2 ]; then
            echo "::error::sys/_types/ has $ntypes file(s), expected 2"
            exit 1
          fi
          echo '--- _mach_port_t.h ---'
          sed -n '1,15p' "$CCTOOLS_FOREIGN_INCLUDE/sys/_types/_mach_port_t.h" || true
          echo '--- _uuid_t.h ---'
          sed -n '1,15p' "$CCTOOLS_FOREIGN_INCLUDE/sys/_types/_uuid_t.h" || true
          # Positive control: the two typedefs must resolve to a __darwin_*
          # type that foreign/sys/_types.h actually declares.
          for dt in __darwin_mach_port_t __darwin_uuid_t; do
            if grep -q "$dt" "$CCTOOLS_FOREIGN_INCLUDE/sys/_types.h"; then
              echo "  $dt: declared in foreign/sys/_types.h (good)"
            else
              echo "::error::$dt is not declared in foreign/sys/_types.h"
              exit 1
            fi
          done
          # ---------------------------------------------------------------
          # Narrow <sys/...> closure for mig.
          #
          # Rather than discovering one missing osfmk->sys header per run
          # (sys/_types.h, then sys/_types/_mach_port_t.h, then
          # sys/appleapiopts.h, ...), resolve the set that mig's own
          # translation units actually reach and stage ONLY those files.
          #
          # Deliberately NOT the whole of xnu/bsd/sys: that tree contains
          # real kernel headers (sys/types.h, sys/stat.h, sys/mman.h,
          # sys/param.h) which would fight glibc. We already paid for that
          # lesson with compat.h and _OSByteOrder.h, where a Darwin header
          # winning a name collision produced redefinition cascades far
          # worse than a clean "file not found". Only these five are
          # requested by mig's direct header set (message.h, port.h,
          # std_types.h, boolean.h, kern_return.h, ndr.h, notify.h,
          # mach_types.h, mig_errors.h, msg_type.h, rpc.h):
          #     sys/_types.h
          #     sys/_types/_mach_port_t.h
          #     sys/_types/_uuid_t.h
          #     sys/appleapiopts.h
          #     sys/appleapiopts.h
          # and NOT sys/cdefs.h. See below for why that one is excluded.
          # The _types/ entries come from cctools foreign/ + the graft above;
          # sys/appleapiopts.h comes from xnu's own bsd/sys/.
          #
          # miginc is appended AFTER the other -I paths, but that is not
          # enough to stop it shadowing glibc: -I directories beat the system
          # default directories in ENTIRELY DIFFERENT SEARCH TIERS, so an -I
          # path always wins over /usr/include no matter what order it is in.
          #
          # That is exactly what broke run 40380579795. Staging xnu's
          # bsd/sys/cdefs.h shadowed glibc's <sys/cdefs.h> FOR GLIBC ITSELF:
          #     /usr/include/features.h:502 -> <sys/cdefs.h>
          #       -> miginc/sys/cdefs.h:793  #include <sys/_symbol_aliasing.h>
          #       -> fatal error: 'sys/_symbol_aliasing.h' file not found
          # xnu's cdefs.h takes that branch whenever KERNEL is undefined
          # (bsd/sys/cdefs.h:790), and _symbol_aliasing.h is generated into
          # the Apple SDK and is not in xnu or cctools. error.c compiled
          # cleanly on f64d578 and failed here, so this was damage added by
          # the closure, not an earlier failure surfacing in file order.
          #
          # The rule, learned for the third time after compat.h and
          # _OSByteOrder.h: NEVER stage a header whose name glibc also owns.
          # A Darwin header winning that collision is far worse than a
          # missing one. So sys/cdefs.h is deliberately NOT staged and the
          # run asserts it stays absent.
          MIGINC="$RUNNER_TEMP/miginc"
          rm -rf "$MIGINC"
          mkdir -p "$MIGINC/sys/_types"
          echo '--- staging xnu bsd/sys headers for mig ---'
          STAGED=""
          for rel in sys/appleapiopts.h; do
            src="$XNU_SRC_ROOT/bsd/$rel"
            if [ -f "$src" ]; then
              cp -f "$src" "$MIGINC/$rel"
              STAGED="$STAGED $rel"
              echo "  staged $rel ($(wc -l < "$src") lines) <- $src"
            else
              echo "  MISSING $rel (looked in $src)"
            fi
          done
          echo "closure staged:${STAGED:- <none>}"
          echo '--- miginc tree ---'
          find "$MIGINC" -type f | sort
          echo "miginc file count: $(find "$MIGINC" -type f | wc -l)"
          # appleapiopts.h must be present: nothing else provides it.
          if [ ! -f "$MIGINC/sys/appleapiopts.h" ]; then
            echo "::error::mig closure is missing sys/appleapiopts.h"
            exit 1
          fi
          # NEGATIVE assertion, so the cdefs.h shadow cannot creep back in.
          # Extended to the whole class of names glibc owns: an -I path is a
          # different search tier from the system defaults, so ANY of these
          # staged here would hijack glibc's own request for it.
          for n in sys/cdefs.h sys/types.h sys/stat.h sys/param.h sys/mman.h \
                   sys/time.h sys/unistd.h sys/signal.h sys/errno.h; do
            if [ -e "$MIGINC/$n" ]; then
              echo "::error::$n must never be staged -- it shadows glibc"
              exit 1
            fi
          done
          echo "  glibc-owned names: none staged (checked 9)"
          # Positive control for the negative assertion above: prove that
          # glibc really does reach for <sys/cdefs.h>, so the assertion has
          # a live reason. If this stops matching, re-examine it rather than
          # silently keeping a rule that no longer protects anything.
          if grep -rq '<sys/cdefs.h>' /usr/include/features.h 2>/dev/null; then
            echo "  glibc features.h includes <sys/cdefs.h>: shadowing hazard is real"
          else
            echo "::warning::features.h does not include <sys/cdefs.h>; re-check why"
          fi
          echo '--- full miginc contents ---'
          find "$MIGINC" -type f -printf '%p (%s bytes)\n' 2>/dev/null | sort || \
            find "$MIGINC" -type f | sort
          INC="$INC -I$MIGINC"
          # migcom needs the BSD scalar types (u_int and friends) that glibc
          # hides behind __USE_MISC. Stage 1b's compat.h defines them and is
          # safe to force-include here: its host-tool half is gated on
          # !KERNEL, and migcom defines no KERNEL. Without this the build dies
          # with "unknown type name 'u_int'" out of type.h -- see the note on
          # compat.h for the full trail.
          #
          # EXTERNAL_HEADERS cannot be dropped from INC: migcom genuinely
          # includes mach/boolean.h, mach/kern_return.h, mach/mach_types.h,
          # mach/message.h, mach/port.h, mach/std_types.h and friends. So the
          # stdbool.h macro clash has to be handled instead of avoided.
          #
          # mig is pre-standard-C and uses `bool` as a formal parameter NAME
          # in exactly two places (verified against the upstream sources):
          #     strdefs.h:89:  extern char *strbool( boolean_t bool );
          #     string.c:103:  strbool(boolean_t bool)     and `if (bool)` at 105
          # xnu's EXTERNAL_HEADERS/stdbool.h does `#define bool _Bool`, so the
          # parameter becomes `_Bool` and clang reports
          #     strdefs.h:89:33: error: cannot combine with previous
          #     'type-name' declaration specifier
          # -> MIGCOM COMPILE FAILED: error.c in runs 40375312365 and
          # 40376235064.
          #
          # The offending token is the PARAMETER NAME, not the function name.
          # Run 40376235064 tried
          #     -Dstrbool=strbool_renamed
          # and failed identically, because that renames the function and
          # leaves the parameter `bool` in place. `-Dbool=bool_` is not an
          # option either: it would also rewrite every genuine use of the
          # type. So rename only the parameter, textually, and verify.
          for src in strdefs.h string.c; do
            [ -f "$src" ] || { echo "::error::mig source $src missing"; exit 1; }
            cp "$src" "$src.orig"
          done
          sed -i 's/char \*strbool( boolean_t bool )/char *strbool( boolean_t bool_flag )/' strdefs.h
          sed -i 's/strbool(boolean_t bool)[[:space:]]*$/strbool(boolean_t bool_flag)/' string.c
          sed -i 's/if (bool)$/if (bool_flag)/' string.c
          echo "=== strdefs.h:89 after rename ==="
          sed -n '89p' strdefs.h
          echo "=== string.c strbool body after rename ==="
          sed -n '100,110p' string.c
          # Fail loudly if any parameter still carries the name `bool`.
          if grep -nE 'boolean_t[[:space:]]+bool[[:space:]]*[,)]' strdefs.h string.c; then
            echo "::error::a parameter named 'bool' survived the rename"
            exit 1
          fi
          echo "mig bool-parameter rename: applied and verified"
          # ---- handler.c references symbols that upstream never defines ----
          # This is not a Linux portability problem; the published
          # bootstrap_cmds sources cannot compile on ANY platform, which is
          # why every tag behaves the same. Verified against
          # bootstrap_cmds-99.260.1, -133.140.1 and today's HEAD:
          #
          #   handler.c:168  WriteStaticDecl(file, itRetCodeType,
          #                    itRetCodeType->itDeallocate,
          #                    itRetCodeType->itLongForm, "RetCodeType");
          #
          # * WriteStaticDecl is not declared or defined in any file of the
          #   project -- there are exactly 0 definitions for its 3 call sites;
          # * struct ipc_type (type.h) has no itDeallocate and no itLongForm;
          # * IsCamelot is not declared in global.h nor defined in global.c.
          #
          # Run 40382277711 died on all three:
          #     handler.c:173:53: error: no member named 'itDeallocate'
          #     handler.c:173:80: error: no member named 'itLongForm'
          #     handler.c:190:7:  error: use of undeclared identifier 'IsCamelot'
          # The Camelot code path is Apple-internal (cam/camelot_types.h does
          # not exist publicly) and xnu never selects it, so:
          #   * compile with -DIsCamelot=0 to fold away every Camelot branch;
          #   * drop the one UNCONDITIONAL WriteStaticDecl call, which is the
          #     only remaining reference. It writes a static declaration for
          #     the RetCodeType helper; migcom still works without it, and
          #     keeping the call is impossible since the fields do not exist.
          # Both edits are verified below so this cannot silently no-op.
          cp handler.c handler.c.orig
          python3 - <<'MIGFIX'
          # Every edit below is a defect in the PUBLISHED bootstrap_cmds
          # sources, not a Linux portability issue. Verified identical in
          # bootstrap_cmds-86, -99.260.1, -133.140.1 and today's HEAD.
          #
          # Text replacement (not sed) because the reasoning is easier to
          # audit and line endings are normalised first, so this behaves the
          # same on a CRLF checkout as on CI's LF one.
          import io, sys

          p = 'handler.c'
          with io.open(p, encoding='utf-8', errors='surrogateescape',
                       newline='') as f:
              s = f.read()
          orig = s
          s = s.replace('\r\n', '\n')

          edits = [
              # 1. WriteStaticDecl / WritePackMsgType are CALLED but defined
              #    nowhere in the project (0 definitions for 7 call sites).
              #    Remove only the unconditional RetCodeType calls; the others
              #    sit inside `if (IsCamelot)` and are folded by
              #    -DIsCamelot=0.
              ('  WriteStaticDecl(file, itRetCodeType, itRetCodeType->itDeallocate, itRetCodeType->itLongForm, "RetCodeType");',
               '  /* WriteStaticDecl: not defined in public bootstrap_cmds. */'),
              ('  WritePackMsgType(file, itRetCodeType, itRetCodeType->itDeallocate, itRetCodeType->itLongForm, "OutP->RetCodeType", "RetCodeType");',
               '  /* WritePackMsgType: not defined in public bootstrap_cmds. */'),
              # 2. handler.c:97 is missing the comma before statement_t, while
              #    the same function in server.c has it. clang reports the
              #    consequence at the call sites instead:
              #      handler.c:235:29: error: too many arguments to function
              #        call, expected single argument 'file', have 2 arguments
              ('WriteSymTabEntries(FILE *file  statement_t *stats)',
               'WriteSymTabEntries(FILE *file, statement_t *stats)'),
              # 3. rtServerReturn is referenced 4 times and declared in no
              #    header; routine.h has no such member. With no server-return
              #    concept in the public headers there is never one, so
              #    HandlerSideType() answers "void" and the guarded block is
              #    disabled outright rather than dereferencing nothing.
              ('  if (rt->rtServerReturn == argNULL)\n    return "void";\n  else\n    return rt->rtServerReturn->argType->itTransType;\n',
               '  /* rtServerReturn does not exist in public routine.h. */\n  (void)rt;\n  return "void";\n'),
              ('  if (rt->rtServerReturn != argNULL) {\n    argument_t *arg = rt->rtServerReturn;',
               '  if (0) { /* rtServerReturn does not exist in public routine.h */\n    argument_t *arg = argNULL;'),
               # 4. handler.c:46 declares a STATIC one-parameter WriteIncludes,
               #    while write.h:72 declares a 3-parameter non-static one and
               #    the call at handler.c:93 passes 1 argument:
               #      handler.c:46:1: error: static declaration of
               #        'WriteIncludes' follows non-static declaration
               #      handler.c:93:21: error: too few arguments to function
               #        call, expected 3, have 1
               #    The definition writes the SERVER header's prolog, so the
               #    equivalent of write.c's call is (user=FALSE, is_def=FALSE).
               #    Give it the two extra parameters rather than deleting it.
               ('static void\nWriteIncludes(FILE *file)\n',
                'void\nWriteIncludes(FILE *file, boolean_t isuser, boolean_t is_def)\n'),
               ('  WriteIncludes(file);\n',
                '  WriteIncludes(file, FALSE, FALSE); /* server header prolog */\n'),
               # 5. IsKernel is read at handler.c:75 and defined nowhere.
               #    handler.c:73 states "Reply message locations aren't
               #    dependent on IsKernel", so FALSE is the documented
               #    behaviour, not a guess.
               ('  if (IsKernel)\n',
                '  if (FALSE) /* IsKernel: not defined in public bootstrap_cmds */\n'),
               # 6. ServerProcName is used at handler.c:154 as a %s inside
               #    generated text and defined NOWHERE (0 hits in mig.c,
               #    global.c, global.h; 1 hit total = the use site). The
               #    generated line is `kern_return_t <name> (`, so a wrong
               #    value is a compile error in the generated .h and never
               #    silent corruption.
               ('fprintf(file, "kern_return_t %s (\\n", ServerProcName);',
                'fprintf(file, "kern_return_t %s (\\n", "mig_server_proc"); /* ServerProcName: undefined upstream */'),
          ]

          applied = []
          for old, new in edits:
              if old in s:
                  s = s.replace(old, new)
                  applied.append(old.split('(')[0].strip()[:40])
              elif new in s:
                  applied.append('already ' + old.split('(')[0].strip()[:30])
              else:
                  print('::error::mig handler.c: pattern not found and not applied:',
                        old.split('(')[0].strip()[:50])
                  sys.exit(1)

          if s == orig:
              print('::error::mig handler.c: no edit applied, refusing to continue')
              sys.exit(1)

          with io.open(p, 'w', encoding='utf-8', errors='surrogateescape',
                       newline='') as f:
              f.write(s)
          print('handler.c edits applied:', applied)
          MIGFIX
          # Assert the result, so a silent no-op cannot reach the build.
          if grep -qE 'WriteStaticDecl\(file, itRetCodeType,' handler.c; then
            echo "::error::unconditional WriteStaticDecl call survives"
            exit 1
          fi
          if grep -qE 'WritePackMsgType\(file, itRetCodeType,' handler.c; then
            echo "::error::unconditional WritePackMsgType call survives"
            exit 1
          fi
          if grep -qE 'WriteSymTabEntries\(FILE \*file  statement_t' handler.c; then
            echo "::error::handler.c:97 still lacks the comma before statement_t"
            exit 1
          fi
          if grep -qE 'rt->rtServerReturn' handler.c; then
            echo "::error::handler.c still dereferences rtServerReturn"
            exit 1
          fi
          echo "=== handler.c: remaining Camelot-only references (folded by -DIsCamelot=0) ==="
          grep -nE 'itDeallocate|itLongForm|IsCamelot' handler.c | head -8 || true
          INC="$INC -DIsCamelot=0"
          echo "mig handler.c fixups: applied and verified"

          # ---------------------------------------------------------------
          # iig: the IOKit Interface Generator, for iokit/DriverKit.
          #
          # This is the one genuinely Apple-only piece left. MakeInc.cmd:199
          # is
          #     export IIG := $(shell $(XCRUN) -sdk $(SDKROOT) -find iig)
          # and iig is a CLOSED-SOURCE tool shipped inside Xcode; it is not
          # in any apple-oss-distributions repo. iokit/Makefile lists
          # DriverKit in EXPINC_SUBDIRS, so the kernel build always runs it
          # on 17 .iig files and fails with
          #     IIG IOBufferMemoryDescriptor.h
          #     make[5]: *** [.../iokit/DriverKit/Makefile:61:
          #                  IOBufferMemoryDescriptor.h] Error 1
          # (run 40385145640; 17 such errors).
          #
          # This is not optional tidying: iokit/IOKit/IOMemoryDescriptor.h:35
          # includes <DriverKit/IOMemoryDescriptor.h> UNCONDITIONALLY, so the
          # generated headers must exist before any IOKit code compiles.
          #
          # PureDarwin/iig-tools (BSD-3-Clause) is a clean-room reimplementation
          # that takes Apple's exact CLI
          #   iig --def X.iig --header X.h --impl X.iig.cpp --framework-name N
          # and, per its own scope note, emits exactly what a KERNEL build
          # needs. Build it and put it where cross/bin is already on PATH.
          # If anything here fails the step says so loudly rather than letting
          # Stage 6 die 17-times with no explanation.
          IIGSRC="$RUNNER_TEMP/iig-tools"
          rm -rf "$IIGSRC"
          # Do NOT discard the build output. Run 40386619650 failed here and
          # the reason was invisible because both cmake calls were
          # `>/dev/null 2>&1`; the log showed only the ::error:: line. Keep
          # the full output in the artifact-uploaded log instead.
          if git clone -q --depth 1 https://github.com/PureDarwin/iig-tools.git "$IIGSRC"; then
            echo "=== iig-tools configure ==="
            # PIN THE HOST TOOLCHAIN. Stage 1 installs ld64 (a Mach-O linker)
            # into $RUNNER_TEMP/cross/bin and puts that directory on
            # GITHUB_PATH, so it shadows the HOST linker for everything
            # downstream. Run 40387620538 showed the consequence:
            #     ld: warning: directory not found for option
            #         '-F/System/Library/Frameworks/'
            #     ld: unknown option: -plugin
            # -F and -plugin are ld64-only; no GNU ld or lld emits either.
            # That is the same class of bug as the x86_64-linux-gnu-ar
            # shadowing fixed earlier. Pinning the compilers stops CMake
            # probing PATH at all; CMAKE_LINKER removes the error at its root.
            # CMAKE_LINKER is NOT enough. gcc/clang invoke the linker via
            # collect2, which searches PATH for `ld` -- so Stage 1's ld64 in
            # cross/bin still wins no matter what -DCMAKE_LINKER says. Run
            # 40388443098 proved it: the pins were applied (the log shows
            # /usr/bin/c++ running) and `ld: unknown option: -plugin` still
            # appeared. The only reliable fix is to take cross/bin OFF PATH
            # for this host build.
            IIG_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v "^${RUNNER_TEMP}/cross/bin$" | paste -sd:)
            # Never leave PATH empty: if cross/bin were somehow the only
            # entry, fall back to the canonical system path.
            [ -n "$IIG_PATH" ] || IIG_PATH="/usr/local/bin:/usr/bin:/bin"
            case ":$IIG_PATH:" in
              *":${RUNNER_TEMP}/cross/bin:"*)
                echo "::warning::cross/bin still on host build PATH";;
            esac
            echo "  host build PATH (cross/bin removed): $(echo "$IIG_PATH" | cut -d: -f1-3)"
            PATH="$IIG_PATH" cmake -S "$IIGSRC" -B "$IIGSRC/build" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=/usr/bin/cc \
              -DCMAKE_CXX_COMPILER=/usr/bin/c++ \
              -DCMAKE_LINKER=/usr/bin/ld \
              -DCMAKE_AR=/usr/bin/ar \
              -DCMAKE_RANLIB=/usr/bin/ranlib 2>&1 | tail -20
            cfg_rc=${PIPESTATUS[0]}
            echo "configure rc=$cfg_rc"
            echo "=== iig-tools build ==="
            PATH="$IIG_PATH" cmake --build "$IIGSRC/build" -j"$(nproc)" 2>&1 | tail -40
            bld_rc=${PIPESTATUS[0]}
            echo "build rc=$bld_rc"
            if [ "$cfg_rc" -ne 0 ] || [ "$bld_rc" -ne 0 ] || [ ! -x "$IIGSRC/build/iig" ]; then
              # Do NOT exit. iig and mig solve different halves of the build
              # (iig: DriverKit/*.iig -> IO*.h; mig: mach/*.defs -> *_mach.h),
              # so a broken iig must not prevent the mig sections from running.
              # The mig experiment spent four runs unexecuted because an
              # earlier stage exited first; that will not happen again.
              echo "::error::iig-tools failed to build (configure=$cfg_rc build=$bld_rc binary=$([ -x "$IIGSRC/build/iig" ] && echo yes || echo no))"
              echo "::warning::continuing WITHOUT iig so the mig sections can report"
              IIG_OK=0
            else
              IIG_OK=1
            fi
            if [ "${IIG_OK:-0}" = 1 ]; then
              cp "$IIGSRC/build/iig" "$RUNNER_TEMP/cross/bin/iig"
              chmod +x "$RUNNER_TEMP/cross/bin/iig"
              echo "iig: built from PureDarwin/iig-tools"
            fi
          else
            echo "::error::could not clone PureDarwin/iig-tools (iig is Apple-closed-source)"
            echo "::warning::continuing WITHOUT iig so the mig sections can report"
            IIG_OK=0
          fi
          # Host toolchain identity, so the next time a HOST build links we can
          # see whether cross/bin shadowed it without reading the whole log.
          # This is the exact signature that produced
          #     ld: unknown option: -plugin
          for t in cc c++ ld ar ranlib nm; do
            printf '  host %-7s %s\n' "$t" "$(for d in /usr/bin /bin; do [ -x "$d/$t" ] && echo "$d/$t" && break; done)"
          done
          echo "  PATH head: $(echo "$PATH" | cut -d: -f1-3)"
          echo "  iig available: $([ "${IIG_OK:-0}" = 1 ] && echo yes || echo 'NO (skipped, not fatal)')"

          # Prove it on the real thing before the kernel build depends on it:
          # generate one DriverKit header exactly as iokit/DriverKit/Makefile
          # does, and require a non-empty result.
          iigprobe="$RUNNER_TEMP/iigprobe"
          rm -rf "$iigprobe"; mkdir -p "$iigprobe"
          if [ "${IIG_OK:-0}" != 1 ]; then
            echo "iig probe: SKIPPED (iig unavailable -- not fatal this run)"
          elif "$RUNNER_TEMP/cross/bin/iig" \
               --def "$GITHUB_WORKSPACE/dxb/xnu/iokit/DriverKit/IOService.iig" \
               --header "$iigprobe/IOService.h" \
               --impl "$iigprobe/IOService.iig.cpp" \
               --framework-name DriverKit -- ; then
            if [ -s "$iigprobe/IOService.h" ] && [ -s "$iigprobe/IOService.iig.cpp" ]; then
              echo "iig: probe OK ($(wc -l < "$iigprobe/IOService.h") header lines, $(wc -l < "$iigprobe/IOService.iig.cpp") impl lines)"
            else
              echo "::error::iig produced empty output for IOService.iig"
              echo "::warning::continuing WITHOUT iig so the mig sections can report"
            fi
          else
            echo "::error::iig failed on iokit/DriverKit/IOService.iig"
            echo "::warning::continuing WITHOUT iig so the mig sections can report"
          fi

          # ---------------------------------------------------------------
          # type.h / routine.h field additions.
          #
          # These are NOT portability shims. Each one is a field that
          # bootstrap_cmds' own .c files read and its own .h files fail to
          # declare -- defects in the published sources. All four were
          # verified against the openmach tree, which is a different vintage
          # of mig, so only the ones that are byte-identical in intent are
          # taken from it.
          # ---------------------------------------------------------------
          python3 - <<'MIGFIELDS'
          import io, sys

          def patch(path, edits):
              with io.open(path, encoding='utf-8', errors='surrogateescape',
                           newline='') as f:
                  s = f.read()
              orig = s
              s = s.replace('\r\n', '\n')
              done = []
              for old, new in edits:
                  if old in s:
                      if s.count(old) != 1:
                          print('::error::%s: pattern occurs %d times, refusing'
                                % (path, s.count(old)))
                          sys.exit(1)
                      s = s.replace(old, new)
                      done.append(old.strip().split('\n')[0][:38])
                  elif new in s:
                      done.append('already ' + old.strip()[:26])
                  else:
                      print('::error::%s: pattern not found: %r' % (path, old[:60]))
                      sys.exit(1)
              if s == orig:
                  print('::error::%s: no change made' % path)
                  sys.exit(1)
              with io.open(path, 'w', encoding='utf-8', errors='surrogateescape',
                           newline='') as f:
                  f.write(s)
              print('%s field edits applied: %s' % (path, done))

          # --- routine.h -------------------------------------------------
          # rtMaxReplySize: read at handler.c:148,149,322; written nowhere
          #   in the tree. Added and left unset, which is exactly Apple's
          #   own behaviour. Its value is NOT invented.
          # rtReplySize: read at handler.c:320; does not exist in Apple's
          #   routine.h at all (openmach has it; Apple retired it). Adding
          #   it beats repointing :320, which would silently change the
          #   generated msg_size.
          patch('routine.h', [
              ('    u_int rtMaxReplyPos;        /* maximum of argReplyPos */\n',
               '    u_int rtMaxReplyPos;        /* maximum of argReplyPos */\n'
               '    u_int rtMaxReplySize;       /* max reply size; read by handler.c,\n'
               '                                   never written upstream -- left 0 */\n'
               '    u_int rtReplySize;          /* declared by handler.c:320;\n'
               '                                   absent from Apple routine.h */\n'),
          ])

          # --- type.h ----------------------------------------------------
          # itLongForm / itDeallocate are read throughout handler.c but are
          # absent from Apple's struct ipc_type. openmach type.h:147-148 has
          # them immediately after itInLine, and its type.c:106-108
          # initialises them FALSE and d_NO.
          #
          # dealloc_t is NOT added here: Apple's type.h:79-83 already defines
          # it with exactly d_NO / d_YES / d_MAYBE, and
          # type.h:86 already has strdealloc(d). Inserting openmach's four
          # enumerators (which include d_NONE) would have been a duplicate
          # typedef -- a compile error. Only the two missing fields are added.
          #
          # CRITICAL: type.c:116 `itAlloc` is a POSITIONAL initialiser whose
          # trailing comments name each field in order. Inserting fields into
          # the struct without inserting matching entries there would shift
          # every later value onto the wrong member -- FALSE meant for
          # itMigInLine landing on itLongForm, TRUE meant for itStruct landing
          # on itInNameStr and so on. That compiles cleanly and is silently
          # wrong, which is precisely the failure mode we refuse. So the
          # struct and the initialiser are edited TOGETHER, in one entry pair
          # at the same position, keeping the two lists aligned.
          patch('type.h', [
              ('    boolean_t itInLine;\n',
               '    boolean_t itInLine;\n'
               '    boolean_t itLongForm;\n'
               '    dealloc_t itDeallocate;\n'),
          ])
          patch('type.c', [
              ('    TRUE,     /* boolean_t itInLine */\n',
               '    TRUE,     /* boolean_t itInLine */\n'
               '    FALSE,    /* boolean_t itLongForm */\n'
               '    d_NO,     /* dealloc_t itDeallocate */\n'),
          ])
          MIGFIELDS

          # Assert the fields landed, so a silent no-op cannot reach the build.
          # dealloc_t is deliberately NOT asserted: Apple's type.h already
          # defines it, so a grep for it would pass whether or not we edited.
          for pair in 'routine.h:rtMaxReplySize' 'routine.h:rtReplySize' \
                      'type.h:itLongForm' 'type.h:itDeallocate'; do
            f="${pair%%:*}"; sym="${pair##*:}"
            n=$(grep -c "\b${sym}\b" "$f" || true)
            if [ "${n:-0}" -ge 1 ]; then
              echo "  $f declares $sym: $n occurrence(s)"
            else
              echo "::error::$f does not declare $sym"
              exit 1
            fi
          done
          echo "  type.h dealloc_t (pre-existing, not added): $(grep -c '\bdealloc_t\b' type.h) occurrence(s)"
          echo "mig type.h/routine.h field additions: verified"
          if [ ! -f /usr/local/include/compat.h ]; then
            echo "::error::compat.h missing; Stage 1b must run before Stage 5"
            exit 1
          fi
          MIGCOMPILE_BAD=""
          for f in error.c global.c handler.c header.c mig.c routine.c \
                   server.c statement.c string.c type.c user.c utils.c \
                   out/parser.c out/lexxer.c; do
            echo "== $f"
            clang -std=gnu89 -w -Dlinux -include /usr/local/include/compat.h \
              -o "out/$(basename "${f%.c}").o" -c "$f" $INC \
              || {
                echo "MIGCOM COMPILE FAILED: $f"
                MIGCOMPILE_BAD="$MIGCOMPILE_BAD $f"
                # -H prints every header actually opened, in order, with the
                # path each resolved to. Without this we can only guess which
                # header set is in play, which is precisely the error that
                # cost run 40380579795: the shadowing header was reached via
                # glibc's own include, not mig's.
                echo "--- first 25 headers opened for $f (clang -H) ---"
                clang -std=gnu89 -w -Dlinux -include /usr/local/include/compat.h \
                  -H -fsyntax-only "$f" $INC 2>&1 \
                  | grep -E '^\.+' | head -25 || true
                # DO NOT exit here. We no longer need this migcom: the
                # Debian prebuilt one (mig-x86-64-gnu) replaces it below, and
                # exiting here is what has blocked every downstream section
                # for five consecutive runs. Record the failure and continue.
              }
          done
          clang -o out/migcom out/*.o -lm || echo "MIGCOM LINK FAILED"
          ./out/migcom -version || true
          # Do NOT exit here on a missing migcom. The mig driver below must be
          # installed even when migcom fails to build, or the very run that
          # needs the driver is the run that skips installing it. Run
          # 40385098993 did exactly that: handler.c failed at the compile loop
          # above, the script exited, and the -arch probe, /usr/bin/arch,
          # mig -version and all three driver paths never printed.
          # Install unconditionally, then judge, then exit.
          if [ ! -x out/migcom ]; then
            echo "::warning::migcom was not produced; installing the mig driver anyway"
          fi
          mkdir -p "$RUNNER_TEMP/cross/bin" "$RUNNER_TEMP/cross/libexec"
          if [ -x out/migcom ]; then
            cp out/migcom "$RUNNER_TEMP/cross/bin/migcom"
          fi
          # mig.sh is the driver xnu calls. Install it UNMODIFIED:
          #   mig.sh:84  M=${MIGCOM-${migcomPath}}
          # Already honours a MIGCOM environment variable, and Stage 6 passes
          # MIGCOM="$RUNNER_TEMP/cross/bin/migcom" on the make command line
          # (MakeInc.cmd exports it), so the driver will find our migcom with
          # no edit at all. An earlier version `sed`-replaced that line with a
          # hardcoded path, which would have *broken* the ${MIGCOM-} override
          # instead of using it. Do not patch what already works.
          cp mig.sh "$RUNNER_TEMP/cross/bin/mig"
          chmod +x "$RUNNER_TEMP/cross/bin/mig"
          # mig.sh:68 resolves its fallback as
          #   migcomPath=$(realpath "${scriptRoot}/../libexec/migcom")
          # i.e. a libexec/ SIBLING of bin/, not bin/migcom. Satisfy that too
          # so the driver works even if MIGCOM is ever unset. Free belt.
          ln -sf "$RUNNER_TEMP/cross/bin/migcom" "$RUNNER_TEMP/cross/libexec/migcom"
          echo '--- mig driver installed ---'
          ls -la "$RUNNER_TEMP/cross/bin/mig" "$RUNNER_TEMP/cross/bin/migcom" \
                 "$RUNNER_TEMP/cross/libexec/migcom" 2>&1 || true
          grep -n 'M=${MIGCOM-' "$RUNNER_TEMP/cross/bin/mig" \
            || echo "::warning::mig.sh no longer has the \${MIGCOM-} line"
          # /usr/bin/arch exists on Linux and prints x86_64, but Darwin's
          # `clang -arch x86_64` is not a Linux flag. Print what mig will pass
          # so a later -arch failure is recognisable rather than mysterious.
          echo "  /usr/bin/arch -> $(/usr/bin/arch 2>/dev/null || echo 'absent')"
          echo "  clang -arch probe: $(clang -arch x86_64 -E -x c /dev/null >/dev/null 2>&1 && echo 'accepted' || echo 'REJECTED (Darwin-only flag)')"
          # Ask the driver for its version. It delegates to migcom
          # (mig.sh:86-89), so this is a real end-to-end check of the pair.
          "$RUNNER_TEMP/cross/bin/mig" -version 2>&1 | head -3 || \
            echo "  mig -version: driver ran but migcom is not usable yet"
          echo "$RUNNER_TEMP/cross/bin" >> "$GITHUB_PATH"
          # Now judge. Earlier runs died with a bare "exit code 1" and no
          # visible cause because `|| true` hid both the failure and its
          # message. Report the real verdict instead: migcom must exist and
          # answer -version.
          echo "=== mig verdict (source-built, informational) ==="
          echo "  source-built migcom files that failed to compile:${MIGCOMPILE_BAD:- none}"
          if [ -x "$RUNNER_TEMP/cross/bin/migcom" ] && "$RUNNER_TEMP/cross/bin/migcom" -version 2>&1 | head -2; then
            echo "  migcom(source-built): answers -version"
          else
            echo "  migcom(source-built): unusable -- expected, Debian's replaces it below"
          fi
          # No exit. The source-built migcom is superseded by the prebuilt
          # Debian binary; aborting here is what blocked every downstream
          # section for five runs.

          # ---------------------------------------------------------------
          # ACCEPTANCE TEST: one .defs file, end to end.
          #
          # lockd.defs is the file Stage 6 actually asked for (it is what
          # osfmk/lockd/Makefile:46 runs mig on), and lockd is NOT a
          # death-pill subsystem. Generate the header with our migcom, then
          # COMPILE it. If migcom's field assumptions are wrong the error
          # names the bad field; that is why this is safe to attempt.
          # ---------------------------------------------------------------
          # ===============================================================
          # PREBUILT migcom FROM DEBIAN
          #
          # Every previous attempt built migcom from Apple's bootstrap_cmds,
          # whose published struct definitions are a stripped skeleton. That
          # produced a refilling error queue: 11 closed, 19+ revealed, then
          # clang stopped at -ferror-limit. handler.c is a COMPLETE modern
          # writer compiled against INCOMPLETE headers, so every field we add
          # exposes the next reader of a field that was removed.
          #
          # Debian ships a prebuilt amd64 migcom inside the `mig` SOURCE
          # package, under a different BINARY name:
          #     Package: mig-x86-64-gnu   (source: mig)
          #     trixie 1.8+git20231217-8   sid 1.8+git20231217-11
          #     Depends: libc6 (>= 2.34)     Installed-Size: 160
          #     usr/bin/x86_64-gnu-mig
          #     usr/lib/mig/x86_64-gnu-migcom   <- real x86-64 ELF, 125520 b
          #
          # It is Hurd-lineage: one consistent vintage, every translation
          # unit built against the same struct set. Strings in the binary:
          # mach_msg_type_t, mach_msg_type_long_t and MSG_TYPE_POLYMORPHIC
          # PRESENT; rtMaxReplySize, argPuntNum, akbQuickCheck, argLongForm,
          # IsCamelot and death_pill ABSENT -- it never read the fields that
          # were stripped from Apple's public headers.
          #
          # Fetched as a .deb directly rather than adding a foreign apt suite:
          # no pinning, no Release-file juggling, one verified artifact.
          # ===============================================================
          # ===============================================================
          # MIGCC SHIM
          #
          # mig.sh:183 runs  "$C" -E -arch ${arch} ... temp.c | "$M" ...
          # where C=${MIGCC} and, unset, MIGCC falls back to xcrun -find cc
          # or realpath "${scriptRoot}/cc" (mig.sh:74-83). On Linux that
          # leaves `cc`, which has no -arch:
          #     cc: error: unrecognized command-line option '-arch'
          # This was predicted before the first run and confirmed by run
          # 40388982459 in every invocation.
          #
          # mig.sh:74 is `if [ -z "${MIGCC}" ]`, so exporting MIGCC is the
          # supported way to substitute the compiler -- no patching of
          # mig.sh. $C is what gets executed, so the shim is used for the
          # preprocess step.
          #
          # Written as bash with an ARRAY, not `eval` with a string: a
          # quoting bug in a compiler wrapper produces errors that read like
          # source errors, and that is a silent-wrong-result risk. Every
          # argument is echoed on the first invocation so a mangled
          # argument list is visible in the log rather than inferred.
          # ===============================================================
          # MIGCC SHIM
          #
          # mig.sh:183 runs  "$C" -E -arch ${arch} ... temp.c | "$M" ...
          # where C=${MIGCC} and, unset, MIGCC falls back to xcrun -find cc
          # or realpath "${scriptRoot}/cc" (mig.sh:74-83). On Linux that
          # leaves `cc`, which has no -arch:
          #     cc: error: unrecognized command-line option '-arch'
          # Confirmed in every invocation of run 40388982459.
          #
          # mig.sh:74 is `if [ -z "${MIGCC}" ]`, so exporting MIGCC is the
          # supported substitution point -- mig.sh is not patched.
          #
          # Built with printf rather than a heredoc: a heredoc body at
          # column 0 would terminate the YAML block scalar and break the
          # whole workflow. Arrays, never eval: a quoting bug in a compiler
          # wrapper produces errors that read like source errors.
          # ===============================================================
          SHIM="$RUNNER_TEMP/cross/bin/migcc-shim"
          {
            echo '#!/bin/bash'
            echo '# Strip Darwin-only "-arch <value>"; pass "-target <value>" through.'
            echo '# Also strip the Darwin CODE-GEN switches. mig.sh routes every'
            echo '# unrecognised "-*" into cppflags (mig.sh:129), and MIGFLAGS'
            echo '# (MakeInc.def:895) carries CFLAGS_ARM64 and'
            echo '# DEPLOYMENT_TARGET_FLAGS, so the preprocessor gets'
            echo '#     -mkernel -msoft-float -mmacosx-version-min=13.3 ...'
            echo '# Clang tolerates these; GCC rejects them outright:'
            echo '#     cc: error: unrecognized command-line option (quote)-mkernel(quote)'
            echo '#     cc: error: unrecognized command-line option'
            echo '#         (quote)-mmacosx-version-min=13.3(quote)'
            echo '# which is what run 40401667613 reported 131 times. They are'
            echo '# codegen switches and -E discards codegen entirely, so dropping'
            echo '# them here cannot change the preprocessed .defs text.'
            echo 'args=(); dropped=""; narch=0; ncc=0'
            echo 'while [ $# -gt 0 ]; do'
            echo '  case "$1" in'
            echo '    -arch) dropped="$dropped $1 $2"; narch=$((narch+1)); shift 2 ;;'
            echo '    -mkernel|-msoft-float|-mno-soft-float) dropped="$dropped $1"; ncc=$((ncc+1)); shift ;;'
            echo '    -mmacosx-version-min=*|-miphoneos-version-min=*) dropped="$dropped $1"; ncc=$((ncc+1)); shift ;;'
            echo '    *)     args+=("$1"); shift ;;'
            echo '  esac'
            echo 'done'
            echo 'echo "MIGCC SHIM: stripped $narch -arch pair(s), $ncc darwin codegen switch(es):${dropped:- (none)} | argc now ${#args[@]}" >&2'
            echo 'if [ ! -f "${MIGCC_SHIM_MARK:-/tmp/.migcc_mark}" ]; then'
            echo '  { echo "MIGCC SHIM first invocation"'
            echo '    echo "  DROPPED:$dropped"'
            echo '    echo "  argc now: ${#args[@]}"'
            echo '    echo "  exec: clang ${args[*]}"'
            # THE `>&2` IS LOAD-BEARING. mig.sh:183 runs
            #     "$C" -E ... | "$M" "${migflags[@]}"
            # so MIGCC's STDOUT *IS* the .defs stream handed to migcom. The
            # first version of this block piped the diagnostic through `tee`
            # without redirection, so five lines of chatter landed at the top
            # of migcom's input on the FIRST mig call of each step:
            #
            #     type mach_msg_type_number_t = ...
            #     MIGCC SHIM first invocation
            #       DROPPED: -arch arm64 -mkernel -mmacosx-version-min=13.3
            #       argc now: 39
            #       exec: clang -E ...
            #     # 1 "/tmp/mig.ZBPJpW/clock.17990.c"
            #
            # Seen verbatim in the captured stream clock.h.18071_1.stream, and
            # it is why clock.h failed at osfmk/mach/Makefile:287 while every
            # later target in that step succeeded -- the mark file lets this
            # block run once, so only the first mig call was corrupted.
            # Diagnostic output must never share a channel with the stream.
            echo '  } >&2 | tee "${MIGCC_SHIM_MARK:-/tmp/.migcc_mark}" >&2'
            echo 'fi'
            # EXEC CLANG, NOT cc.
            # On ubuntu-latest /usr/bin/cc is GCC, not clang. Clang accepts
            # the -arch/-target Darwin spellings the shim passes through and
            # is the compiler xnu is written for; GCC understands neither and
            # also cannot parse the Apple C dialect that std_types.defs
            # drags in. clang is put on the path by the toolchain step
            # (update-alternatives, or the image's clang 18).
            echo 'exec clang "${args[@]}"'
          } > "$SHIM"
          chmod +x "$SHIM"
          MIGCC_SHIM_MARK="$RUNNER_TEMP/migcc_mark"; rm -f "$MIGCC_SHIM_MARK"; export MIGCC_SHIM_MARK
          echo "int main(void){return 0;}" > "$RUNNER_TEMP/shimprobe.c"
          if "$SHIM" -E -arch x86_64 "$RUNNER_TEMP/shimprobe.c" >/dev/null 2>"$RUNNER_TEMP/shim.err"; then
            echo "  shim PROBE: -arch stripped, cpp exit 0"
          else
            echo "::error::shim PROBE failed: $(head -2 "$RUNNER_TEMP/shim.err" | tr '\n' ' ')"
          fi
          export MIGCC="$SHIM"

          # --- CC shim: drop Darwin-only codegen switches for kernel objects --
          # Now that doconf works, the build reaches the actual kernel compile
          # and every object fails the same way:
          #
          #     clang: error: unsupported option '-arch' for target 'x86_64-pc-linux-gnu'
          #     clang: warning: argument unused ... '-mmacosx-version-min=13.3'
          #     make[7]: *** [.../security/DEVELOPMENT/Makefile:157: mac_audit.o] Error 1
          #
          # MIGFLAGS carries `-arch arm64e` and
          # `-mmacosx-version-min=13.3` (MakeInc.def:225-270, :70), and the
          # kernel CFLAGS carry the same pair. The MIGCC shim already strips
          # them for the preprocessor; kernel objects need the same treatment,
          # because a Linux clang cannot target Darwin and has no need to --
          # the objects are laid out by OUR linker and the Mach-O headers come
          # from cctools.
          #
          # Keep everything else, and do NOT touch -E/-S/-c or optimisation
          # flags: this must stay a faithful host compiler for the rest of the
          # command line.
          cc_shim="$RUNNER_TEMP/cross/bin/cc-shim"
          {
            echo '#!/bin/bash'
            echo '# Drop Darwin-only switches a Linux clang rejects. See the'
            echo '# workflow comment: -arch and -mmacosx-version-min are Darwin'
            echo '# target selectors with no meaning on this host.'
            echo 'args=()'
            echo 'while [ $# -gt 0 ]; do'
            echo '  case "$1" in'
            # -arch is deliberately NOT stripped: the Darwin wrapper keeps it
            # and clang honours it once --target=aarch64-apple-darwin is set.
            # Stripping it would discard the architecture the build asked for.
            echo '    -arch) args+=("$1" "$2"); shift 2 ;;'
            echo '    -mmacosx-version-min=*|-miphoneos-version-min=*|-mios-version-min=*) shift ;;'
            echo '    -mkernel|-msoft-float|-mno-soft-float) shift ;;'
            echo '    *) args+=("$1"); shift ;;'
            echo '  esac'
            echo 'done'
            # DELEGATE to the Darwin-target wrapper that xcrun -find clang
            # answers with, instead of pinning a host clang. Dropping -arch and
            # then running plain /usr/bin/clang would silently build x86_64
            # Linux objects again -- the exact failure this shim exists to fix.
            # The wrapper itself handles -arch (clang accepts it once a Darwin
            # --target is set); this shim only removes what clang rejects even
            # with that target.
            echo 'if [ -x /usr/local/bin/xtool-clang ]; then'
            echo '  exec /usr/local/bin/xtool-clang "${args[@]}"'
            echo 'fi'
            echo 'exec /usr/bin/clang --target=aarch64-apple-darwin "${args[@]}"'
          } > "$cc_shim"
          chmod +x "$cc_shim"
          # Two-sided proof: Darwin flags must be gone AND a real compile must
          # still work, so a shim that strips too much cannot pass.
          printf 'int probe(void){return 0;}\n' > "$RUNNER_TEMP/ccprobe.c"
          if "$cc_shim" -arch arm64e -mmacosx-version-min=13.3 -c \
               "$RUNNER_TEMP/ccprobe.c" -o "$RUNNER_TEMP/ccprobe.o" 2>"$RUNNER_TEMP/cc.err"; then
            echo "  cc-shim PROBE: -arch/-mmacosx-version-min stripped, object built"
          else
            echo "::error::cc-shim PROBE failed: $(head -2 "$RUNNER_TEMP/cc.err" | tr '\n' ' ')"
          fi
          if "$cc_shim" -arch arm64e -c "$RUNNER_TEMP/ccprobe.c" -o /dev/null 2>&1 \
               | grep -q "unsupported option '-arch'"; then
            echo "::error::cc-shim still leaks -arch"
          else
            echo "  cc-shim PROBE: no -arch leak"
          fi

          # Capture the exact byte stream migcom is handed, once per target.
          # The duplicate-type question has been argued from indirect evidence
          # twice and drew a wrong answer both times (the include-guard typo
          # theory, which was wrong -- the guard is spelled consistently and
          # does work -- and a "same file:line x2" that proved to be the
          # provenance dump's own off-by-one). Instead of inferring a third
          # time, this run records what migcom actually receives and uploads
          # it. The capture is off by default inside the shim, so this is the
          # only place it is switched on.
          export MIGCOM_SHIM_DUMP="$GITHUB_WORKSPACE/migcom-streams"
          rm -rf "$MIGCOM_SHIM_DUMP"
          mkdir -p "$MIGCOM_SHIM_DUMP"
          echo "MIGCOM_SHIM_DUMP=$MIGCOM_SHIM_DUMP (capturing migcom stdin per target)"

          # --- __LP64__ PROBE -------------------------------------------------
          # machine_types.defs uses `#if defined(__LP64__)` in SIX places to
          # pick 64-bit vs 32-bit spellings of uintptr_t/intptr_t, register_t,
          # vm_address_t/vm_offset_t/vm_size_t. GNU mig treats a REPEATED
          # `type X = ...` as a FATAL error (parser.y:339 calls error(), not
          # warn()), so if cpp ever emits BOTH branches we get exactly six
          # "overriding previous definition" errors and exit 1.
          #
          # Apple mig.sh:91 passes only -D__MACH30__ and relies on
          # `-arch arm64` making the compiler define __LP64__ itself. Our MIGCC
          # shim STRIPS -arch, so __LP64__ now comes from the host compiler
          # target instead. This probe prints the ground truth rather than
          # assuming it: which branch cpp actually takes for that condition.
          {
            echo "#if defined(__LP64__)"
            echo "LP64_BRANCH_TAKEN"
            echo "#else"
            echo "ILP32_BRANCH_TAKEN"
            echo "#endif"
          } > "$RUNNER_TEMP/lp64probe.c"
          LP64_STATE=$($SHIM -E -arch arm64 "$RUNNER_TEMP/lp64probe.c" 2>/dev/null | grep -E "LP64_BRANCH_TAKEN|ILP32_BRANCH_TAKEN" || echo "PROBE-FAILED")
          echo "  __LP64__ probe (cc -E after -arch strip): $LP64_STATE"
          echo "  host cc: $(/usr/bin/cc --version 2>&1 | head -1)"
          echo "  host uname: $(uname -m)"

          echo "=== INSTALL: Debian mig-x86-64-gnu ==="
          MIGPKG="$RUNNER_TEMP/migpkg"; rm -rf "$MIGPKG"; mkdir -p "$MIGPKG"
          MIG_DEB_URL="http://deb.debian.org/debian/pool/main/m/mig/mig-x86-64-gnu_1.8+git20231217-8_amd64.deb"
          if curl -fsSL --retry 3 --max-time 180 -o "$MIGPKG/mig.deb" "$MIG_DEB_URL"; then
            echo "  downloaded: mig-x86-64-gnu_1.8+git20231217-8_amd64.deb ($(stat -c%s "$MIGPKG/mig.deb") bytes)"
            ( cd "$MIGPKG" && ar x mig.deb ) || echo "  ar x failed"
            if [ -f "$MIGPKG/data.tar.xz" ]; then
              tar -xJf "$MIGPKG/data.tar.xz" -C "$MIGPKG" && echo "  extracted data.tar.xz"
            fi
            MIGCOM_BIN="$MIGPKG/usr/lib/mig/x86_64-gnu-migcom"

            # ---------------------------------------------------------------
            # PATCH: downgrade the duplicate-TypeDecl diagnostic from fatal.
            #
            # The migcom stdin stream has been measured clean three ways:
            #   234 type declarations, 234 DISTINCT names, 0 duplicates
            #   `type int64 = int64_t;` present once (line 43 of the capture)
            #   CR count 0; streql is plain strcmp (mig_string.h:43)
            #   std_types.defs opens exactly once (one `# 1 "…std_types.defs" 1`)
            # yet migcom reports `overriding previous definition of int64` once
            # per invocation. itCheckDecl sets it->itName unconditionally
            # (type.c:401), so the alias chain cannot be the cause either, and
            # init_type's builtin list is exactly char/short/int/uintptr_t/
            # intptr_t (type.c:977-985) -- int64 is not in it, and the literal
            # "int64" occurs zero times in GNU mig's source.
            #
            # So the collision is INSIDE migcom and invisible from outside.
            # error() -> warn() here is not a silent fix:
            #   * the message still prints, with the name, on stderr;
            #   * codegen between two duplicate declarations is unchanged -
            #     itInsert() overwrites the entry the same way either way;
            #   * and the run that follows either produces a kernel header
            #     (collision harmless) or a header we can diff against Apple's
            #     (collision harmful). Either outcome is information.
            # Only the TypeDecl site is downgraded; every other error() in mig
            # stays fatal, because those are real errors.
            #
            # `set +e`: an optional build must never take the run down.
            set +e
            MIGSRC="$RUNNER_TEMP/migsrc"
            rm -rf "$MIGSRC"; mkdir -p "$MIGSRC"
            MIG_TARBALL="mig_1.8+git20231217.orig.tar.xz"
            MIG_SRC_URL="http://deb.debian.org/debian/pool/main/m/mig/$MIG_TARBALL"
            echo "=== PATCH: rebuilding migcom with non-fatal duplicate TypeDecl ==="
            if curl -fsSL --retry 3 --max-time 240 -o "$MIGSRC/$MIG_TARBALL" "$MIG_SRC_URL"; then
              echo "  downloaded $MIG_TARBALL ($(stat -c%s "$MIGSRC/$MIG_TARBALL") bytes)"
              tar -xJf "$MIGSRC/$MIG_TARBALL" -C "$MIGSRC" && echo "  extracted"
              MIGTOP="$(find "$MIGSRC" -maxdepth 1 -mindepth 1 -type d | head -1)"
              echo "  source root: $MIGTOP"
              if [ -f "$MIGTOP/parser.y" ]; then
                grep -n 'overriding previous definition' "$MIGTOP/parser.y"
                # Word-boundary-safe, and deliberately narrow: only the line
                # that follows the itLookUp test inside TypeDecl.
                sed -i 's|^\(\s*\)error("overriding previous definition of %s", name);|\1warn("TOLERATED duplicate type declaration: %s (patched: error -> warn)", name);|' "$MIGTOP/parser.y"
                echo "  patched parser.y:"
                grep -n 'overriding previous definition\|TOLERATED duplicate' "$MIGTOP/parser.y" || true
                # parser.c is pre-generated and shipped; regenerate it so the
                # patch actually reaches the binary. flex/bison are available
                # on ubuntu-latest; if regeneration fails we must NOT silently
                # keep the fatal version.
                if command -v bison >/dev/null 2>&1; then
                  ( cd "$MIGTOP" && bison -y -o parser.c parser.y ) \
                    && echo "  regenerated parser.c with bison" \
                    || echo "  ::warning::bison failed to regenerate parser.c"
                else
                  echo "  bison not present; patching pre-generated parser.c directly"
                  sed -i 's|^\(\s*\)error("overriding previous definition of %s", name);|\1warn("TOLERATED duplicate type declaration: %s (patched: error -> warn)", name);|' "$MIGTOP/parser.c"
                fi
                echo "  parser.c now contains $(grep -c 'TOLERATED duplicate' "$MIGTOP/parser.c") patched site(s)"
                if [ "$(grep -c 'TOLERATED duplicate' "$MIGTOP/parser.c")" -lt 1 ]; then
                  echo "  ::warning::patch did not land in parser.c; keeping the Debian binary"
                else
                  # NEVER silence the build: a failed rebuild whose error is
                  # discarded costs a whole run to diagnose. Keep the tail,
                  # which is where the actual compiler error lives.
                  #
                  # Everything runs inside ONE subshell whose cwd is $MIGTOP.
                  # configure is not necessarily +x in the tarball, so invoke
                  # it as `sh ./configure`. The exit status is threaded out
                  # explicitly because a `| tail` pipeline would otherwise
                  # report tail's status, not make's.
                  # The JOB environment carries the XNU cross toolchain: an
                  # Apple-flavoured `ld` (cctools-port) is on PATH, and the
                  # xcodeshim sets -F/System/Library/Frameworks. Measured in
                  # run 40409305588:
                  #   configure: C compiler cannot create executables
                  #   ld: unknown option: -plugin
                  #   ld: warning: directory not found ... -F/System/...
                  # So `cc` is NOT the host compiler here. Build migcom with
                  # the platform compiler pinned explicitly, and with PATH cut
                  # down to system dirs so no shim linker can be picked up.
                  HOSTCC=/usr/bin/gcc
                  command -v "$HOSTCC" >/dev/null 2>&1 || HOSTCC=/usr/bin/cc
                  echo "  host compiler: $HOSTCC ($("$HOSTCC" --version 2>&1 | head -1))"
                  set +e
                  ( cd "$MIGTOP" || exit 1
                    export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                    export CC="$HOSTCC" LD=/usr/bin/ld AR=/usr/bin/ar RANLIB=/usr/bin/ranlib
                    export CFLAGS="-O1 -w" LDFLAGS=""
                    unset CPATH C_INCLUDE_PATH LIBRARY_PATH FAKE_PLATFORMS 2>/dev/null || true
                    # cpu.symo is a generated source that includes
                    # <mach/message.h>; this tree does not ship Mach headers
                    # system-wide, so point cpp at the XNU checkout we already
                    # have. Without this the build dies at the first object:
                    #   cpu.symc:1:10: fatal error: mach/message.h: No such file
                    # -DKERNEL is not cosmetic. bsd/sys/cdefs.h:790-793:
                    #     #ifdef KERNEL
                    #     #define __DARWIN_ALIAS_STARTING(_mac,_iphone,x)
                    #     #else
                    #     #include <sys/_symbol_aliasing.h>
                    # _symbol_aliasing.h is a macOS SDK header that xnu never
                    # ships (absent from bsd/sys AND EXTERNAL_HEADERS), so
                    # without the define the build chases a file that does not
                    # exist by design. cpu.sym is kernel assembly; KERNEL is the
                    # correct define and the #else branch then disappears.
                    XNUMACH="$GITHUB_WORKSPACE/dxb/xnu/osfmk"
                    if [ -d "$XNUMACH/mach" ]; then
                      export CFLAGS="${CFLAGS} -I$XNUMACH"
                      echo "  mach headers: -I$XNUMACH ($(ls "$XNUMACH/mach"/*.h 2>/dev/null | wc -l) headers)"
                    else
                      echo "  ::warning::no $XNUMACH/mach; cpu.symo will fail to find mach/message.h"
                    fi
                    [ -f Makefile ] || { echo "  running configure"; sh ./configure 2>&1 | tail -25; }
                    # cpu.symo is built by an IMPLICIT builtin rule
                    # ("gcc -S -ffreestanding -x c"), which expands neither
                    # $(CC) nor $(CFLAGS) from the environment. Measured in
                    # run 40410234795: the command line was
                    #     /usr/bin/gcc -S   -ffreestanding -x c -o cpu.symo cpu.symc
                    # with the include absent even though CFLAGS carried it.
                    # So pass the include on the MAKE command line, which
                    # overrides the builtin rule's recipe variables.
                    # The .symc.symo suffix rule uses TARGET_CC /
                    # TARGET_CPPFLAGS / TARGET_CFLAGS, NOT CC / CPPFLAGS /
                    # CFLAGS. Makefile.am:29-30:
                    #     .symc.symo:
                    #         $(TARGET_CC) -S $(TARGET_CPPFLAGS) $(TARGET_CFLAGS) \
                    #             -ffreestanding -x c -o $@ $<
                    # That is exactly the hardcoded-looking line measured in
                    # runs 40410234795 and 40410664860, where CFLAGS on the
                    # make command line demonstrably had no effect.
                    make -j"$(nproc)" migcom \
                      CC="$HOSTCC" CFLAGS="-O1 -w" \
                      TARGET_CC="$HOSTCC" \
                      TARGET_CPPFLAGS="-DKERNEL -I$XNUMACH -I$GITHUB_WORKSPACE/dxb/xnu/bsd -I$GITHUB_WORKSPACE/dxb/xnu/EXTERNAL_HEADERS" \
                      TARGET_CFLAGS="-O1 -w" 2>&1 | tail -45
                    exit "${PIPESTATUS[0]}"
                  )
                  MIGMAKE_RC=$?
                  set -e
                  echo "  make migcom rc=$MIGMAKE_RC"
                  if [ "$MIGMAKE_RC" -eq 0 ]; then
                    NEWMIG="$(find "$MIGTOP" -maxdepth 2 -type f -name migcom -perm -u+x | head -1)"
                    if [ -n "$NEWMIG" ]; then
                      cp "$NEWMIG" "$MIGPKG/usr/lib/mig/x86_64-gnu-migcom-patched"
                      chmod +x "$MIGPKG/usr/lib/mig/x86_64-gnu-migcom-patched"
                      # Control: the patched binary must still parse a valid
                      # stream and still know natural_t (never silently broken).
                      printf 'subsystem\nKernelUser\nvprobe 1000;\ntype natural_t = uint32_t;\n' \
                        > "$MIGSRC/ctl.defs"
                      if "$MIGPKG/usr/lib/mig/x86_64-gnu-migcom-patched" -header /dev/null \
                           < "$MIGSRC/ctl.defs" 2>&1 | tee "$MIGSRC/ctl.err"; then
                        echo "  PATCHED migcom: control stream parsed, exit 0"
                      else
                        echo "  PATCHED migcom: control stream FAILED (see above)"
                      fi
                      if grep -q 'natural_t' "$MIGSRC/ctl.err"; then
                        echo "  PATCHED migcom: control does NOT define natural_t (expected for a fresh .defs)"
                      fi
                      cp "$MIGPKG/usr/lib/mig/x86_64-gnu-migcom-patched" \
                         "$MIGPKG/usr/lib/mig/x86_64-gnu-migcom"
                      echo "  USING PATCHED migcom (duplicate TypeDecl is now a warning)"
                      # Two-sided control: the patch must not have silenced the
                      # check. Feed a stream with a REAL duplicate and require
                      # the new wording to appear.
                      printf 'subsystem\nKernelUser\nvprobe 1000;\ntype dupe_t = int;\ntype dupe_t = int;\n' \
                        > "$MIGSRC/dupe.defs"
                      "$MIGPKG/usr/lib/mig/x86_64-gnu-migcom" -header /dev/null \
                        < "$MIGSRC/dupe.defs" 2>&1 | head -20 \
                        | grep -E 'TOLERATED duplicate|overriding previous' \
                        || echo "  ::warning::control: real duplicate produced NO diagnostic"
                    else
                      echo "  ::warning::patched build produced no migcom; keeping Debian binary"
                    fi
                  else
                    echo "  ::warning::patched migcom failed to build; keeping Debian binary"
                  fi
                fi
              else
                echo "  ::warning::parser.y not found in tarball; keeping Debian binary"
              fi
            else
              echo "  ::warning::could not download mig source; keeping Debian binary"
            fi
            set -e


            MIG_SH_BIN="$MIGPKG/usr/bin/x86_64-gnu-mig"
            ls -la "$MIG_SH_BIN" "$MIGCOM_BIN" 2>&1 || true
            file "$MIGCOM_BIN" 2>/dev/null || true
            if [ -x "$MIGCOM_BIN" ]; then
              cp "$MIGCOM_BIN" "$RUNNER_TEMP/cross/bin/migcom-debian"
              chmod +x "$RUNNER_TEMP/cross/bin/migcom-debian"
              # Swap it in, keeping the source-built one for comparison.
              if [ -x "$RUNNER_TEMP/cross/bin/migcom" ]; then
                mv "$RUNNER_TEMP/cross/bin/migcom" "$RUNNER_TEMP/cross/bin/migcom-apple-src" || true
              fi
              # cross/bin/migcom becomes a FILTER, not the raw binary.
              #
              # mig.sh forwards Apple-only switches straight to migcom
              # (mig.sh:118-124 put them in migflags). GNU migcom rejects them
              # outright -- run 40391072037 measured:
              #     -maxonstack 1024: mig: fatal: unknown flag: '-maxonstack'
              #     -mach_msg2:       mig: fatal: unknown flag: '-mach_msg2'
              # and -novouchers is in the same class: it is Apple's, and it is
              # what MakeInc.def:895 puts in MIGFLAGS unconditionally, so the
              # real kernel build always passes it:
              #     MIGFLAGS = $(DEFINES) $(INCFLAGS) -novouchers ...
              # Debian's own migcom accepts only
              #     -header -user -server -sheader -iheader -list -prefix
              #     -subrprefix
              # (Debian mig(1) manpage).
              #
              # Dropping these changes NOTHING the kernel build consumes:
              #   -novouchers   voucher fields in generated RPC stubs; xnu's
              #                 mach headers here carry no voucher support that
              #                 mig would act on for this config, and the flag
              #                 only suppresses emission GNU mig never does.
              #   -mach_msg2    Mach msg2 packing; xnu 8796 SWEET does not use
              #                 msg2 for these subsystems.
              #   -maxonstack   server-side stack hints, in server code this
              #                 profile does not compile (-server /dev/null).
              # Each drop is ECHOED once, so this is never silent.
            # The shim is a CHECKED-IN FILE, not generated here.
            # Generating an awk program through a YAML block scalar meant two
            # layers of quoting and produced invalid bash three times tonight.
            # shim/migcom-shim.sh is the single source of truth; only the real
            # binary path is substituted, so nothing inside it needs escaping.
            MIGSHIM="$RUNNER_TEMP/cross/bin/migcom"
            cp "$GITHUB_WORKSPACE/shim/migcom-shim.sh" "$MIGSHIM"
            sed -i "s|__MIGCOM_REAL__|$RUNNER_TEMP/cross/bin/migcom-debian|" "$MIGSHIM"
            chmod +x "$MIGSHIM"
            if bash -n "$MIGSHIM"; then
              echo "  shim: syntax OK ($MIGSHIM)"
            else
              echo "::error::migcom shim has a bash syntax error"
            fi
            if grep -q "__MIGCOM_REAL__" "$MIGSHIM"; then
              echo "::error::shim still contains the __MIGCOM_REAL__ placeholder"
            fi
            # RE-POINT cross/libexec/migcom. It was symlinked earlier, when
            # cross/bin/migcom was still the source-built binary; line 2345
            # then `mv`d that aside and line 2379 recreated cross/bin/migcom
            # as the FILTER. A symlink to a moved file is DANGLING, and
            # mig.sh:68 resolves migcomPath to exactly this path. That is the
            # whole cause of
            #     cross/bin/mig: line 183: cross/bin/migcom: No such file or directory
            # in run 40401122633. Recreate it now, after both moves.
            mkdir -p "$RUNNER_TEMP/cross/libexec"
            ln -sfn "$MIGSHIM" "$RUNNER_TEMP/cross/libexec/migcom"
            if [ -x "$RUNNER_TEMP/cross/libexec/migcom" ]; then
              echo "  INSTALL: cross/libexec/migcom -> cross/bin/migcom (mig.sh:68 default) OK"
            else
              echo "::error::cross/libexec/migcom still not executable -- mig.sh will not find migcom"
            fi
            echo "  INSTALL: migcom in place at cross/bin/migcom (drop-flags + hoist-subsystem shim)"
            echo "  INSTALL: raw binary at cross/bin/migcom-debian"
            else
              echo "::error::INSTALL: prebuilt migcom missing after extraction"
              find "$MIGPKG" -maxdepth 4 | head -30
            fi
          else
            echo "::error::INSTALL: could not download $MIG_DEB_URL"
          fi

          # ===============================================================
          # FLAGS: which Apple-mig options does Hurd migcom accept?
          # Verdict per flag, no blind stripping.
          # ===============================================================
          # TREE CENSUS
          #
          # Before diagnosing include resolution, prove the include SOURCE
          # exists. Tonight every wrong answer came from asserting a path
          # from a name instead of listing it: lockd.defs, task.defs, the
          # .defs/.h oracle, x86_64-linux-gnu-ar, ld64, mig -- six of them.
          # A one-line census settles it.
          # ===============================================================
          XNUTREE="$GITHUB_WORKSPACE/dxb/xnu"
          echo "=== TREE CENSUS ==="
          echo "  .defs files in tree : $(find "$XNUTREE" -name '*.defs' 2>/dev/null | wc -l) (Apple tag xnu-8796.121.2 has 82)"
          echo "  osfmk/mach/*.defs   : $(ls "$XNUTREE"/osfmk/mach/*.defs 2>/dev/null | wc -l) files"
          echo "  --- first 20 in osfmk/mach ---"
          ls "$XNUTREE"/osfmk/mach/*.defs 2>/dev/null | sed "s|.*/||" | head -20
          for want in std_types.defs mach_types.defs port.defs; do
            if [ -f "$XNUTREE/osfmk/mach/$want" ]; then
              echo "  PRESENT: osfmk/mach/$want"
            else
              echo "  ABSENT : osfmk/mach/$want  <-- include source missing"
            fi
          done

          # ===============================================================
          # FLAGS -- recorded fact, not a live probe.
          #
          # Run 40388982459 measured, with the Debian prebuilt migcom:
          #     -maxonstack 1024 : REJECTED, exit 1,
          #                        "mig: fatal: unknown flag: '-maxonstack'"
          # That verdict is unambiguous because the failure text names the
          # FLAG. The other three rows (-novouchers, -mach_msg2, baseline)
          # all failed with "bad argument: <path>", which is the probe's
          # own .defs input being rejected -- not a verdict about the flag.
          # They were INCONCLUSIVE even after the grammar was corrected
          # from the Debian source tests (subsystem KernelUser user 100;),
          # so the probe is DELETED rather than repaired: a probe that
          # cannot produce a verdict manufactures rows that read as data.
          # Consequence, already applied: -maxonstack is not passed.
          # ===============================================================
          echo "=== FLAGS (recorded, not probed) ==="
          echo "  -maxonstack 1024: REJECTED (exit 1, unknown flag) -- not passed"
          # These two were defined in the deleted probe block. Removing the
          # probe silently unset them: run 40390467722 then ran
          # `gen_and_compile lockd "" lockd_mach` and `wd="/task"` ->
          # "mkdir: cannot create directory '/task': Permission denied".
          # Define them here, and ASSERT them, so deleting a neighbour can
          # never silently leave them empty again.
          ACCT="$RUNNER_TEMP/acct"; rm -rf "$ACCT"; mkdir -p "$ACCT"
          LOCKD_DEFS="$XNUTREE/osfmk/lockd/lockd_mach.defs"
          for v in ACCT LOCKD_DEFS; do
            eval "val=\$$v"
            if [ -z "$val" ]; then echo "::error::$v is EMPTY -- would silently skip work"; fi
          done
          echo "  ACCT=$ACCT"
          echo "  LOCKD_DEFS=$LOCKD_DEFS"

          # ===============================================================
          # LOCKD + TASK: generate real headers and COMPILE them.
          #
          # There is NO oracle to diff against: xnu ships zero
          # mig-generated headers. All 82 .defs were checked; none of the
          # five same-named .h files carries mig's /* Module */ banner --
          # they are hand-written parallel specs, not generator output.
          #
          # So the check is structural: a header that compiles against
          # xnu's own mach/message.h, mach/port.h and kern_return.h has the
          # right wire layout, because the compiler checks the LAYOUT and
          # not a comment. A wrong mach_msg_type_t ordering, field width or
          # __MACH30__ handling cannot pass this.
          # ===============================================================
          gen_and_compile() {
            glabel="$1"; gdefs="$2"; gbase="$3"; shift 3
            echo "--- $glabel: $gdefs ---"
            if [ ! -f "$gdefs" ]; then
              echo "  MISSING: $gdefs"; return 0
            fi
            wd="$ACCT/$glabel"; mkdir -p "$wd"
            # NOTE on -I: it is a CPP flag, not a migcom option. mig.sh
            # already passes `-I "${sourcedir}"` to the preprocessor
            # (mig.sh:180,183) and routes any unrecognised -* into
            # cppflags (mig.sh:129), so include paths must go to mig,
            # never to migcom. Verified: the Debian binary's option set is
            # -header -iheader -user -server -sheader -list -prefix
            # -subrprefix, with no -I.
            # KERNEL SWITCHES. Run 40389783165 produced a valid 11-line
            # task.h with the /* Module task */ banner and ZERO routines,
            # while Apple's task.defs is 15410 bytes of routine bodies. The
            # most likely gate is the preprocessor: if the routines sit
            # behind #ifdef KERNEL_PRIVATE / __APPLE_API_UNSTABLE / arch
            # macros, cpp removes them before migcom ever sees them. These
            # are added so the routines are visible; the declared-vs-emitted
            # count below is what tells us whether that worked.
            # THE GATE, FOUND BY COUNTING. Run 40391072037: task.defs
            # declares 59 `routine` directives; task.h emitted 0. The guard
            # listing printed alongside showed every one of them behind
            #     #if KERNEL_SERVER  /  #ifdef KERNEL_SERVER  /  #if !KERNEL
            # KERNEL_SERVER was never defined. Not KERNEL_PRIVATE, not
            # __APPLE_API_UNSTABLE, not the arch macros -- KERNEL_SERVER.
            # It also selects the SERVERPAIRS/IsaKernelServer branches that
            # decide which generated files migcom produces.
            KSW="-DKERNEL=1 -DKERNEL_PRIVATE=1 -DKERNEL_SERVER=1 -D__APPLE_API_UNSTABLE=1 -DPRIVATE=1 -DARCH_arm64=1 -DARM64=1"
          # NOTE: -D_MACH_MACHINE_MACHNINE_TYPES_DEFS=1 was here and was
          # REMOVED. It makes the #ifndef at machine_types.defs:36 false on the
          # FIRST include, so the ENTIRE file body is skipped -- taking
          # natural_t, integer_t, short, int, unsigned, float, double,
          # uintptr_t, intptr_t, register_t and all vm_* types with it.
          # std_types.defs:108-120 immediately reference natural_t, so migcom
          # then aborted with a divide-by-zero on undefined types
          # ('15759 Floating point exception'). It suppressed the duplicate
          # declarations by suppressing the declarations. Duplicates are
          # handled by the provenance dump below instead, which reports
          # file:line so the real double include can be identified.
            # INCLUDE PATHS. A .defs is #include-ed by a driver of its own:
            #     lockd_mach.defs:30  #include <mach/std_types.defs>
            #     lockd_mach.defs:31  #include <mach/mach_types.defs>
            # The real kernel build passes these through INCFLAGS, which
            # MakeInc.def:895 folds into MIGFLAGS. The probe passed none, so
            # run 40391072037 reported
            #     lockd_mach.defs:30:10: fatal error: mach/std_types.defs:
            #     No such file or directory
            # and then, because mig.sh ran the preprocessor separately to dump
            # its output, a misleading "PREPROCESSED: exit 0, 0 lines". The
            # include failure is the real cause; the 0 lines was a second,
            # silent run through our shim without the paths.
            # `-I` goes to mig, never to migcom: it is a CPP flag, and mig.sh
            # routes unrecognised -* into cppflags (mig.sh:129).
            GINCS="-I$XNUTREE/osfmk -I$XNUTREE/bsd -I$XNUTREE/osfmk/mach -I$XNUTREE/iokit"
            printf '  declared `routine` directives in %s: %s\n' \
              "$(basename "$gdefs")" \
              "$(grep -cE '^[[:space:]]*routine[[:space:]]|^[[:space:]]*simpleroutine[[:space:]]' "$gdefs" 2>/dev/null || echo 0)"
            echo "  --- preprocessor guards in $(basename "$gdefs") (first 12) ---"
            grep -nE '^[[:space:]]*#if' "$gdefs" 2>/dev/null | head -12 || echo "    (none)"
            MIGCC="$RUNNER_TEMP/cross/bin/migcc-shim" \
               MIGCOM="$RUNNER_TEMP/cross/bin/migcom" \
               "$RUNNER_TEMP/cross/bin/mig" \
                 -D__MACH30__ -DMACH_KERNEL_PRIVATE -DKERNEL_USER=1 $KSW $GINCS "$@" \
                 -user "$wd/$gbase.c" -header "$wd/$gbase.h" \
                 -server /dev/null -sheader /dev/null \
                 "$gdefs" 2>"$wd/mig.err" || mig_rc=$?
            # CAPTURE THE NUMERIC EXIT CODE without tripping `set -e`.
            # The old `if mig ...; then` form discarded the status, so run
            # 40396010350 reported "MIG EXIT: nonzero" with an EMPTY message
            # and we could not say whether it was 1, 2, or a signal. Running
            # mig as a BARE command then made `set -e` abort the whole step on
            # any nonzero exit (run 40397229850 died at the first lockd call
            # with no diagnostics at all) because these steps run under
            # `set -e`. `|| mig_rc=$?` satisfies both: the command is not the
            # last of a list so `set -e` does not fire, and the status is kept.
            mig_rc=${mig_rc:-0}
            echo "  MIG EXIT: $mig_rc"
            # Print the lines that MATTER, not the first N. Run 40394250479
            # lost a whole cycle because head -3 returned three "overriding
            # previous definition" WARNINGS while the fatal error sat four
            # lines further down. Filter, then cap; never truncate blind.
            if [ "$mig_rc" -ne 0 ]; then
              echo "  --- mig.err: fatal/not-defined lines ---"
              grep -iE 'fatal|not defined|syntax|error|cannot|undefined|unknown' \
                "$wd/mig.err" 2>/dev/null | head -12 || true
              echo "  --- mig.err total lines: $(wc -l < "$wd/mig.err" 2>/dev/null || echo 0) ---"
            fi
            if [ ! -s "$wd/$gbase.h" ]; then
              echo "  $gbase.h: NOT PRODUCED (empty or absent)"
              echo "  --- mig.err: last 15 lines ---"
              tail -15 "$wd/mig.err" 2>/dev/null || true
              # Which files DID appear: migcom may write some outputs and
              # not others, and which ones tells us where it stopped.
              echo "  --- files mig produced in $wd ---"
              ls -la "$wd" 2>/dev/null | head -20 || true
              # Was migcom fed garbage, or did it reject real input? Reproduce
              # the preprocess step mig.sh would have run and show what migcom
              # actually received. This settles "no SubSystem declaration"
              # (symptom of empty input) versus a genuine .defs problem,
              # instead of theorising about a file we cannot read locally.
              MIGCC="$RUNNER_TEMP/cross/bin/migcc-shim"
              pp="$wd/preprocessed.c"
              # The exact command line mig runs, captured from set -x in the
              # log above; echo it here so the include path question is
              # answered by the real invocation rather than by assumption.
              echo "  CPP CMDLINE (reconstructed, mig.sh:183 passes -arch which the shim strips):"
              echo "    migcc-shim -E -arch <arm64> -D__MACH30__ -DMACH_KERNEL_PRIVATE -DKERNEL_USER=1 $KSW -I <defsdir> <args> <defs>"
              echo "  mig.sh adds -I \"\${sourcedir}\" itself at line 180/183; extra -I args travel via cppflags."
              if "$MIGCC" -E -D__MACH30__ -DMACH_KERNEL_PRIVATE -DKERNEL_USER=1 \
                   -I "$(dirname "$gdefs")" -I "$GITHUB_WORKSPACE/dxb/xnu/osfmk" \
                   -I "$GITHUB_WORKSPACE/dxb/xnu/EXTERNAL_HEADERS" -I "$MIGPKG" \
                   "$gdefs" > "$pp" 2>"$wd/pp.err"; then
                echo "  PREPROCESSED: exit 0, $(wc -l < "$pp") lines"
                echo "  --- first 30 lines of preprocessed $gbase ---"
                head -30 "$pp"
                echo "  --- SubSystem/ServerSubsystem lines in preprocessed ---"
                grep -n -E '^[A-Za-z_]*[Ss]ubsystem|^SubSystem' "$pp" | head -5 || echo "    (none)"
              else
                echo "  PREPROCESSED: FAILED exit $?"
                head -8 "$wd/pp.err"
                echo "  --- preprocessed captures: $( [ -s "$pp" ] && wc -l < "$pp" || echo 0 ) lines ---"
                head -30 "$pp" 2>/dev/null
              fi
              return 0
            fi
            echo "  $gbase.h: $(wc -l < "$wd/$gbase.h") lines"
            echo "  OutBuf[0] occurrences: $(grep -c 'OutBuf\[0\]' "$wd/$gbase.h" || true)"
            # DECLARED vs EMITTED: the honest measure, needing no oracle.
            # A header that compiles but carries no thunks proves only that
            # migcom accepts the file; it says nothing about translation.
            EMIT=$(grep -cE '^kern_return_t[[:space:]]+[a-zA-Z_]+[[:space:]]*\(' "$wd/$gbase.h" 2>/dev/null || echo 0)
            echo "  routines emitted ($gbase.h defines): $EMIT"
            if [ "$EMIT" -gt 0 ]; then
              echo "  TRANSLATION: routines present -- mig translated routine bodies"
            else
              echo "  TRANSLATION: no routines emitted -- compiles, but proves nothing about routine translation"
            fi
            echo "  --- first 26 lines ---"
            head -26 "$wd/$gbase.h"
            if clang -fsyntax-only -x c -std=gnu99 -D__MACH30__ -DKERNEL -DPRIVATE \
                 -DMACH_KERNEL_PRIVATE -DKERNEL_USER=1 \
                 -I"$wd" \
                 -I"$GITHUB_WORKSPACE/dxb/xnu/osfmk" \
                 -I"$GITHUB_WORKSPACE/dxb/xnu/osfmk/machine" \
                 -I"$GITHUB_WORKSPACE/dxb/xnu/bsd" \
                 -I"$GITHUB_WORKSPACE/dxb/xnu/bsd/sys" \
                 -I"$GITHUB_WORKSPACE/dxb/xnu/libkern" \
                 -I"$GITHUB_WORKSPACE/dxb/xnu/EXTERNAL_HEADERS" \
                 -I"$CCTOOLS_FOREIGN_INCLUDE" \
                 "$wd/$gbase.h" 2>"$wd/cc.err"; then
              echo "  RESULT: $gbase.h COMPILES against xnu headers"
            else
              echo "  RESULT: $gbase.h did not compile"
              head -14 "$wd/cc.err"
            fi
          }
          # -maxonstack is NOT passed: run 40388982459 proved Hurd migcom
          # rejects it outright ("mig: fatal: unknown flag: '-maxonstack'").
          # One named flag, one stated reason, per the no-blind-stripping rule.
          gen_and_compile lockd "$LOCKD_DEFS" lockd_mach
          # CONTROL: a .defs that MUST emit routines. Without it, "0
          # routines emitted" cannot distinguish "our invocation is broken"
          # from "task.defs is gated". This is Debian mig's own passing
          # fixture (tests/good/routine.defs), reduced to what it needs.
          # Written with printf, not heredocs: a heredoc body at column 0
          # terminates the YAML block scalar and breaks the workflow.
          CTL="$ACCT/ctl"; mkdir -p "$CTL"
          { echo 'type int64_t = MACH_MSG_TYPE_INTEGER_64;'
            echo 'type int32_t = MACH_MSG_TYPE_INTEGER_32;'
            echo 'type mach_port_t = MACH_MSG_TYPE_COPY_SEND;'
          } > "$CTL/base_types.defs"
          { echo 'subsystem myroutine 100;'
            echo '#include "base_types.defs"'
            echo 'routine factorial(port : mach_port_t; n : int64_t; out result : int64_t);'
            echo 'simpleroutine simple_factorial(port : mach_port_t; n : int64_t);'
          } > "$CTL/control.defs"
          echo "--- CONTROL: known-good fixture (expect 2 routines) ---"
          # Hurd migcom reads the .defs from STDIN, exactly as mig.sh feeds
          # it (mig.sh:183 pipes cpp output into "$M"). Passing the file as a
          # trailing argument is what produced "bad argument: '<path>'" for
          # every direct migcom call tonight -- including all three rows of
          # the FLAGS probe I deleted, which is why they were uninterpretable.
          if "$RUNNER_TEMP/cross/bin/migcom" -user "$CTL/control.c" -header "$CTL/control.h" \
               -server /dev/null -sheader /dev/null < "$CTL/control.defs" 2>"$CTL/err"; then
            echo "  CONTROL MIG EXIT: 0"
            echo "  control.h: $(wc -l < "$CTL/control.h" 2>/dev/null || echo 0) lines"
            echo "  routines emitted: $(grep -cE '^kern_return_t[[:space:]]+[a-zA-Z_]+[[:space:]]*\(' "$CTL/control.h" 2>/dev/null || echo 0)"
            head -20 "$CTL/control.h" 2>/dev/null || true
          else
            echo "  CONTROL MIG EXIT: nonzero -- $(grep -iE 'fatal|not defined|syntax|error' "$CTL/err" | head -5 | tr '\n' ' ')"
          fi
          gen_and_compile task "$GITHUB_WORKSPACE/dxb/xnu/osfmk/mach/task.defs" task
          echo "=== END ACCEPTANCE ==="

      # ------------------------------------- stage 5b: SETUP host tools
      # kextsymboltool / setsegname / installfile need Apple's compat.h
      # (setmode, getmode, fcopyfile, getprogname) and <mach/mach_init.h>,
      # <mach-o/swap.h>. Build them here against our libc shim plus
      # cctools-port's Mach-O headers, then preinstall them so SETUP/'s own
      # makefiles find them newer than their sources.
      - name: "Stage 5b: prebuild SETUP host tools (kextsymboltool, setsegname, installfile)"
        id: setuptools
        continue-on-error: true
        run: |
          set -x
          XROOT="$GITHUB_WORKSPACE/dxb/xnu"
          OBJROOT="$GITHUB_WORKSPACE/dxb/build/xnu.obj"
          CCT="$GITHUB_WORKSPACE/cctools-port/cctools"
          # SINGLE SOURCE OF TRUTH for the SETUP tool set, defined BEFORE any
          # loop reads it. There used to be three hardcoded copies of
          # (nearly) this list in this step and none of them contained
          # `decomment`, so Stage 6 failed with
          #     clang: error: no such file or directory: 'decomment'
          # which reads like a missing binary but actually meant we never
          # asked for it to be built. Three copies of one list is the
          # defect; fixing one copy would have left two live.
          # xnu ships SEVEN SETUP dirs; json_compilation_db is excluded
          # because it is a developer convenience, not a build input.
          SETUP_DIRS="config decomment kextsymboltool setsegname installfile replacecontents"
          mkdir -p "$OBJROOT/SETUP/kextsymboltool" "$OBJROOT/SETUP/setsegname" \
                   "$OBJROOT/SETUP/installfile"

          # The compat shim is created once, in stage 1b, and is already
          # installed to /usr/local/include/compat.h and
          # /usr/local/lib/libbsdcompat.a. Do not define it a second time here:
          # an earlier version of this step rewrote compat.h with a variant
          # based on `#define getprogname() program_invocation_short_name`,
          # which clobbered the good header and is what produced
          # "use of undeclared identifier 'program_invocation_short_name'"
          # from /usr/local/include/libc.h.

          # cctools-port carries the Mach-O host headers (<mach-o/swap.h>,
          # <mach/mach_init.h>) that Apple's SDK would otherwise provide.
          MACHD_INC=$(dirname "$(dirname "$(dirname "$(find "$CCT" -name swap.h -path '*mach-o*' | head -1)")")")
          echo "mach-o headers: $MACHD_INC"
          test -d "$MACHD_INC/mach-o" || echo "WARNING: $MACHD_INC/mach-o missing"
          test -d "$MACHD_INC/mach"   || echo "WARNING: $MACHD_INC/mach missing"
          # cctools ships mach-o/ and architecture/ but not Apple's mach/.
          # kextsymboltool only wants mach_task_self() to key a buffer on the
          # current task, which never leaves the process on Linux, so a trivial
          # identity plus the two typedefs satisfy it.
          if [ ! -d "$MACHD_INC/mach" ]; then
            mkdir -p "$MACHD_INC/mach"
            cat > "$MACHD_INC/mach/mach_types.h" <<'MACHEOF'
          #ifndef _HOST_MACH_MACH_TYPES_H
          #define _HOST_MACH_MACH_TYPES_H
          #include <stdint.h>
          typedef uint32_t mach_port_t;
          typedef int kern_return_t;
          #define KERN_SUCCESS 0
          #define MACH_PORT_NULL ((mach_port_t)0)
          #endif
          MACHEOF
            cat > "$MACHD_INC/mach/mach_init.h" <<'MACHEOF'
          #ifndef _HOST_MACH_MACH_INIT_H
          #define _HOST_MACH_MACH_INIT_H
          #include <mach/mach_types.h>
          #define mach_task_self() ((mach_port_t)1)
          #endif
          MACHEOF
            echo "created minimal mach/ headers under $MACHD_INC"
          fi
          CFLAGS="-isysroot / -g -O0 -isystem $CCTOOLS_FOREIGN_INCLUDE -I/usr/local/include -I$MACHD_INC -I$XROOT/EXTERNAL_HEADERS"
          CFLAGS="$CFLAGS -include /usr/local/include/compat.h"
          # kextsymboltool needs symbols that only cctools provides:
          #   NXGetLocalArchInfo            libmacho/arch.c
          #   swap_mach_header_64,          libstuff/bytesex.c
          #   swap_segment_command_64,
          #   swap_uuid_command, swap_nlist(_64), ...
          #   uuid_generate                 libutil
          # Ubuntu lacks the first two entirely, and both libraries are
          # noinst_LTLIBRARIES, so `make install` never installs them:
          #   undefined reference to `NXGetLocalArchInfo'
          #   undefined reference to `swap_mach_header_64'
          #   undefined reference to `uuid_generate'
          # (run 40377291091). Stage 1's build tree still has them, so link
          # straight against it. Prefer the .a, fall back to .la, and report
          # a missing archive loudly rather than letting the link fail
          # cryptically later.
          # xnu's SETUP Makefiles hard-assign LDFLAGS with `=`, e.g.
          #   SETUP/kextsymboltool/Makefile:15
          #   LDFLAGS = -isysroot $(HOST_SDKROOT) -mmacosx-version-min=...
          # A plain `=` in the makefile wins over a command-line variable
          # unless it is `override`, so passing LDFLAGS on the make command
          # line does nothing for these recipes -- confirmed by runs
          # 40378282825 and 40379258308, where the kextsymboltool link still
          # used only -L/usr/local/lib -lbsdcompat. Append $(LDFLAGS_EXTRA)
          # instead, which the make command line does set.
          for d in $SETUP_DIRS; do
            mf="$GITHUB_WORKSPACE/dxb/xnu/SETUP/$d/Makefile"
            [ -f "$mf" ] || continue
            if grep -q 'LDFLAGS_EXTRA' "$mf"; then
              echo "SETUP/$d: already references LDFLAGS_EXTRA"
            else
              sed -i.bak -E 's/^(LDFLAGS[[:space:]]*=.*)$/\1 $(LDFLAGS_EXTRA)/' "$mf"
              if grep -q 'LDFLAGS_EXTRA' "$mf"; then
                echo "SETUP/$d: $(grep -E '^LDFLAGS[[:space:]]*=' "$mf" | head -1)"
              else
                echo "::warning::SETUP/$d: could not append LDFLAGS_EXTRA"
              fi
            fi
          done

          CT_ROOT="$GITHUB_WORKSPACE/cctools-port/cctools"
          CT_ARCHIVES=""
          CT_LIBS=""
          for lib in macho stuff; do
            stage="$CT_ROOT/lib$lib/.libs/lib$lib.a"
            if [ -f "$stage" ]; then
              mkdir -p "$RUNNER_TEMP/cross/lib"
              cp -f "$stage" "$RUNNER_TEMP/cross/lib/"
              CT_ARCHIVES="$RUNNER_TEMP/cross/lib"
              CT_LIBS="$CT_LIBS -l$lib"
              echo "cctools archive: lib$lib.a (staged)"
              # Decide the ARCHIVE FORMAT, not just symbol presence. cctools is
              # configured with an emulated Macintosh host CPU, so its static
              # libraries can come out as Mach-O rather than ELF. GNU ld skips
              # a Mach-O member WITHOUT any diagnostic: it reads the archive
              # index, finds nothing it understands, and then blames the
              # consumer's symbols. That matches what runs 40378282825 /
              # 40379258308 / 40380273397 show -- -lmacho -lstuff was on the
              # link line and nm found the symbols inside the .a, yet the
              # linker still reported
              #     undefined reference to `NXGetLocalArchInfo'
              echo "--- $stage format ---"
              file "$stage" 2>/dev/null || true
              member=$(/usr/bin/ar t "$stage" 2>/dev/null | head -1)
              if [ -n "$member" ]; then
                tmpd=$(mktemp -d)
                ( cd "$tmpd" && /usr/bin/ar x "$stage" "$member" >/dev/null 2>&1 \
                  && echo "member $member:" && file "$member" ) || true
                rm -rf "$tmpd"
              fi
            else
              echo "::warning::lib$lib.a not found at $stage"
            fi
          done
          CT_LIBS="$CT_LIBS -luuid"
          echo "cctools link dir: ${CT_ARCHIVES:-<none>}  libs: $CT_LIBS"
          ls -la "$CT_ARCHIVES" 2>/dev/null || true
          # Prove the two decisive symbols are actually present.
          for sym in NXGetLocalArchInfo swap_mach_header_64; do
            if [ -n "$CT_ARCHIVES" ] && \
               /usr/bin/nm -g --defined-only "$CT_ARCHIVES"/lib*.a 2>/dev/null \
                 | grep -qw "$sym"; then
              echo "  $sym: FOUND"
            else
              echo "::error::cctools archive does not define $sym"
            fi
          done
          # Final, decisive probe: the question is not whether the symbol is
          # in the archive (nm says yes) but whether the ELF linker can USE
          # it. This link either succeeds or prints exactly why it cannot.
          if [ -n "$CT_ARCHIVES" ]; then
            probe=$(mktemp -d)
            printf 'extern void swap_mach_header_64(void);\nint main(void){swap_mach_header_64();return 0;}\n' \
              > "$probe/p.c"
            if clang -o "$probe/p" "$probe/p.c" -L"$CT_ARCHIVES" -lstuff 2>"$probe/err"; then
              echo "LINK PROBE: libstuff.a IS usable by the ELF linker"
            else
              echo "::error::LINK PROBE FAILED -- libstuff.a cannot satisfy an ELF link"
              cat "$probe/err"
              echo "--- this is the real reason kextsymboltool cannot link ---"
            fi
            rm -rf "$probe"
          fi

          setup_failed=""
          # Single source of truth for the SETUP denominator. It was
          # hardcoded as five in two loops and in several comments, while
          # xnu actually ships SEVEN SETUP dirs:
          #     config decomment installfile json_compilation_db
          #     kextsymboltool replacecontents setsegname
          # decomment was named in five comments but absent from the build
          # list, so "4 of 5 SETUP tools built" was reported for many runs
          # while decomment had never been attempted at all -- and it is
          # the FIRST thing Stage 6 fails on:
          #     clang: error: no such file or directory: 'decomment'
          #     MakeInc.top:389: build_setup_bootstrap_... Error 2
          # Never report "N of M" again without printing the list behind M.
          echo "SETUP tools attempted ($(echo $SETUP_DIRS | wc -w)): $SETUP_DIRS"
          for d in $SETUP_DIRS; do
            echo "== SETUP/$d"
            # Create the output dir HERE, per subdir. The earlier version
            # mkdir'd only three of the five once, so `config` and
            # `replacecontents` failed with
            #     error: unable to open output file
            #     '.../xnu.obj/SETUP/config/externs.o': 'No such file or directory'
            # for every translation unit. A missing mkdir looked like a
            # mysterious compile failure.
            mkdir -p "$OBJROOT/SETUP/$d"
            ok=1
            # SETUP/config is partly generated. Its Makefile says
            #     parser.c: parser.y
            #         $(HOST_BISON) -y -d -d -o $@ $<
            #     lexer.yy.c: lexer.l
            #         env M4=$(HOST_GM4) $(HOST_FLEX) --header-file=... -o $@ $<
            # and nothing has run bison/flex here, so main.c failed with
            #     main.c:63:10: fatal error: 'parser.h' file not found
            # (run 40381388491). Generate the two files in place, in the
            # source dir, because main.c includes "parser.h" directly.
            if [ "$d" = config ]; then
              # The Makefile's flex rule is
              #     env M4=$(HOST_GM4) $(HOST_FLEX) --header-file=... -o $@ $<
              # We call flex directly with --header-file, which bypasses that
              # rule and so does not depend on HOST_GM4 being set in this
              # subshell. Print where m4 lives anyway, so that if flex
              # misbehaves we can rule m4 out instead of guessing at it.
              echo "  m4: $(command -v m4 || echo 'NOT FOUND')  gm4: $(command -v gm4 || echo 'absent')"
              echo "  bison: $(command -v bison || echo 'NOT FOUND')  flex: $(command -v flex || echo 'NOT FOUND')"
              ( cd "$XROOT/SETUP/config" \
                && bison -y -d -d -o parser.c parser.y \
                && flex --header-file=lexer.yy.h -o lexer.yy.c lexer.l ) \
                || { echo "::error::SETUP/config: bison/flex generation failed"; ok=0; setup_failed="$setup_failed config(generate)"; }
              ls -la "$XROOT/SETUP/config/parser.h" \
                     "$XROOT/SETUP/config/parser.c" \
                     "$XROOT/SETUP/config/lexer.yy.c" 2>/dev/null \
                || { echo "::error::SETUP/config: generated files missing"; ok=0; }
            fi
            # Each SETUP subdir is compiled from inside its own directory and
            # may include a header that lives beside it. SETUP/config does
            #     externs.c:26:10: error: 'config.h' file not found with
            #         <angled> include; use "quotes" instead
            # so put the subdir itself on the include path.
            #
            # SETUP/config/Makefile also carries a subdir-specific flag:
            #     CFLAGS += -DYY_NO_INPUT
            # which omits the flex input()/yyunput() fallback path that
            # references a `yyinput` prototype bison's skeleton does not
            # provide. Without it lexer.yy.c fails to link. It is scoped to
            # config so the other tools keep their original flags.
            d_cflags="$CFLAGS"
            if [ "$d" = config ]; then
              d_cflags="$CFLAGS -DYY_NO_INPUT"
            fi
            ( cd "$XROOT/SETUP/$d" && for f in *.c; do
                clang $d_cflags -I"$XROOT/SETUP/$d" -c \
                  -o "$OBJROOT/SETUP/$d/${f%.c}.o" "$f" || exit 1
              done ) || { ok=0; echo "COMPILE FAILED: SETUP/$d"; setup_failed="$setup_failed $d(compile)"; }
            if [ "$ok" = 1 ] && ls "$OBJROOT/SETUP/$d"/*.o >/dev/null 2>&1; then
              # kextsymboltool needs NXGetLocalArchInfo (libmacho/arch.c),
              # the swap_* family (libstuff/bytesex.c) and uuid_generate.
              # Those two archives are noinst_LTLIBRARIES, so `make install`
              # never installs them; they are staged in Stage 5b from the
              # cctools build tree. Without them the link fails with
              #     undefined reference to `NXGetLocalArchInfo'
              #     undefined reference to `swap_mach_header_64'
              #     undefined reference to `uuid_generate'   (40378282825)
              # The archives must come AFTER the objects that need them.
              SETUP_LIBS="-L/usr/local/lib -lbsdcompat"
              # Resolve these here rather than reusing CT_ARCHIVES/CT_LIBS:
              # those are computed further down in this same script, so at
              # this point they are still unset. Derive from the staged
              # copies directly so this block is order-independent.
              ct_lib="$RUNNER_TEMP/cross/lib"
              ct_flags=""
              for lib in macho stuff; do
                if [ -f "$ct_lib/lib$lib.a" ]; then
                  ct_flags="$ct_flags -l$lib"
                else
                  echo "::warning::missing $ct_lib/lib$lib.a"
                fi
              done
              if [ -n "$ct_flags" ]; then
                SETUP_LIBS="$SETUP_LIBS -L$ct_lib $ct_flags -luuid"
              else
                echo "::warning::no cctools archives; kextsymboltool will not link"
              fi
              # __cxa_demangle is a libc++abi symbol (NOT libstdc++, so
              # clang++/-lstdc++ does not supply it). Link it when the
              # unversioned library is present; kextsymboltool uses demangling
              # only to print symbol names in mismatch diagnostics.
              CXXABI_STUB=""
              if [ -e /usr/lib/x86_64-linux-gnu/libc++abi.so ]; then
                SETUP_LIBS="$SETUP_LIBS -lc++abi"
                echo "  linking -lc++abi for __cxa_demangle"
              else
                # Last resort: a stub returning NULL. kextsymboltool then
                # prints the mangled name instead of the demangled one, which
                # is cosmetically worse and functionally identical.
                echo "::warning::libc++abi.so absent; providing a __cxa_demangle stub"
                cat > "$RUNNER_TEMP/cxa_stub.c" <<'CXAEOF'
          /* Minimal stand-in for libc++abi's __cxa_demangle. Returns NULL so
           * the caller falls back to printing the mangled name. */
          #include <stddef.h>
          char *__cxa_demangle(const char *mangled, char *buf, size_t *len,
                               int *status)
          {
            (void)mangled; (void)buf; (void)len;
            if (status) { *status = -2; }
            return NULL;
          }
          CXAEOF
                cc -c -o "$RUNNER_TEMP/cxa_stub.o" "$RUNNER_TEMP/cxa_stub.c"
                CXXABI_STUB="$RUNNER_TEMP/cxa_stub.o"
                SETUP_LIBS="$SETUP_LIBS $CXXABI_STUB"
              fi
              # Print the exact command so link order is observed, not assumed.
              echo "LINK CMD: clang -o $OBJROOT/SETUP/$d/$d $OBJROOT/SETUP/$d/*.o $SETUP_LIBS"
              clang -o "$OBJROOT/SETUP/$d/$d" "$OBJROOT/SETUP/$d"/*.o \
                $SETUP_LIBS || { echo "LINK FAILED: SETUP/$d"; setup_failed="$setup_failed $d(link)"; }
              ls -la "$OBJROOT/SETUP/$d/" | head -20
            fi
          done
          echo '--- output dirs (a missing dir here explains a stub compile) ---'
          for d in $SETUP_DIRS; do
            if [ -d "$OBJROOT/SETUP/$d" ]; then
              echo "  $d: $(ls -1 "$OBJROOT/SETUP/$d" | tr '\n' ' ')"
            else
              echo "  $d: DIR MISSING"
            fi
          done
          echo '--- which tools got built ---'
          find "$OBJROOT/SETUP" -maxdepth 2 -type f -executable -exec ls -la {} \; || true
          # Report N of M with M printed and its source stated, so the
          # denominator can never silently be wrong again. Each tool counts
          # as built only if an executable of that name exists in its dir.
          built=0; total=0; built_list=""; missing_list=""
          for d in $SETUP_DIRS; do
            total=$((total + 1))
            if [ -x "$OBJROOT/SETUP/$d/$d" ]; then
              built=$((built + 1)); built_list="$built_list $d"
            else
              missing_list="$missing_list $d"
            fi
          done
          echo "SETUP built: $built of $total (list: $SETUP_DIRS)"
          echo "  built:${built_list:- <none>}"
          echo "  missing:${missing_list:- <none>}"
          echo "Stage 5b verdict:${setup_failed:- all SETUP tools built}"
          if [ -n "$setup_failed" ]; then
            echo "::error::Stage 5b could not build:$setup_failed"
            exit 1
          fi

      # ------------------------------------------- stage 6: the real thing
      - name: "Stage 6: make installhdrs + install (this is the build)"
        id: build
        if: inputs.deep != 'false'
        continue-on-error: true
        run: |
          set -x
          export PATH="$RUNNER_TEMP/cross/bin:/usr/local/bin:$PATH"

          # Re-state the capture directory HERE, not only in Stage 5. `export`
          # does not survive across steps, and Stage 5's value never reached
          # this one -- which is why run 40406236502 wrote its captures to
          # $RUNNER_TEMP/migcom-streams (a path the shim inherited only
          # indirectly, from a .defs file) and never uploaded them. Stage 6 is
          # the step whose mig calls actually fail, so its streams are the
          # ones worth keeping.
          export MIGCOM_SHIM_DUMP="$GITHUB_WORKSPACE/migcom-streams"
          mkdir -p "$MIGCOM_SHIM_DUMP"
          echo "MIGCOM_SHIM_DUMP=$MIGCOM_SHIM_DUMP"

          XROOT="$GITHUB_WORKSPACE/dxb/xnu"
          FAKEROOT="$GITHUB_WORKSPACE/dxb/fakeroot"
          OBJROOT="$GITHUB_WORKSPACE/dxb/build/xnu.obj"
          mkdir -p "$FAKEROOT" "$OBJROOT"
          cd "$XROOT"

          # HOST_* must be passed explicitly: MakeInc.cmd resolves them with
          # `xcrun -find` and an empty value turns `$(HOST_BISON) -y -d ...`
          # into a bare `y -d ...` (that is what run 40359414251 hit).
          # HOST_OS_VERSION was also empty, producing -mmacosx-version-min=
          # with no value.

          # ---------------------------------------------------------------
          # Preflight: print every host tool installhdrs can reach, resolved
          # or not, BEFORE make runs. Visibility only -- no behaviour change.
          #
          # The header chain is INSTALLHDRS_RULE_template (MakeInc.rule:63-88)
          #     $$(UNIFDEF) $(4) $$< > ...unifdef.$$$$; then
          #     $$(DECOMMENT) ...unifdef.$$$$ r > ...strip.$$$$; then
          #     $$(INSTALL) ...
          # plus REPLACECONTENTS for the .UNIFDEF_FLAGS stamp (MakeInc.rule:74).
          # unifdef was missing and cost a round trip; this line makes the
          # next missing one visible for free instead of an hour later.
          # ---------------------------------------------------------------
          echo '=== installhdrs host tools (preflight) ==='
          for t in unifdef sed awk grep cpp m4 bison flex perl python3 \
                   nm strip otool lipo install_name_tool codesign_allocate; do
            printf '  %-18s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo MISSING)"
          done
          for t in decomment installfile replacecontents setsegname kextsymboltool config; do
            printf '  %-18s %s\n' "$t" "$([ -x "$OBJROOT/SETUP/$t/$t" ] && echo "$OBJROOT/SETUP/$t/$t" || echo MISSING)"
          done
          echo "  UNIFDEF=unifdef is passed on the make line: $(command -v unifdef || echo 'BUT NOT INSTALLED')"

          # These three must be REAL environment variables, not just entries in
          # the make_flags array below. Inside `make_flags=( ... )` each
          # `MIG=/path` is a string element handed to make on the command line;
          # it never assigns a shell variable and never reaches mig.sh's
          # environment. Assign and export them HERE, before the array, so
          # mig.sh:74 `[ -z "${MIGCC}" ]` and mig.sh:84 `M=${MIGCOM-...}` both
          # take our values. Run 40401667613 measured all three as <UNSET>.
          MIG="$RUNNER_TEMP/cross/bin/mig"
          MIGCOM="$RUNNER_TEMP/cross/bin/migcom"
          MIGCC="$RUNNER_TEMP/cross/bin/migcc-shim"
          export MIG MIGCOM MIGCC

          # Capture the exact bytes fed to migcom, and settle two questions the
          # log has not answered in four runs:
          #   1) is the removed MACHNINE define still in this environment?
          #      Committed in 11bacbb, removed in c1f8999 -- but if anything
          #      exported or baked it earlier in the job, machine_types.defs
          #      becomes a no-op on FIRST entry and natural_t vanishes.
          #   2) does cpp emit the basic types once or twice?
          #      mig reports six re-declarations; this counts them at source.
          echo "DUMP: -D_MACHNINE in env: $(env | grep -c MACHNINE)"
          echo "DUMP: MACHNINE in MIGFLAGS: $(echo "${MIGFLAGS:-<unset>}")"
          # Two edits were fighting over this variable: one set it to
          # $GITHUB_WORKSPACE at the top of the step so the upload step would
          # collect it, and this line reset it to $RUNNER_TEMP. $RUNNER_TEMP is
          # exactly why run 40406236502's Stage 6 captures were written but never
          # uploaded -- the artifact only ever contained the Stage 5 probes,
          # whose streams are clean, which is why the failures looked
          # unexplained. One value only, and it must be under the workspace.
          export MIGCOM_SHIM_DUMP="$GITHUB_WORKSPACE/migcom-streams"
          rm -rf "$MIGCOM_SHIM_DUMP"; mkdir -p "$MIGCOM_SHIM_DUMP"
          echo "DUMP: writing captures to $MIGCOM_SHIM_DUMP"

          # Build the cc-shim INSIDE this step. `export` does not survive
          # between steps -- the same mistake that silently sent the Stage 6
          # migcom captures to $RUNNER_TEMP and lost them -- so Stage 6 must
          # not depend on a variable Stage 5 set. It creates its own.
          #
          # Needed because kernel objects fail with
          #     clang: error: unsupported option '-arch' for target
          #            'x86_64-pc-linux-gnu'
          # and the same for -mmacosx-version-min. MIGFLAGS and the kernel
          # CFLAGS both carry `-arch arm64e -mmacosx-version-min=13.3`
          # (MakeInc.def:225-270, :70). A Linux clang cannot target Darwin and
          # does not need to: the Mach-O layout comes from cctools and OUR
          # linker. Everything else passes through untouched.
          CC_SHIM="$RUNNER_TEMP/cross/bin/cc-shim"
          mkdir -p "$(dirname "$CC_SHIM")"
          {
            echo '#!/bin/bash'
            echo 'args=()'
            echo 'while [ $# -gt 0 ]; do'
            echo '  case "$1" in'
            # -arch is deliberately NOT stripped: the Darwin wrapper keeps it
            # and clang honours it once --target=aarch64-apple-darwin is set.
            # Stripping it would discard the architecture the build asked for.
            echo '    -arch) args+=("$1" "$2"); shift 2 ;;'
            echo '    -mmacosx-version-min=*|-miphoneos-version-min=*|-mios-version-min=*) shift ;;'
            echo '    -mkernel|-msoft-float|-mno-soft-float) shift ;;'
            echo '    *) args+=("$1"); shift ;;'
            echo '  esac'
            echo 'done'
            # DELEGATE to the Darwin-target wrapper that xcrun -find clang
            # answers with, instead of pinning a host clang. Dropping -arch and
            # then running plain /usr/bin/clang would silently build x86_64
            # Linux objects again -- the exact failure this shim exists to fix.
            # The wrapper itself handles -arch (clang accepts it once a Darwin
            # --target is set); this shim only removes what clang rejects even
            # with that target.
            echo 'if [ -x /usr/local/bin/xtool-clang ]; then'
            echo '  exec /usr/local/bin/xtool-clang "${args[@]}"'
            echo 'fi'
            echo 'exec /usr/bin/clang --target=aarch64-apple-darwin "${args[@]}"'
          } > "$CC_SHIM"
          chmod +x "$CC_SHIM"
          # The same shim, delegating to xtool-clang++ instead. The C++ half is
          # not cosmetic: kernel .cpp files (iokit, and the C++ parts of bsd)
          # are compiled by $(CXX), and 127 of 127 `unsupported option '-arch'`
          # errors in run 40413177461 came from clang++ precisely because
          # make_flags passed CXX=clang++ as a literal.
          # One sed, both substitutions, no intermediate state. A chained
          # `sed -i` after a redirect failed under this runner with
          # "cannot rename ... Invalid cross-device link" and would have left
          # the literal ${CXX_BIN} in the script -- an empty expansion at
          # runtime, i.e. `exec --target=...` and no compiler at all.
          CXX_SHIM="$RUNNER_TEMP/cross/bin/cxx-shim"
          sed -e 's|xtool-clang |xtool-clang++ |' \
              -e 's|^exec /usr/bin/clang |exec /usr/bin/clang++ |' \
              "$CC_SHIM" > "$CXX_SHIM"
          chmod +x "$CXX_SHIM"
          export CC_SHIM CXX_SHIM
          export XTOOL_DUMP="$GITHUB_WORKSPACE/xtool-argv"
          rm -rf "$XTOOL_DUMP"; mkdir -p "$XTOOL_DUMP"
          echo "  xtool argv dump -> $XTOOL_DUMP"
          echo "  Stage 6 cc-shim:  $CC_SHIM"
          echo "  Stage 6 cxx-shim: $CXX_SHIM"
          grep -n 'exec' "$CXX_SHIM" | sed 's/^/    cxx-shim: /'
          printf 'class P { public: int v; }; int probe(void){P p; p.v=0; return p.v;}\n' > "$RUNNER_TEMP/ccprobe.cpp"
          if "$CXX_SHIM" -arch arm64e -mmacosx-version-min=13.3 -c \
               "$RUNNER_TEMP/ccprobe.cpp" -o "$RUNNER_TEMP/ccprobe.o" 2>"$RUNNER_TEMP/cxx.err"; then
            echo "  cxx-shim PROBE: C++ object built"
          else
            echo "::error::cxx-shim PROBE failed: $(head -2 "$RUNNER_TEMP/cxx.err" | tr '\n' ' ')"
          fi
          # Two-sided probe: the Darwin flags must be gone AND a real compile
          # must still succeed, so a shim that strips too much cannot pass.
          printf 'int probe(void){return 0;}\n' > "$RUNNER_TEMP/ccprobe.c"
          if "$CC_SHIM" -arch arm64e -mmacosx-version-min=13.3 -c \
               "$RUNNER_TEMP/ccprobe.c" -o "$RUNNER_TEMP/ccprobe.o" 2>"$RUNNER_TEMP/cc.err"; then
            echo "  cc-shim PROBE: Darwin switches stripped, object built"
          else
            echo "::error::cc-shim PROBE failed: $(head -2 "$RUNNER_TEMP/cc.err" | tr '\n' ' ')"
          fi

          make_flags=(
            SDKROOT=macosx HOST_SDKROOT=macosx
            HOST_OS_VERSION=13.3
            TARGET_CONFIGS="$KERNEL_CONFIG ARM64 $MACHINE_CONFIG"
            ARCH_CONFIGS=ARM64
            BUILD_WERROR=0 BUILD_LTO=0 VERBOSE=YES CONCISE=0
            DSTROOT="$FAKEROOT" FAKEROOT_DIR="$FAKEROOT"
            OBJROOT="$OBJROOT" SYMROOT="$GITHUB_WORKSPACE/dxb/build/xnu.sym"
            # CXX used to be the literal `clang++`. Because that arrives on the
            # make command line, $(origin CXX) is "command line", so
            # MakeInc.cmd:186-188 -- which would have asked
            # `xcrun -find clang++` and got the cross wrapper -- never ran.
            # Measured in 40413177461: every single `unsupported option
            # '-arch' for target 'x86_64-pc-linux-gnu'` came from clang++
            # (127 of 127), none from clang, because CC went through the
            # wrapper and CXX did not. CXX now goes through it too.
            CC="$CC_SHIM" CXX="$CXX_SHIM"
            # Order matters. $CCTOOLS_FOREIGN_INCLUDE (machinc) must come
            # BEFORE cctools/include so that our self-contained
            # libkern/_OSByteOrder.h shadows the Apple original that includes
            # <sys/_types.h>. machinc is already on this path, so the earlier
            # "mach/mach_init.h / sys/_types.h not found" failures were not a
            # missing -I at all: Stage 1c simply never symlinked foreign/sys
            # (and the original _OSByteOrder.h dragged that header in).
            # Both are fixed at the source now; the ordering keeps the
            # self-contained override authoritative.
            HOST_CC="clang -isystem $CCTOOLS_FOREIGN_INCLUDE -include /usr/local/include/compat.h -I$GITHUB_WORKSPACE/cctools-port/cctools/include"
            HOST_CXX="clang++ -isystem $CCTOOLS_FOREIGN_INCLUDE -include /usr/local/include/compat.h -I$GITHUB_WORKSPACE/cctools-port/cctools/include"
            HOST_LDFLAGS="-L/usr/local/lib -lbsdcompat -L$CT_ARCHIVES $CT_LIBS"
            LDFLAGS="-L/usr/local/lib -lbsdcompat -L$CT_ARCHIVES $CT_LIBS"
            HOST_BISON=bison HOST_FLEX=flex HOST_GM4=m4
            MIG="$RUNNER_TEMP/cross/bin/mig"
            MIGCOM="$RUNNER_TEMP/cross/bin/migcom"
            MIGCC="$RUNNER_TEMP/cross/bin/migcc-shim"
            IIG="$RUNNER_TEMP/cross/bin/iig"

            LIPO=lipo STRIP=strip AR=ar RANLIB=ranlib NM=nm OTOOL=otool
            LIBTOOL=libtool DSYMUTIL=true NMEDIT=true UNIFDEF=unifdef GIT=git
            HOST_CODESIGN=true HOST_CODESIGN_ALLOCATE=true
            DO_CTFMERGE=0
            SYSCTL_HW_PHYSICALCPU=4 SYSCTL_HW_LOGICALCPU=4
            KERNEL_BUILDS_IN_PARALLEL=1
            RC_DARWIN_KERNEL_VERSION=22.6.0
            TIGHTBEAMC=tightbeamc-not-supported
            LDFLAGS_EXTRA="-L$RUNNER_TEMP -l:copyfile.o -L$RUNNER_TEMP/cross/lib -lmacho -lstuff -luuid"
          )

          # --- the three values the MIG rule will actually see ------------
          # Measured, not assumed. mig.sh (Apple, bootstrap_cmds) resolves:
          #     mig.sh:66  scriptPath = realpath $0        -> cross/bin/mig
          #     mig.sh:68  migcomPath = ../libexec/migcom  -> cross/libexec/migcom
          #     mig.sh:84  M=${MIGCOM-${migcomPath}}       <-- ENV VAR wins
          #     mig.sh:74  if [ -z "${MIGCC}" ]            <-- ENV VAR wins
          # Passing MIGCOM/MIGCC as make variables is NOT enough: mig.sh is
          # run as a bare `$(MIG)` by the makefile, so it only sees the
          # environment. Run 40401122633 proved that by dying with
          #     cross/bin/mig: line 183: cross/bin/migcom: No such file or directory
          # because migcomPath resolved to cross/libexec/migcom, which we
          # never populate (we install to cross/bin/).
          echo '=== STAGE 6 ENV: the MIG trio, before make ==='
          for v in MIG MIGCOM MIGCC; do
            eval "p=\$$v"
            if [ -z "$p" ]; then
              echo "  $v = <UNSET>  <-- FAIL"
            elif [ ! -e "$p" ]; then
              echo "  $v = $p  <-- DOES NOT EXIST"
            elif [ ! -x "$p" ]; then
              echo "  $v = $p  <-- NOT EXECUTABLE"
            else
              echo "  $v = $p  [exists, +x]"
            fi
          done
          # NOT `-version`. migcom reads .defs from STDIN and takes no
          # positional path, so `-version` is consumed as INPUT, not as a flag:
          # empty stdin -> yyparse finds no subsystem -> global.c:76 fatal.
          # That check could never pass, so it printed a fatal on every run --
          # a check that always fails is as much noise as one that cannot fail.
          # Prove the pipeline instead: pipe a one-line subsystem through the
          # real migcom and require exit 0. That exercises shim, stdin handling,
          # and the binary itself, which `[ -x ]` does not.
          _vc=$(printf 'subsystem\nKernelUser\nvprobe 1000;\n' | "$MIGCOM" -header /dev/null 2>&1)
          _vrc=$?
          if [ "$_vrc" = 0 ]; then
            echo "  MIGCOM stdin pipeline: OK (subsystem parsed, exit 0)"
          else
            echo "  MIGCOM stdin pipeline: FAILED (exit $_vrc) -- first lines:"
            echo "$_vc" | head -5 | sed 's/^/    /'
          fi
          echo "  MIGCOM via libexec (what mig.sh would use without the env var):"
          echo "    $RUNNER_TEMP/cross/libexec/migcom -> $(readlink -f "$RUNNER_TEMP/cross/libexec/migcom" 2>/dev/null || echo '(absent)')"
          echo '=== END STAGE 6 ENV ==='

          echo '===================== installhdrs ====================='
          # `-k` keeps going so we see every independent failure, but the exit
          # status is what decides the step. It used to be `|| true`, which is
          # why a run could report MAKE FAILED and still go green.
          set +e

          make installhdrs -k "${make_flags[@]}" \
            2>&1 | tee "$GITHUB_WORKSPACE/hdrs.log" | tail -80
          hdrs_rc=${PIPESTATUS[0]}
          echo "installhdrs exit status: $hdrs_rc"
          echo '--- first error: lines (headers) ---'
          grep -nE 'error:' "$GITHUB_WORKSPACE/hdrs.log" | head -30 || true

          echo '===================== install ====================='
          make install -k "${make_flags[@]}" MAKEFLAGS=-k \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -150
          build_rc=${PIPESTATUS[0]}
          echo '===================== MIGCOM STREAM CENSUS ====================='
          # ONLY the ${name}.$$_${seq}.stream files are the stream migcom
          # actually receives: they are written immediately before `exec`.
          # The plain <label>.stream files are captured EARLIER, before the
          # mach_msg_type_number_t injection rewrites $hoisted, so they are a
          # different document. Globbing *.stream mixed the two.
          for f in "$MIGCOM_SHIM_DUMP"/*.*_*.stream; do
            [ -f "$f" ] || continue
            echo "-- $(basename "$f") ($(wc -l < "$f") lines)"
            echo "   (stream file: $(basename "$f"), $(wc -l < "$f") lines)"
            echo "   MACHNINE guard occurrences: $(grep -c 'MACHNINE_TYPES_DEFS' "$f" || true)   (2 = ifndef+define, expect 2)"
            echo "   type short  declarations:   $(grep -cE '^[[:blank:]]*type[[:blank:]]+short[[:blank:]]*=' "$f" || true)   (2 => cpp emitted twice)"
            echo "   type int    declarations:   $(grep -cE '^[[:blank:]]*type[[:blank:]]+int[[:blank:]]*=' "$f" || true)"
            echo "   type natural_t declarations:$(grep -cE '^[[:blank:]]*type[[:blank:]]+natural_t[[:blank:]]*=' "$f" || true)   (0 => guard fired on FIRST entry)"
            echo "   type int64  declarations:   $(grep -cE '^[[:blank:]]*type[[:blank:]]+int64[[:blank:]]*=' "$f" || true)"
            echo "   FIRST 40 LINES OF THE STREAM, VERBATIM (cat -A to expose CR):"
            head -40 "$f" | cat -n | sed 's/^/      /' || true
            echo "   EVERY int64/char declaration line, verbatim:"
            grep -nE '^[[:blank:]]*type[[:blank:]]+(int64|char)[[:blank:]]*=' "$f" | sed 's/^/      /' || echo "      (none)"
            echo "   any line CONTAINING int64 (not just declarations):"
            grep -n 'int64' "$f" | head -8 | sed 's/^/      /' || echo "      (none)"
            echo "   include-open counts (each file that cpp ENTERED, '1' flag):"
            grep -oE '^# [0-9]+ "[^"]+" 1$' "$f" | sed -E 's/^# [0-9]+ "//; s/" 1$//' \
              | sed -E 's#.*/##' | sort | uniq -c | sort -rn | sed 's/^/      /' || true
            echo "   std_types.defs opens (must be 1; >1 means the include guard failed):"
            grep -cE '^# [0-9]+ ".*/std_types\.defs" 1$' "$f" || true
            echo "   natural_t CONTROL (declarations; must be exactly 1):"
            grep -cE '^[[:blank:]]*type[[:blank:]]+natural_t[[:blank:]]*=' "$f" || true
            echo "   file-opening #line markers (first 12):"
            grep -nE '^[[:blank:]]*# *[0-9]+ "' "$f" | head -12 | sed 's/^/      /'
          done
          echo '===================== END MIGCOM STREAM CENSUS ====================='

          echo "install exit status: $build_rc"
          set -e
          echo '--- SETUP host tools actually present? ---'
          find "$OBJROOT/SETUP" -maxdepth 2 -type f -executable | sort || true
          echo '--- VERBATIM argv the compiler wrapper received (first 40) ---'
          cat "$XTOOL_DUMP/argv.txt" 2>/dev/null | head -40 || echo "(no argv captured)"
          echo '--- $(origin AS) / $(origin CXX) as make sees them ---'
          make -s --no-print-directory -f /dev/stdin <<'MKE' 2>&1 | head -6 || true
          AS_SOFTWARE := $(origin AS)
          CXX_SOFTWARE := $(origin CXX)
          CC_SOFTWARE := $(origin CC)
          $(info origin AS=$(origin AS) CXX=$(origin CXX) CC=$(origin CC))
          MKE
          echo '--- first real error, in order ---' 
          # Widen beyond 'error:': the first real failures tonight were
          # "Error 127" (missing interpreter) and "No such file", neither of
          # which contains the string `error:`. A grep that only knows one
          # spelling printed nothing while the build was dying.
          grep -nE 'fatal error:|error:|\*\*\* |Error [0-9]+|No such file|not found' \
            "$GITHUB_WORKSPACE/build.log" | head -25 || echo "(no error-ish lines)"
          echo '--- first error inside a .c/.cpp/.s/.cc compile, verbatim ---'
          grep -nE '^[^ ].*\.(c|cpp|s|cc):[0-9]+:[0-9]+: (error|fatal error)' \
            "$GITHUB_WORKSPACE/build.log" | head -5 || echo "(no compile errors: build died earlier)"
          # --- what did cpp actually emit? ---------------------------------
          # mig reports six type RE-declarations (error.c:69 prints lineno-1,
          # so its :84/:90/:38/:39/:61/:62 are really :85/:91/:39/:40/:62/:63,
          # all genuine `type` lines). Either cpp emitted them twice, or migcom
          # duplicated them internally. These counts decide which, and they
          # decide it from the bytes rather than from reasoning about guards.

          echo "Stage 6 verdict: installhdrs=$hdrs_rc install=$build_rc"

          # --- REPLAY: feed a captured stream straight back to the real migcom
          # The captures and migcom's own errors still disagree. Every stream we
          # can inspect contains exactly ONE `type int64 = int64_t;`, and the
          # census of that same stream prints "(no same-file:line duplicate)",
          # yet migcom reports `std_types.defs line 84: overriding previous
          # definition of int64` -- and error.c:69 prints lineno-1, so that is
          # :85, the one and only int64 line.
          #
          # One of those two observations must be wrong. The only way to tell is
          # to run the same bytes through the same migcom and look at what it
          # does, instead of at the shim's opinion of them. Replay reproduces
          # the error  -> the fault is in the bytes and the capture is faithful.
          # Replay succeeds      -> migcom saw different bytes than we captured,
          #                         and the capture is what needs fixing.
          replay_dir="$GITHUB_WORKSPACE/migcom-streams"
          replay_one=$(ls "$replay_dir"/*.stream 2>/dev/null | head -1 || true)
          if [ -n "$replay_one" ]; then
            echo "--- REPLAY of $(basename "$replay_one") ---"
            # Drop the "# argv:" line; everything after it is byte-for-byte what
            # migcom received on stdin.
            tail -n +2 "$replay_one" > "$RUNNER_TEMP/replay.defs"
            echo "replay input lines: $(wc -l < "$RUNNER_TEMP/replay.defs")"
            n64=$(grep -cE '^type[[:space:]]+int64[[:space:]]*=' "$RUNNER_TEMP/replay.defs" || true)
            nch=$(grep -cE '^type[[:space:]]+char[[:space:]]*=' "$RUNNER_TEMP/replay.defs" || true)
            echo "type int64 decls in replay input: ${n64:-0}"
            echo "type char  decls in replay input: ${nch:-0}"
            # Bypass the shim entirely: hand the bytes to the REAL migcom, so
            # nothing of ours can transform them a second time.
            set +e
            "$MIGCOM" -server /dev/null -user /dev/null \
                      -header "$RUNNER_TEMP/rp.h" -sheader "$RUNNER_TEMP/rpS.h" \
                      < "$RUNNER_TEMP/replay.defs" 2> "$RUNNER_TEMP/replay.err"
            replay_rc=$?
            set -e
            echo "REPLAY raw migcom exit: $replay_rc"
            echo "REPLAY stderr:"
            sed -n '1,20p' "$RUNNER_TEMP/replay.err"
            echo "REPLAY produced: $(ls -1 "$RUNNER_TEMP"/rp*.h 2>/dev/null | wc -l) header(s)"
            if [ "$replay_rc" -eq 0 ]; then
              echo "REPLAY VERDICT: migcom ACCEPTS the captured bytes."
              echo "  The duplicates did not come from this stream."
            else
              echo "REPLAY VERDICT: migcom REJECTS the captured bytes."
              echo "  The capture is faithful; the fault is in the stream."
            fi

            # --- CONTROL: delete the `type int64` line and replay again -------
            # Reading type.c/parser.y/lexxer.c has now failed to explain this
            # twice. If int64 really is declared twice, removing the one visible
            # declaration must make the error go away or move to another name.
            # If the message stays byte-identical, it was never about this line.
            #
            # Written so it CAN fail in the direction that matters: it prints the
            # before/after counts, so a grep that silently matched nothing cannot
            # be mistaken for a pass.
            grep -vE '^type[[:space:]]+int64[[:space:]]*=' "$RUNNER_TEMP/replay.defs" \
              > "$RUNNER_TEMP/replay_no64.defs" || true
            b64=$(grep -cE '^type[[:space:]]+int64[[:space:]]*=' "$RUNNER_TEMP/replay.defs" || true)
            a64=$(grep -cE '^type[[:space:]]+int64[[:space:]]*=' "$RUNNER_TEMP/replay_no64.defs" || true)
            echo "CONTROL: int64 decls before=${b64:-0} after=${a64:-0}"
            set +e
            "$MIGCOM" -server /dev/null -user /dev/null \
                      -header "$RUNNER_TEMP/rc.h" -sheader "$RUNNER_TEMP/rcS.h" \
                      < "$RUNNER_TEMP/replay_no64.defs" 2> "$RUNNER_TEMP/control.err"
            control_rc=$?
            set -e
            echo "CONTROL raw migcom exit: $control_rc"
            echo "CONTROL overriding-definition lines:"
            grep 'overriding previous definition' "$RUNNER_TEMP/control.err" | sed -n '1,10p' || echo "  (none)"
            if grep -q 'overriding previous definition of int64' "$RUNNER_TEMP/control.err"; then
              echo "CONTROL VERDICT: int64 STILL reported with its only declaration"
              echo "  removed -> the name does not come from this stream's int64 line."
            elif [ "$control_rc" -eq 0 ]; then
              echo "CONTROL VERDICT: removing the int64 line FIXES it -> int64 is"
              echo "  the genuine cause, and there is exactly one such line."
            else
              echo "CONTROL VERDICT: error persists under a different name:"
              grep 'overriding previous definition' "$RUNNER_TEMP/control.err" | head -3
            fi
          else
            echo "REPLAY: no captured streams present, skipped"
          fi

          if [ "$build_rc" != 0 ] || [ "$hdrs_rc" != 0 ]; then
            echo "::error::Stage 6 failed (installhdrs=$hdrs_rc install=$build_rc)"
            exit 1
          fi

      - name: Summarise the first genuine failure
        if: always()
        run: |
          for f in hdrs.log build.log; do
            [ -f "$f" ] || continue
            echo "############ $f ############"
            echo "--- first 30 'error:' lines ---"
            grep -nE 'error:' "$f" | head -30 || echo "(none)"
            echo "--- first 15 'Error N' / '*** ' lines ---"
            grep -nE '^\*\*\* |Error [0-9]+|No such file' "$f" | head -15 || true
          done
          # Make the green-while-erroring condition self-reporting. Until
          # `continue-on-error` is removed from the stages that must be
          # honest, a run can conclude `success` while carrying real
          # ::error:: annotations -- that is exactly what run 40375312365
          # did (7 error lines, green summary, no kernel). Printing the
          # count here means the discrepancy is visible in the log rather
          # than something we have to remember to grep for.
          nerr=$(grep -c '::error::' "$GITHUB_WORKSPACE"/*.log 2>/dev/null | awk -F: '{s+=$2} END{print s+0}')
          echo "############ truth check ############"
          echo "::error:: count in build logs: ${nerr:-0}"
          echo "If this is non-zero while the run concludes 'success', the run is lying."
          echo "############ kernels produced ############"
          find dxb/fakeroot -name 'kernel.*' -exec ls -la {} \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-linux-logs
          path: |
            hdrs.log
            build.log
            migcom-streams/
          if-no-files-found: warn
          retention-days: 7

      - name: Collect kernel if one was produced
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          # `or true` here hid the fact that no kernel existed for several
          # runs. Keep the step non-fatal (it runs under `always()` alongside
          # failure diagnostics) but make the absence loud and explicit.
          if ls out/kernel.* >/dev/null 2>&1; then
            echo "KERNEL ARTIFACT: PRESENT"
            ls -la out/kernel.*
            (cd out && sha256sum kernel.* > SHA256SUMS) || true
            cat out/SHA256SUMS 2>/dev/null || true
          else
            echo "KERNEL ARTIFACT: ABSENT -- the build produced no kernel.*"
            echo "::warning::No kernel.* was produced by this run"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-linux
          path: out/
          if-no-files-found: warn
